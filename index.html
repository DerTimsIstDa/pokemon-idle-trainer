  <div class="bo-floats" data-ref="floats" aria-hidden="true"></div>
  <div class="bo-pban" data-ref="pban" aria-hidden="true"></div>
</div>
<div class="bo-bossbar bo-hud">
  <div class="bo-hex">${iconSvg(t1)}</div>
  <div class="bo-bossbar-main">
    <div class="bo-row"><span class="bo-name">${esc(boss.name)}</span><span class="bo-side"><span class="bo-phase" data-ref="phase" hidden></span><span class="bo-lv">${T.lv} ${o.boss.level}</span></span></div>
    ${hpBar('bo-hp--boss', `${T.kp} ${boss.name}`, o.boss.ticks || [0.5, 0.25])}
    <div class="bo-row" style="justify-content:flex-end"><span class="bo-kp" data-ref="bkp"></span></div>
  </div>
</div>
<div class="bo-msg bo-hud" data-ref="msg" data-kind="idle">
  <div class="bo-info-top"><b data-ref="ititle" aria-live="polite"></b><span data-ref="istate"></span></div>
  <div class="bo-info-sub" data-ref="isub"></div>
  <div class="bo-meter-bar" aria-hidden="true"><i class="bo-meter-zone" data-ref="mzone" hidden></i><i class="bo-meter-fill" data-ref="mfill"></i></div>
</div>
<div class="bo-dodgerow bo-hud">
  <button type="button" class="bo-dodge" data-ref="dodge" data-state="idle" aria-disabled="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17c3-1 5-3.5 6.5-7M14 4l2.5 6.5L23 13"/><path d="M2 21h7"/></svg><span data-ref="dodgelabel">${esc(T.dodge)}</span></button>
</div>
<div class="bo-actions bo-hud">
  <button type="button" class="bo-btn" data-act="potion">${esc(T.potion)} <b data-ref="potions"></b></button>
  <button type="button" class="bo-btn" data-act="x">${esc(T.xAttack)} <b data-ref="xattacks"></b></button>
  <button type="button" class="bo-btn bo-btn--quit" data-act="giveup">${esc(T.giveUp)}</button>
</div>`;

    const ref = {};
    root.querySelectorAll('[data-ref]').forEach((el) => { ref[el.dataset.ref] = el; });
    ref.bossfx.appendChild(bossImg);
    ref.player.firstElementChild.appendChild(playerImg);
    // Patch 8.1: Kopien zum Aufblitzen
    let bflash = mkFlash(bossImg), pflash = mkFlash(playerImg);
    ref.bossfx.appendChild(bflash); ref.playerfx.appendChild(pflash);

    const state = { bossHp: o.boss.hp ?? o.boss.maxHp, bossMax: o.boss.maxHp, playerHp: o.player.hp ?? o.player.maxHp, playerMax: o.player.maxHp, team: o.player.team || [] };
    const bossBar = root.querySelector('.bo-hp--boss'), playerBar = root.querySelector('.bo-hp--player');

    // Patch 8.1: Texte und Balken nur anfassen, wenn sich etwas ändert. Jede Änderung an Text oder Breite lässt den
    // Browser das Layout neu berechnen, im Kampf sonst in jedem Bild.
    const txt = new WeakMap();
    const setText = (el, t) => { t = String(t); if (txt.get(el) !== t) { txt.set(el, t); el.textContent = t; } };
    const clamp01 = (v) => Math.max(0, Math.min(1, +v || 0));
    const setScale = (el, r) => { const v = Math.round(clamp01(r) * 1000) / 1000; if (el._sx !== v) { el._sx = v; el.style.transform = `scaleX(${v})`; } };
    const setAttr = (el, k, v) => { v = String(v); if (el.getAttribute(k) !== v) el.setAttribute(k, v); };
    function paintBar(bar, val, max, kpEl) {
      const r = max > 0 ? Math.max(0, Math.min(1, val / max)) : 0;
      setScale(bar.querySelector('.bo-hp-fill'), r);
      setScale(bar.querySelector('.bo-hp-trail'), r);
      const lv = hpLevel(r); if (bar.dataset.level !== lv) bar.dataset.level = lv;
      setAttr(bar, 'aria-valuemax', Math.round(max));
      setAttr(bar, 'aria-valuenow', Math.round(val));
      setText(kpEl, `${fmt(val)} / ${fmt(max)} ${T.kp}`);
    }

    // Größe und Position der Pokémon. Bilder werden nie größer als ihre Originalauflösung.
    // Patch 8.1: Pixelart-Sprites werden in ganzen Schritten vergrößert, so groß es die Arena erlaubt: Jedes Sprite-Pixel
    // wird zu einem Block aus n x n echten Displaypixeln (n ganzzahlig, bei 2- oder 3-facher Pixeldichte also auch halbe
    // oder Drittel-Schritte in CSS-Pixeln). Mit image-rendering: pixelated bleibt jeder Block scharf.
    function pixFit(img, maxW, maxH, dpr) {
      const nw = img.naturalWidth || 1, nh = img.naturalHeight || 1;
      const n = Math.max(1, Math.min(Math.round(CONFIG.pixelMax * dpr), Math.floor(Math.min(maxW / nw, maxH / nh) * dpr + 1e-6)));
      return { w: (nw * n) / dpr, h: (nh * n) / dpr, n };
    }
    function layout() {
      const stage = ref.stage, W = stage.clientWidth, Hh = stage.clientHeight;
      if (!W || !Hh) return;
      // Patch 8.1: in einer flachen Arena (kleines Handy, Browser mit Leisten) wird das Namensbanner kleiner,
      // damit Boss und eigenes Pokémon Platz haben
      const short = Hh < 300;
      if (root._short !== short) { root._short = short; root.classList.toggle('bo--short', short); }
      const s = Math.max(W / VW, Hh / VH), ox = (W - VW * s) / 2, oy = Hh - VH * s;
      const ax = ox + AX * s, ay = oy + AY * s, arx = ARX * s, ary = ARY * s;
      const dpr = global.devicePixelRatio || 1;
      const cap = (img) => (img.naturalWidth / dpr) * CONFIG.maxUpscale;
      const snap = (v) => Math.round(v * dpr) / dpr;
      const lt = `translate(${ox}px,${oy}px) scale(${s})`;
      if (ref.lift.style.transform !== lt) { ref.lift.style.transform = lt; ref.liftfx.style.transform = lt; }
      // das Namensbanner oben links soll kein Pokémon verdecken (mit 4 px Abstand)
      const bn = ref.banner, bR = bn.offsetLeft + bn.offsetWidth + 4, bB = bn.offsetTop + bn.offsetHeight + 4;
      flBanner = [bn.offsetLeft - 2, bn.offsetTop - 2, bR - 2, bB - 2];

      const feetY = ay - ary * 0.12;
      let bx = Math.min(W - 8, ax + arx * 0.44), bw, bh;
      if (isPix(bossImg)) {
        // so groß, wie es passt: unter dem Banner oder rechts daneben, dann darf der Boss fast bis nach oben reichen
        const nw = bossImg.naturalWidth || 1, nh = bossImg.naturalHeight || 1, x0 = bx;
        const fit = (n) => {
          const w = (nw * n) / dpr, h = (nh * n) / dpr, top = feetY - h, lo = w / 2 + 6, hi = W - w / 2 - 6;
          if (top < 6 || lo > hi) return null;
          const x = Math.max(lo, Math.min(x0, hi));
          if (top >= bB) return { w, h, x };
          const xr = Math.max(x, bR + w / 2);
          return xr <= hi ? { w, h, x: xr } : null;
        };
        let f = null;
        for (let n = pixFit(bossImg, W * CONFIG.bossBox[0], Hh * CONFIG.bossBox[1], dpr).n; n >= 1 && !f; n--) f = fit(n);
        if (!f) { const w = nw / dpr; f = { w, h: nh / dpr, x: Math.max(w / 2 + 6, Math.min(x0, W - w / 2 - 6)) }; }
        bw = f.w; bh = f.h; bx = f.x;
      } else {
        bw = bh = Math.max(48, Math.min(W * 0.58, feetY - 60, cap(bossImg), (W - bx) * 2 - 8));
      }
      const bl = snap(bx - bw / 2), bt = snap(feetY - bh * (isPix(bossImg) ? 1 : 0.94));
      Object.assign(ref.boss.style, { width: bw + 'px', height: bh + 'px', left: bl + 'px', top: bt + 'px' });
      Object.assign(ref.bshadow.style, { width: bw * 0.72 + 'px', height: Math.max(10, bw * 0.17) + 'px', left: bx - bw * 0.36 + 'px', top: feetY - Math.max(10, bw * 0.17) * 0.5 + 'px' });
      Object.assign(ref.bhalo.style, { width: bw * 1.3 + 'px', height: bh * 1.15 + 'px', left: bx - bw * 0.65 + 'px', top: bt + bh * 0.5 - bh * 0.575 + 'px' });
      // Patch 8.1: das Phasenbanner nie auf den Boss: oben, wenn darüber Platz ist, sonst unten in der Arena
      const pbH = short ? 52 : 72, pbTop = bt - 6 - pbH >= 8 ? 12 : Math.max(feetY + 6, Hh - 8 - pbH);
      if (ref.pban._top !== pbTop) { ref.pban._top = pbTop; ref.pban.style.top = pbTop + 'px'; }

      // eigenes Pokémon (Patch 8.1: etwas höher, ganz sichtbar, mit hellem Schein dahinter, auch für dunkle Shinys;
      // reicht es bis unter das Banner, steht es tiefer, und nur wenn auch das nicht reicht, wird es kleiner)
      let pw, ph, px, pFeet;
      const placeP = () => {
        px = Math.max(pw * 0.5 + 8, ax - arx * 0.58);
        pFeet = Math.min(Hh - 14, ay + ary * 0.5);
        if (px - pw / 2 < bR && pFeet - ph < bB) pFeet = Math.min(Hh - 6, bB + ph);
      };
      if (isPix(playerImg)) {
        // in der flachen Arena darf es anteilig etwas höher sein, sonst blieben große Sprites winzig
        ({ w: pw, h: ph } = pixFit(playerImg, W * CONFIG.playerBox[0], Hh * (short ? 0.52 : CONFIG.playerBox[1]), dpr));
        placeP();
        if (px - pw / 2 < bR && pFeet - ph < bB) { ({ w: pw, h: ph } = pixFit(playerImg, W * CONFIG.playerBox[0], Math.max(1, Hh - 6 - bB), dpr)); placeP(); }
      } else { pw = ph = Math.max(40, Math.min(W * 0.36, Hh * 0.32, cap(playerImg))); placeP(); }
      const pl = snap(px - pw / 2), pt = snap(pFeet - ph * (isPix(playerImg) ? 1 : 0.95));
      Object.assign(ref.player.style, { width: pw + 'px', height: ph + 'px', left: pl + 'px', top: pt + 'px' });
      Object.assign(ref.pshadow.style, { width: pw * 0.7 + 'px', height: Math.max(9, pw * 0.16) + 'px', left: px - pw * 0.35 + 'px', top: pFeet - Math.max(9, pw * 0.16) * 0.5 + 'px' });
      Object.assign(ref.phalo.style, { width: pw * 1.36 + 'px', height: ph * 1.2 + 'px', left: px - pw * 0.68 + 'px', top: pt + ph * 0.5 - ph * 0.6 + 'px' });
      for (const [f, w, h] of [[bflash, bw, bh], [pflash, pw, ph]]) if (f) { f.style.width = w + 'px'; f.style.height = h + 'px'; }
      anchors.boss = { x: bx, y: bt + bh * 0.28, w: bw, W, H: Hh, cx: bx, cy: bt + bh * 0.5 }; // Patch 8: Schadenszahlen
      anchors.player = { x: px, y: pt + ph * 0.2, w: pw, W, H: Hh };

      applyCustomArt(W, Hh, dpr);
    }

    // Optionales eigenes Szenenbild, nur wenn die Auflösung für dieses Display reicht.
    let customImg = null, customChecked = false;
    function applyCustomArt(W, Hh, dpr) {
      const conf = CONFIG.customArt[t1];
      if (!conf || !conf.scene) return;
      const check = () => {
        const need = Math.max((W * dpr) / customImg.naturalWidth, (Hh * dpr) / customImg.naturalHeight);
        const ok = need <= CONFIG.maxUpscale;
        customImg.hidden = !ok;
        ref.stage.querySelector('.bo-scene').style.visibility = ok ? 'hidden' : '';
        if (!ok && !customChecked) console.warn(`[BossOverlay] Szenenbild für "${t1}" ist für dieses Display zu klein (${customImg.naturalWidth} x ${customImg.naturalHeight} px). Vektorszene wird genutzt.`);
        customChecked = true;
      };
      if (customImg) { if (customImg.complete && customImg.naturalWidth) check(); return; }
      customImg = new Image();
      customImg.className = 'bo-custom';
      customImg.alt = '';
      customImg.hidden = true;
      customImg.onload = check;
      customImg.src = conf.scene;
      ref.stage.querySelector('.bo-scene').after(customImg);
    }

    // Patch 8: Zustand der neuen Kampfanzeigen (Patch 8.1: Animationen über die Web Animations API, nur transform
    // und opacity, ohne erzwungene Neuberechnung des Layouts)
    const anchors = {};
    let floatCount = 0, swapSeq = 0, dodgeState = '', mateKey = '', pbanT = 0, quitT = 0, dodgeAt = 0;
    let bShake = null, pShake = null, pLunge = null, sShake = null, impactA = null, ambient = [];
    // Patch 8.1: Plätze für Schadenszahlen als [Spalte, Höhenversatz] um den Ankerpunkt. Die ersten sind die
    // leicht versetzten Spuren, die anderen weichen aus, wenn dort gerade eine Zahl steht.
    const lanes = {
      boss: { spots: [[0, 0], [-1, -12], [1, -6], [-2, -18], [2, -3], [0, 24], [-1, 16], [1, 20], [-2, 10], [2, 14], [0, -36], [-1, -42], [1, -32], [0, 46], [-1, 40], [1, 44]], lanes: 5, next: 0, last: null },
      player: { spots: [[0, 0], [-1, -10], [1, -5], [0, 22], [-1, 16], [1, 18], [0, -30], [-1, -26], [1, -28]], lanes: 3, next: 0, last: null },
      word: { spots: [[0, -30], [0, -52], [0, -74], [-1, -40], [1, -40], [-1, -62], [1, -62], [1, -12], [0, 0], [1, 12], [0, 24], [-1, 18]], lanes: 3, next: 0, last: null },
    };
    // Bahn einer Zahl (bo-float: 0,9 s, ease-out je Abschnitt) als Tabelle: Höhe, Deckkraft und Größe über die Zeit
    const FLY = (() => {
      const ease = (u) => { let lo = 0, hi = 1; for (let i = 0; i < 16; i++) { const t = (lo + hi) / 2; if (1.74 * t * t * (1 - t) + t * t * t < u) lo = t; else hi = t; } const t = (lo + hi) / 2; return 3 * t * t - 2 * t * t * t; };
      const n = 46, y = [], o = [], s = [];
      for (let i = 0; i < n; i++) {
        const q = i / (n - 1);
        if (q <= 0.15) { const e = ease(q / 0.15); y.push(-10 * e); o.push(e); s.push(0.8 + 0.28 * e); } else { const e = ease((q - 0.15) / 0.85); y.push(-10 - 52 * e); o.push(1 - e); s.push(1.08 - 0.08 * e); }
      }
      return { n, y, o, s, ms: 900 };
    })();
    const flAt = (k, tau) => { const f = Math.max(0, Math.min(1, tau / FLY.ms)) * (FLY.n - 1), i = Math.floor(f), j = Math.min(FLY.n - 1, i + 1); return FLY[k][i] + (FLY[k][j] - FLY[k][i]) * (f - i); };
    const FL_FS = { crit: 24, big: 26, info: 14, good: 16 };

      // Patch 8.1: Meldung im Infobereich (Titel und eine Zeile darunter), siehe setInfo

      setXAttacks(left, max) { setText(ref.xattacks, `${left}/${max}`); },
      // Patch 8.1: Treffer am Boss: er blitzt auf und wackelt. crit (Konterfenster): golden, länger, stärker, mit Ring.
      hit(crit) {

      // Patch 8.1: das eigene Pokémon macht beim Angriff einen kurzen Satz nach vorn, zum Boss hin

      // Patch 8: eigenes Pokémon wechseln. Name, Level und KP sofort, das Bild sobald es geladen ist.

      playIntro() { return playIntro(ctx); },
      skipIntro() { if (ctx.intro) ctx.intro.end(false); },
      relayout: layout,
      // Patch 8.1: ruhige Darstellung an oder aus (die Szene hält an, die Kampfwirkung bleibt)

      destroy() { ro.disconnect(); clearTimeout(pbanT); clearTimeout(quitT); ambient.forEach((a) => a.cancel()); if (ctx.intro) ctx.intro.end(true); root.remove(); }
    };

    const ctx = { root, ref, api, opts: o, intro: null };

    api.setBossHp(state.bossHp, state.bossMax);

  /* ------------------------------------------------------------------ */
  /* Boss-Intro: Banner wird groß eingeblendet und fliegt an seinen Platz */
  /* ------------------------------------------------------------------ */

  function playIntro(ctx) {
    const { root, ref, opts } = ctx;
    if (ctx.intro) ctx.intro.end(true);
    const huds = Array.from(root.querySelectorAll('.bo-hud'));
    const reduce = global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { if (opts.onIntroEnd) opts.onIntroEnd(); return Promise.resolve(); }

    return new Promise((resolve) => {
      const small = ref.banner;
      const rr = root.getBoundingClientRect(), k = rr.width / root.offsetWidth || 1;
      const sr = small.getBoundingClientRect();
      const sl = (sr.left - rr.left) / k, st = (sr.top - rr.top) / k, sw = sr.width / k, sh = sr.height / k;
      const W = root.offsetWidth, Hh = root.offsetHeight;
      const sc = Math.min(1.8, (W * 0.92) / sw);
      // Großes Banner im oberen Drittel, damit die Enthüllung des Bosses darunter sichtbar bleibt
      const dx = (W - sw * sc) / 2 - sl, dy = Hh * 0.27 - (sh * sc) / 2 - st;

      const ov = document.createElement('div');
      ov.className = 'bo-intro';
      ov.innerHTML = `<div class="bo-intro-dim"></div><div class="bo-intro-burst"></div><div class="bo-intro-streak" style="top:20%"></div><div class="bo-intro-streak" style="top:38%"></div><div class="bo-intro-skip">${esc(T.skip)}</div>`;
      // Patch 8: die Signatur-Mechanik des Bosses unter dem großen Banner
      const note = opts.introNote;
      let noteEl = null;
      if (note) {
        noteEl = document.createElement('div');
        noteEl.className = 'bo-intro-note';
        noteEl.style.top = (Hh * 0.27 + (sh * sc) / 2 + 18) + 'px';
        noteEl.innerHTML = `<b>${esc(note.title || T.signature)}</b><span>${esc(note.text)}</span>`;
        ov.appendChild(noteEl);
      }
      const big = small.cloneNode(true);
      big.classList.add('bo-banner--intro');
      big.removeAttribute('data-ref');
      Object.assign(big.style, { left: sl + 'px', top: st + 'px', width: sw + 'px' });
      ov.appendChild(big);
      root.appendChild(ov);
      small.style.visibility = 'hidden';
      huds.forEach((h) => h.classList.add('bo-hud-wait'));
      // Patch 8.1: die Silhouette ist die schwarze Kopie des Sprites über dem Boss, die Enthüllung blendet sie weiß aus
      const sil = ref.bossfx.querySelector('.bo-flash');
      if (sil) { if (sil._a) sil._a.cancel(); sil.dataset.c = 'sil'; sil.style.visibility = 'visible'; sil.style.opacity = '1'; }

      const D = CONFIG.introMs, anims = [];
      const go = (el, kf, extra) => { const a = el.animate(kf, Object.assign({ duration: D, fill: 'both' }, extra)); anims.push(a); return a; };
      const atBig = `translate(${dx}px, ${dy}px) scale(${sc})`;
      const main = go(big, [
        { transform: `translate(${dx - W}px, ${dy}px) scale(${sc})`, opacity: 0, easing: 'cubic-bezier(.16,.9,.24,1)' },
        { transform: atBig, opacity: 1, offset: 0.15 },
        { transform: atBig, opacity: 1, offset: 0.7, easing: 'cubic-bezier(.65,0,.25,1)' },
        { transform: 'translate(0px, 0px) scale(1)', opacity: 1 }
      ]);

    for (const k of ['coins', 'life', 'xp', 'rev', 'savedAt', 'cool', 'gymCool', 'created']) s[k] = isFinite(+s[k]) ? Math.max(0, +s[k]) : 0;
    // separate leveling: keep every trained Pokémon, only registered ones can be selected
    const so = isObj(o.solo) ? o.solo : {};
    s.solo = { sel: null, lv: numMap(so.lv, 1, BALANCE.solo.maxLevel, true), xp: numMap(so.xp, 0, 1e300, false) };
    const sel = +so.sel;
    if (sel && s.reg[sel]) { s.solo.sel = sel; if (!s.solo.lv[sel]) s.solo.lv[sel] = BALANCE.solo.startLevel; }
    // trainers: each one keeps its own level
    const tr = isObj(o.trainer) ? o.trainer : {};
    const tlv = numMap(tr.lv, 1, BALANCE.trainer.maxLevel, true), txp = numMap(tr.xp, 0, 1e300, false);
    const tst = numMap(tr.st, 0, 1e12, false);
    s.trainer = { sel: TRAINER_BY_ID[tr.sel] ? tr.sel : null, lv: {}, xp: {}, st: {} };
    for (const t of TRAINERS) { if (tlv[t.id]) s.trainer.lv[t.id] = tlv[t.id]; if (txp[t.id]) s.trainer.xp[t.id] = txp[t.id]; if (tst[t.id]) s.trainer.st[t.id] = tst[t.id]; }
    if (s.trainer.sel && !s.trainer.lv[s.trainer.sel]) s.trainer.lv[s.trainer.sel] = 1;
    // gyms: wins per leader
    s.gyms = {};
    const gy = isObj(o.gyms) ? o.gyms : {};
    for (const g of GYMS) { const w = Math.floor(+gy[g.id] || 0); if (w > 0) s.gyms[g.id] = Math.min(w, 100000); }
    // Patch 2: diamonds, regions, bosses, boosts
    s.dia = isFinite(+o.dia) ? Math.max(0, Math.floor(+o.dia)) : 0;
    s.regionsOpen = clamp(Math.floor(+o.regionsOpen) || 1, 1, W.R.length);
    const rp = regionOfPos(W, s.li);
    if (s.done || s.li > regionStart(W, rp) || s.starters[rp] != null) s.regionsOpen = Math.max(s.regionsOpen, rp + 1);
    s.bosses = {};
    const bo = isObj(o.bosses) ? o.bosses : {};
    for (const b of BOSSES) { const w = Math.floor(+bo[b.id] || 0); if (w > 0) s.bosses[b.id] = Math.min(w, 100000); }
    s.bossCool = isFinite(+o.bossCool) ? Math.max(0, +o.bossCool) : 0;
    // Patch 8: best share of a boss's KP per boss and tier (shown after a defeat)
    s.bossBest = {};
    if (isObj(o.bossBest)) for (const b of BOSSES) {
      const x = o.bossBest[b.id], r = {};
      if (isObj(x)) for (const k in x) { const t = Math.floor(+k), v = +x[k]; if (t >= 0 && t <= BALANCE.bosses.maxTier && v > 0 && v <= 1) r[t] = v; }
      if (Object.keys(r).length) s.bossBest[b.id] = r;
    }
    const bs = isObj(o.boost) ? o.boost : {};
    s.boost = { tap: clamp(+bs.tap || 0, 0, 36000), auto: clamp(+bs.auto || 0, 0, 36000), tep: isFinite(+bs.tep) ? Math.max(0, +bs.tep) : 0 };
    // Patch 4: three boss teams, trainer search
    const cleanTeam = t => (Array.isArray(t) ? t.map(Number).filter((id, i, a) => id >= 1 && id <= NPOKE && a.indexOf(id) === i).slice(0, BALANCE.bosses.teamMax) : []);
    const bt = Array.isArray(o.bossTeams) ? o.bossTeams : [o.bossTeam];
    s.bossTeams = [0, 1, 2].map(i => cleanTeam(bt[i]));
    s.bossTeamIdx = clamp(Math.floor(+o.bossTeamIdx) || 0, 0, 2);
    delete s.bossTeam;
    const se = isObj(o.search) ? o.search : null;
    s.search = se && TRAINER_BY_ID[se.id] && BALANCE.search.hours.includes(+se.hours) && isFinite(+se.start) && isFinite(+se.end)
      ? { id: se.id, hours: +se.hours, start: +se.start, end: +se.end, wasSel: !!se.wasSel } : null;
    if (s.search && s.trainer.sel === s.search.id) s.trainer.sel = null;
    if (s.search && !s.trainer.lv[s.search.id]) s.trainer.lv[s.search.id] = 1;
    const sr = isObj(o.searchResult) ? o.searchResult : null;
    s.searchResult = null;
    if (sr && TRAINER_BY_ID[sr.id] && isObj(sr.found)) {
      const found = {};
      for (const k of FIND_KEYS) found[k] = clamp(Math.floor(+sr.found[k] || 0), 0, 9999);
      s.searchResult = { id: sr.id, hours: BALANCE.search.hours.includes(+sr.hours) ? +sr.hours : 4, found, at: isFinite(+sr.at) ? +sr.at : Date.now() };
    }
    if (s.search && s.searchResult) s.search = null;
    // Patch 7: one NG+ tier for all bosses (wins per boss and tier); Patch 6 knocked out Pokémon
    const bn = isObj(o.bng) ? o.bng : {};
    const bmax = clamp(Math.floor(+bn.max) || 0, 0, BALANCE.bosses.maxTier);
    const bw = (Array.isArray(bn.w) ? bn.w : []).slice(0, bmax + 1).map(x => {
      const out = {};
      if (isObj(x)) for (const b of BOSSES) { const n = Math.floor(+x[b.id] || 0); if (n > 0) out[b.id] = Math.min(n, 1e6); }
      return out;
    });
    while (bw.length <= bmax) bw.push({});
    s.bng = { t: clamp(Math.floor(+bn.t) || 0, 0, bmax), max: bmax, w: bw };
    delete s.ng;
    s.ko = {};
    if (isObj(o.ko)) for (const k in o.ko) {
      const id = +k, x = o.ko[k];
      if (!(id >= 1 && id <= NPOKE) || !isObj(x)) continue;
      const num = v => (isFinite(+v) ? Math.max(0, +v) : 0);
      s.ko[id] = { at: num(x.at), start: num(x.start), end: num(x.end) };
      if (s.ko[id].end && !s.ko[id].start) s.ko[id].start = s.ko[id].end - BALANCE.heal.centerMin * 60e3;
    }
    // shinies cover whole families, including evolutions that are new in this version;
    // a Pokémon already at or above its shiny level gets its shiny too (it could never level past Lv. 1000 to get it)
    for (const id of Object.keys(s.shiny)) unlockShiny(W, s, +id);
    for (const k of Object.keys(s.solo.lv)) if (s.reg[k] && !s.shiny[k] && s.solo.lv[k] >= shinyLevelFor(W, +k)) unlockShiny(W, s, +k);
    s.seenVersion = typeof o.seenVersion === 'string' ? o.seenVersion : '1.0.0';
    delete s.team;
    return s;
  }
  function saveLocal() {
    if (!S) return;
    S.rev = (S.rev || 0) + 1; S.savedAt = Date.now(); S.gv = GAME_VERSION;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: progress lives for this visit only */ }
  }
  // A save from an older format or an older game version is copied to BACKUP_KEY on this device first.
  function backupOld(raw, obj) {
    const from = typeof obj.v === 'number' && obj.v >= 1 ? obj.v : 1;
    if (from >= SAVE_VERSION && !(typeof obj.gv === 'string' && cmpVer(GAME_VERSION, obj.gv) > 0)) return 0;
    try {
      const prev = JSON.parse(localStorage.getItem(BACKUP_KEY) || 'null');
      if (!prev || prev.raw !== raw) localStorage.setItem(BACKUP_KEY, JSON.stringify({ at: Date.now(), from, version: obj.gv || '1.0.0', raw }));
    } catch (e) { /* no room for a backup: the old save stays untouched until the next autosave */ }
    return from;
  }
  // Reads the local save and brings it to the current format.
  function loadLocal() {
    let raw = null, obj = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return null; }
    if (!raw) return null;
    try { obj = JSON.parse(raw); } catch (e) { return null; }
    if (!isObj(obj)) return null;
    backupOld(raw, obj);
    return sanitize(obj);
  }
  function readBackup() {
    try { const b = JSON.parse(localStorage.getItem(BACKUP_KEY) || 'null'); return b && typeof b.raw === 'string' ? b : null; } catch (e) { return null; }
  }

  // cloud save through the artifact runtime (only inside claude.ai); otherwise browser storage only
  const cloud = { ref: null, busy: false, dirty: false, status: 'aus' };
  function markDirty() { cloud.dirty = true; }
  async function cloudWrite() {
    if (!cloud.ref || cloud.busy || !cloud.dirty) return;
    cloud.busy = true; cloud.dirty = false;
    try { saveLocal(); await cloud.ref.set({ json: JSON.stringify(S), rev: S.rev, savedAt: S.savedAt }); cloud.status = 'aktiv'; }
    catch (e) { cloud.dirty = true; if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { cloud.ref = null; cloud.status = 'nicht verfügbar'; } }
    finally { cloud.busy = false; }
  }
  async function initCloud() {
    const C = window.claude;
    if (!C || typeof C.use !== 'function') return;
    try {
      const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/save');
      const snap = await ref.get();
      cloud.ref = ref; cloud.status = 'aktiv';
      if (snap.exists) {
        const d = snap.data();
        let remote = null, obj = null;
        try { obj = d && typeof d.json === 'string' ? JSON.parse(d.json) : null; remote = sanitize(obj); } catch (e) { remote = null; }
        if (remote && remote.savedAt > bootSavedAt + 30000) {
          backupOld(d.json, obj);
          sheetQueue.length = 0; // pending sheets belong to the replaced state
          closeSheet(true); closeBattle(true);
          welcome = null;
          const notesFrom = cmpVer(GAME_VERSION, remote.seenVersion) > 0 ? remote.seenVersion : null;
          if (notesFrom) remote.seenVersion = GAME_VERSION;
          S = remote;
          Music.enable(S.settings.music);
          markDirty(); // the cloud gets the converted save with the next autosave
          const away = (Date.now() - S.savedAt) / 1000;
          renderAll();
          if (notesFrom) queueSheet(() => openNotes(false, notesFrom));
          if (away > 5) offlineCatchup(away, away >= 60);
          toast('Spielstand aus der Cloud geladen');
        }
      } else { markDirty(); }
    } catch (e) { cloud.ref = null; }
    finally { releaseWelcome(); }
  }

  // ---------- derived ----------
  function regionOfLi() { return ctx(W, S).line.region; }
  function pendingStarter() {
    if (S.done) return false;
    const r = regionOfLi();
    return regionUnlocked(S, r) && S.starters[r] == null && S.li === regionStart(W, r);
  }
  // true while the main game waits at a region that has to be bought with diamonds
  function gated() { return gateRegion(W, S) >= 0; }
  function mainIdle() { return S.done || gated() || pendingStarter(); }
  function curCps() { return cpsNow(W, S); }
  function xpToLevel(c, target) {
    let sum = -S.xp;
    for (let L = S.lvl; L < target; L++) sum += xpNeed(W, c.line, c.p, L, spOf(W, c.line.m[S.stage]));
    return Math.max(0, sum);
  }
  function powerBonus() { const c = ctx(W, S); return Math.pow(S.lvl / c.line.bl, 1.2) - 1; }
  function itemPrice(id) {
    const it = BALANCE.items[id];
    const cps = curCps();
    let p;
    if (id === 'candy') {
      const c = ctx(W, S);
      if (S.lvl >= c.cap) return Infinity;
      const need = xpNeed(W, c.line, c.p, S.lvl, c.sp) - S.xp;
      p = Math.max(it.min, it.factor * need / xpPerSec(S) * cps);
    } else p = Math.max(it.min, it.sec * cps);
    return p * (1 - tBonus(S, 'discount'));
  }

  function flushToasts() {
    if (BT || evoShowing || evoQueue.length || !heldToasts.length) return;

  }

    box.appendChild(t); setTimeout(() => t.remove(), 2900);

  let pressActive = false;

  document.addEventListener('pointercancel', () => { pressActive = false; }, true);
  let curSheet = null;
  const sheetQueue = [];
  function openSheet(html, opts = {}) {
    closeSheet(true);
    const veil = document.createElement('div');
    veil.className = 'veil';
    veil.innerHTML = `<div class="sheet${opts.cls ? ' ' + opts.cls : ''}" role="dialog" aria-modal="true">${html}</div>`;
    // A sheet can open in the middle of a tap (e.g. a shiny on pointerdown). The click that finishes
    // that tap must not close the sheet or press one of its buttons, so it is swallowed once.
    let swallow = pressActive;
    if (swallow) setTimeout(() => { swallow = false; }, 700);
    let downOnVeil = false;
    veil.addEventListener('click', e => { if (swallow) { swallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
    veil.addEventListener('pointerdown', e => { downOnVeil = e.target === veil; swallow = false; });
    if (opts.dismissible !== false) veil.addEventListener('click', e => { if (e.target === veil && downOnVeil) closeSheet(); downOnVeil = false; });
    document.body.appendChild(veil);
    curSheet = { veil, onClose: opts.onClose, dismissible: opts.dismissible !== false };
    const first = veil.querySelector('[data-autofocus]') || veil.querySelector('button');
    if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);

    }
    const sec = Math.floor(now / 1000);

    for (const [kid, req] of kids) out.push(`<li>Entwickelt sich zu <b>${esc(dexMode(kid) === 'unk' ? '???' : W.P[kid - 1].name)}</b> ${req}</li>`);

  const flavorCache = (() => { try { return JSON.parse(localStorage.getItem('pkidle.flavor') || '{}'); } catch (e) { return {}; } })();
  const FLAVOR_BREAKS = new RegExp('[\\f\\n\\r' + String.fromCharCode(0xAD) + ']+', 'g');
  async function loadFlavor(id, el) {
    if (flavorCache[id]) { el.textContent = flavorCache[id]; el.hidden = false; return; }
    if (!spritesOK) return; // sandboxed views block outside requests too
    try {
      const r = await fetch('https://pokeapi.co/api/v2/pokemon-species/' + id + '/');
      if (!r.ok) return;
      const j = await r.json();
      const de = (j.flavor_text_entries || []).filter(x => x.language && x.language.name === 'de');
      if (!de.length) return;
      const txt = de[de.length - 1].flavor_text.replace(FLAVOR_BREAKS, ' ').replace(/\s+/g, ' ').trim();

      try { localStorage.setItem('pkidle.flavor', JSON.stringify(flavorCache)); } catch (e) { /* ignore */ }

  // ---------- battles (training and arena) ----------
  let BT = null;
  function moveFor(attTypes, defTypes) {
    let best = attTypes[0], bv = -1;
    for (const t of attTypes) { let m = 1; for (const d of defTypes) m *= W.C[t][d]; if (m > bv) { bv = m; best = t; } }

  }
  function effText(raw) { return raw >= 2 ? 'Sehr effektiv!' : raw < 1 ? 'Nicht sehr effektiv …' : ''; }
  // ---------- difficulty before a fight ----------
  // The colour always shows how hard the opponent is without items: green easy, yellow medium, red hard.
  // What Supertrank and X-Angriff change gets its own line with its own colour dot.
  const DIFF_LABEL = { ok: 'Einfach', mid: 'Mittel', hard: 'Schwer' };
  const fTaps = v => nf1.format(Math.ceil(v * 10) / 10);
  function diffChip(t) { const c = diffClass(t); return `<span class="diff ${c}">${DIFF_LABEL[c]}</span>`; }
  function itemsPhrase(p, x, boss) {

    const xx = boss ? (x === 1 ? '1 X-Angriff' : x + ' X-Angriffen') : 'X-Angriff';
    return p > 0 && x > 0 ? pp + ' und ' + xx : p > 0 ? pp : x > 0 ? xx : null;
  }
  // t0: taps per second needed without items, ti: with the items in the bag (Infinity = not possible).
  // Nobody taps much faster than 12 times a second, so higher values are not shown as a number.

  function verdictInfo(t0, ti, items, hardTip, itemNote, who = 'Dein Pokémon') {

    // Patch 8.1: the sum of the counter damage, during the window and a moment after it
    if (BT.inCtr && F.counterT <= 0) ctrDone(F);
    ov.counterSum(BT.csum, F.counterT > 0 ? 'on' : BT.csum > 0 && F.t - BT.csumAt < 1.6 ? 'done' : 'off');
    // what is going on right now: on the boss (under the banner) and on the own Pokémon
    const bp = [], pp = [];
    if (F.roarT > 0) bp.push({ text: 'Brüllt, unverwundbar', tone: 'boss' });
    if (F.sig.stacks) bp.push({ text: `Drachentanz ×${nf1.format(1 + sg.drachentanz.per * F.sig.stacks)}`, tone: 'boss' });
    if (F.sig.power) bp.push({ text: `Kraft +${fPc(sg.geokontrolle.power * F.sig.power)}`, tone: 'boss' });
    if (F.sig.shield) bp.push({ text: 'Schattenschild', tone: 'boss' });
    if (G.sig === 'barriere') {
      const k = sg.barriere.every - (F.sig.hits % sg.barriere.every);
      bp.push(F.counterT > 0 ? { text: 'Barriere offen', tone: 'good' } : { text: k === 1 ? 'Barriere: nächster Treffer' : `Barriere in ${k} Treffern`, tone: k === 1 ? 'bad' : 'boss' });
    }
    if (G.sig === 'lichtschild') bp.push(bfShieldUp(F) ? { text: 'Lichtschild', tone: 'boss' } : { text: 'Lichtschild offen', tone: 'good' });
    if (F.xT > 0) pp.push({ text: `X-Angriff ${Math.ceil(F.xT)} s`, tone: 'gold' });
    if (F.burn[F.idx] > 0) pp.push({ text: `Verbrannt ${Math.ceil(F.burn[F.idx])} s`, tone: 'bad' });
    if (F.poison[F.idx]) pp.push({ text: 'Vergiftet', tone: 'bad' });
    if (G.sig === 'sandsturm' && !m.types.some(t => sg.sandsturm.immune.includes(t))) pp.push({ text: 'Sandsturm', tone: 'bad' });
    if (G.sig === 'duerre' && m.types.includes(sg.duerre.type) && F.counterT <= 0) pp.push({ text: `Dürre: ×${nf1.format(sg.duerre.mult)} Schaden`, tone: 'bad' });
    if (G.sig === 'teravolt' && c && !m.types.some(t => sg.teravolt.immune.includes(t))) pp.push({ text: 'Nicht tippen!', tone: 'bad' });
    if (ready) pp.push({ text: bfShieldUp(F) ? 'Spezialattacke bereit: Schild abwarten' : 'Spezialattacke bereit', tone: 'gold' });
    ov.setPills(bp, pp);
  }

  // "um 06:09 Uhr", "morgen um 06:09 Uhr" or "am 15.10. um 06:09 Uhr"
  function fBack(ms) {
    const d = new Date(ms), now = new Date();

  // ---------- save transfer: file and code ----------

  function exportFile() {
    let f;
    try { f = saveFile(); } catch (e) { svMsg('Die Datei konnte nicht erstellt werden.', true); return; }
    const C = window.claude;
    if (C && typeof C.use === 'function') { // inside claude.ai: files go through the viewer's download prompt
      C.use('downloads').then(dl => {
        if (!dl) { svMsg('In dieser Ansicht lässt sich keine Datei speichern. Nutze „Code kopieren“.', true); return; }
        return dl.save({ filename: f.name, data: f.text }).then(() => toast('Datei gespeichert'), e => {
          if (e && (e.code === 'declined' || e.code === 'rate_limited')) return;
          svMsg('In dieser Ansicht lässt sich keine Datei speichern. Nutze „Code kopieren“.', true);
        });
      }, () => svMsg('In dieser Ansicht lässt sich keine Datei speichern. Nutze „Code kopieren“.', true));
      return;
    }
    const blob = new Blob([f.text], { type: 'text/plain' });
    const download = () => {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = f.name; link.rel = 'noopener';
      document.body.appendChild(link); link.click();
      setTimeout(() => { URL.revokeObjectURL(url); link.remove(); }, 4000);
      toast('Download gestartet');
    };
    const touch = matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.share && navigator.canShare && typeof File === 'function') {
      let file = null;
      try { file = new File([blob], f.name, { type: 'text/plain' }); } catch (e) { file = null; }
      if (file && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Idle-Trainer Spielstand' }).catch(e => { if (!e || e.name !== 'AbortError') download(); });
        return;
      }
    }
    download();
  }
  function copyCode() {

    } catch (e) { fallback(); }
  }

  // ---------- offline progress ----------
  // "Willkommen zurück": one window per return. Returns while it is still waiting or open are merged into it.
  let welcome = null, welcomeHold = false;
  function addWelcome(w) {
    if (welcome && welcome.open && !(welcome.el && welcome.el.isConnected)) welcome = null; // its window was replaced by another one
    if (welcome) {
      welcome.sec += w.sec; welcome.coins += w.coins; welcome.capped = welcome.capped || w.capped;
      welcome.lv1 = w.lv1; welcome.evos.push(...w.evos); if (w.trainer) welcome.trainer = w.trainer;
      welcome.note = w.note; welcome.gated = w.gated;
      if (welcome.open) showWelcome();
      return;
    }
    welcome = Object.assign({ open: false, queued: false }, w);
    if (!welcomeHold) queueWelcome();
  }
  function queueWelcome() { if (welcome && !welcome.queued) { welcome.queued = true; queueSheet(showWelcome); } }
  function releaseWelcome() { welcomeHold = false; queueWelcome(); }
  function showWelcome() {
    const w = welcome; if (!w) return;
    w.open = true;
    const lines = [`<span>Coins</span><b>+${fInt(w.coins)}</b>`];
    if (!w.gated) {
      lines.push(`<span>${esc(w.name0)}</span><b>Lv. ${w.lv0} → ${w.lv1}</b>`);
      for (const [a, b] of w.evos) lines.push(`<span>Entwickelt</span><b>${esc(W.P[a - 1].name)} → ${esc(W.P[b - 1].name)}</b>`);
      if (w.trainer) lines.push(`<span>Trainer ${esc(TRAINER_BY_ID[w.trainer.id].name)}</span><b>Lv. ${w.trainer.lvl}</b>`);
    }
    const who = w.gated ? 'Dein Pokédex-Team' : 'Die Pension', did = w.gated ? 'verdient' : 'trainiert';
    const el = w.el = openSheet(`<h2>Willkommen zurück!</h2>
      <p>Du warst ${fTime(w.sec)} weg. ${w.capped ? `${who} hat davon ${K.offlineCapH} Std. ${did}, mehr geht am Stück nicht.` : `${who} hat in der Zeit weiter ${did}.`}</p>
      <div class="kv">${lines.join('')}</div>${w.note || ''}
      <div class="row"><button class="btn gold" data-autofocus id="wb-ok" type="button">Weiter</button></div>`, { onClose: () => { welcome = null; } });

  // away = false: the gap was no absence (a stalled page, time in a boss fight). Patch 8.1: its progress is credited
  // like play time, without the offline bonus, and it counts as play time, not as time away.
  function offlineCatchup(sec, showModal, away = true) {
    const real = sec;
    sec = Math.min(sec, K.offlineCapH * 3600);
    if (!S || sec < 1 || pendingStarter() || S.done) return;
    const boost = away ? tBonus(S, 'offline') : 1, stat = away ? 'away' : 'time';
    if (gated()) { // no Pokémon in training, only the team income
      const coins = cpsNow(W, S) * sec * boost;
      S.coins += coins; S.life += coins;
      S.stats[stat] = (S.stats[stat] || 0) + sec;
      markDirty();
      if (showModal) addWelcome({ sec: real, capped: real > sec, coins, gated: true, evos: [], note: `<p>${esc(W.R[gateRegion(W, S)][0])} wartet noch darauf, mit Diamanten freigeschaltet zu werden.</p>` });
      return;
    }
    const c = ctx(W, S);
    const cps = coinsPerSec(W, S, c.p, c.sp.bst);
    const lv0 = S.lvl, sp0 = c.sp;
    const coins = cps * sec * boost;
    S.coins += coins; S.life += coins;
    S.stats[stat] = (S.stats[stat] || 0) + sec;
    // trainer EP boost: only the part of the absence it covered counts double
    const tNow = Date.now(), covered = clamp(Math.min(tNow, S.boost.tep || 0) - (tNow - real * 1000), 0, real * 1000) / (real * 1000 || 1);
    CLOCK.tepFactor = 1 + (BALANCE.trainerBoosts.ep.mult - 1) * covered;
    let ev;
    try { ev = addXP(W, S, xpPerSec(S) * sec * boost); } finally { CLOCK.tepFactor = null; }
    handleEvents(ev, true);
    markDirty();
    if (!showModal) return;
    const evos = ev.filter(e => e.e === 'evolve');
    const tUp = ev.filter(e => e.e === 'trainerLevel').pop();
    const now = ctx(W, S).sp;
    let note = '';
    if (S.ready) note = `<p>${esc(now.name)} ist bereit für den Kampf.</p>`;
    else if (S.stone) note = `<p>${esc(now.name)} wartet auf einen Entwicklungsstein.</p>`;
    addWelcome({ sec: real, capped: real > sec, coins: coins + evos.reduce((x, e) => x + e.reward, 0), gated: false, name0: sp0.name, lv0, lv1: S.lvl, evos: evos.map(e => [e.from, e.to]), trainer: tUp ? { id: tUp.id, lvl: tUp.lvl } : null, note });
  }

  // ---------- viewport guard (iOS keeps a shifted or shrunken viewport after the keyboard) ----------
  (function viewportGuard() {
    let maxH = window.innerHeight;
    const isField = el => !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    const settle = () => {
      if (isField(document.activeElement)) return;
      if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
      const se = document.scrollingElement;
      if (se && (se.scrollTop || se.scrollLeft)) { se.scrollTop = 0; se.scrollLeft = 0; }
      const app = document.getElementById('app');
      if (app && window.innerHeight < maxH - 4) {
        const main = document.getElementById('main'), top = main.scrollTop;
        app.style.display = 'none'; void app.offsetHeight; app.style.display = '';
        main.scrollTop = top;
      }
    };
    const later = () => setTimeout(settle, 160);
    window.addEventListener('resize', () => { if (!isField(document.activeElement)) maxH = Math.max(maxH, window.innerHeight); });
    window.addEventListener('orientationchange', () => setTimeout(() => { maxH = window.innerHeight; settle(); }, 400));
    document.addEventListener('focusout', later);
    window.addEventListener('scroll', () => { if (!isField(document.activeElement)) settle(); }, { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', later);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) later(); });
  })();

  // ---------- update check against the published version on GitHub ----------
  function checkRemoteVersion() {
    if (window.claude || location.protocol !== 'https:') return;
    fetch('version.json', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null))
      .then(j => {
        if (!j || typeof j.version !== 'string' || cmpVer(j.version, GAME_VERSION) <= 0) return;
        $('#update-text').textContent = `Version ${j.version} ist verfügbar.`;
        $('#update').hidden = false;
        $('#update-btn').onclick = () => { saveLocal(); location.reload(); };
      })
      .catch(() => { /* offline */ });
  }

  // ---------- main loop ----------
  let last = performance.now(), lastWall = Date.now(), uiT = 0, saveT = 0, cloudT = 0;
  // Patch 8.1: was the page really in the background since the last frame (app switched, phone locked, tab hidden)?
  // Only then a gap counts as an absence with "Willkommen zurück". A page that only hung for a moment, and the
  // time in a boss fight, never do.
  let wasHidden = !!document.hidden;
  document.addEventListener('visibilitychange', () => { if (document.hidden) wasHidden = true; });
  window.addEventListener('pagehide', () => { wasHidden = true; });
  document.addEventListener('freeze', () => { wasHidden = true; });
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    // Time away (app in the background, phone asleep) is the wall-clock gap between two frames.
    // Each gap is seen by exactly one frame, so every absence is credited exactly once.
    const wall = Date.now(), gap = (wall - lastWall) / 1000; lastWall = wall;
    const hid = wasHidden; wasHidden = !!document.hidden;
    if (S) {
      if (gap > 3) {
        // The progress of the gap is always credited. An absence is only a gap in which the app was really left
        // (hidden, closed or frozen) or one of 10 minutes or more; anything else is play time. The window comes only
        // for an absence of a minute or more and never in a boss fight.
        const away = hid || gap >= 600;
        offlineCatchup(gap, away && gap >= 60 && !(BT && BT.kind === 'boss'), away);
        if (BT) BT.paused = false; dt = 0;
      } else dt = clamp(dt, 0, 3);
      if (dt > 0) {
        if (!mainIdle()) {
          const c = ctx(W, S);
          const cps = coinsPerSec(W, S, c.p, c.sp.bst);
          S.coins += cps * dt; S.life += cps * dt;
          const ev = addXP(W, S, xpPerSec(S) * dt);
          if (ev.length) handleEvents(ev);
        } else if (gated()) { // waiting for the next region: the Pokédex team keeps earning
          const cps = cpsNow(W, S);
          S.coins += cps * dt; S.life += cps * dt;
        }
        S.stats.time += dt;
        battleStep(dt);
        bossStep(dt);
        boostStep(dt);
      }
      uiT += dt; saveT += dt; cloudT += dt;
      if (uiT >= 0.1) { uiT = 0; refresh(); }
      if (saveT >= 5) { saveT = 0; saveLocal(); }
      if (cloudT >= 20) { cloudT = 0; cloudWrite(); }
    }
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    if (!S) return;
    if (document.hidden) { if (BT) BT.paused = true; saveLocal(); markDirty(); cloudWrite(); }
    else if (BT) BT.paused = false;
  });
  window.addEventListener('pagehide', () => { if (S) saveLocal(); });

  // ---------- boot ----------
  let bootSavedAt = 0, booted = false;
  function start(data) {
    let s = null;
    if (data && typeof data.save === 'string') { try { s = sanitize(JSON.parse(data.save)); } catch (e) { s = null; } }
    const local = s || loadLocal();
    bootSavedAt = local ? local.savedAt || 0 : 0;
    S = local || freshState();
    const away = (Date.now() - (S.savedAt || Date.now())) / 1000;
    const notesFrom = local && cmpVer(GAME_VERSION, S.seenVersion) > 0 ? S.seenVersion : null;
    renderAll();
    if (notesFrom) { S.seenVersion = GAME_VERSION; queueSheet(() => openNotes(false, notesFrom)); }
    // inside claude.ai the cloud save may replace this state, so its welcome window waits for that check
    welcomeHold = !!(window.claude && typeof window.claude.use === 'function');
    if (welcomeHold) setTimeout(() => { if (welcomeHold) releaseWelcome(); }, 4000);
    if (away > 5) offlineCatchup(away, away >= 60 && !s);
    booted = true;
    checkSearchDone();
    saveLocal();
    last = performance.now(); lastWall = Date.now();
    Music.init(S.settings.music); Music.mode(BT ? 'battle' : 'field');
    requestAnimationFrame(frame);
    probeSprites();
    initCloud();
    checkRemoteVersion();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ save: JSON.stringify(S) })); } catch (e) { /* optional */ } }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
