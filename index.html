<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon Idle-Trainer</title>
<meta name="theme-color" content="#0e1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Fixed header and tab bar, scrolling middle.
   The active Pokémon's types tint the training stage; coins are gold, EP are cyan. */
:root {
  color-scheme: dark;
  --ink: #0e1020;
  --panel: #171a31;
  --panel-2: #20254a;
  --line: #2e3563;
  --text: #edf0ff;
  --muted: #a0a8d0;
  --faint: #6a729e;
  --gold: #ffcb45;
  --gold-ink: #3a2600;
  --xp: #63d5ff;
  --fight: #ff5f5a;
  --good: #4fd685;
  --warn: #f4c443;
  --bad: #f0605e;
  --ta: #8a8fb8;
  --tb: #8a8fb8;
  --display: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --body: "M PLUS Rounded 1c", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.evo .ev-stage img, .bspr img, .mon-vis img { max-width: none; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 2px;
}
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.col { width: 100%; max-width: 520px; margin-inline: auto; }

/* header */
.top {
  flex: none; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  background: linear-gradient(180deg, #121531, rgba(18, 21, 49, .92));
  border-bottom: 1px solid var(--line);
}
.top .col { display: flex; align-items: center; gap: 12px; }
.coins { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.coin-ico {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff3c4 0 18%, var(--gold) 19% 62%, #c98a12 63%);
  box-shadow: inset 0 0 0 2px #e7a92a;
}
.coins b { font-family: var(--display); font-size: 24px; color: var(--gold); font-weight: 600; line-height: 1; white-space: nowrap; }
.coins small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.prog { text-align: right; line-height: 1.15; flex: none; }
.prog .rg { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.prog .dx { font-family: var(--display); font-size: 16px; }

main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 14px 16px 24px; }
.view[hidden] { display: none !important; }

/* tab bar */
.tabs {
  flex: none; display: flex; background: #121531; border-top: 1px solid var(--line);
  padding: 0 8px env(safe-area-inset-bottom, 0px);
}
.tabs .col { display: flex; }
.tab {
  flex: 1; background: none; border: 0; padding: 8px 4px 9px; display: flex; flex-direction: column;
  align-items: center; gap: 3px; color: var(--faint); font-size: 11px; font-weight: 700; position: relative; cursor: pointer;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
.tab .dot { position: absolute; top: 7px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px #121531; }

/* training */
.mon-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.mon-head .l { min-width: 0; }
.dexno { font-family: var(--display); color: var(--muted); font-size: 14px; }
.mon-name { font-family: var(--display); font-size: 30px; font-weight: 600; line-height: 1.05; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px 1px; border-radius: 6px; background: var(--c); color: var(--cf); }
.lvbadge { flex: none; text-align: right; }
.lvbadge small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.lvbadge b { font-family: var(--display); font-size: 34px; line-height: 1; font-weight: 600; display: inline-block; }
.lvbadge b.pop { animation: pop .45s ease-out; }
@keyframes pop { 0% { transform: scale(1); color: var(--text); } 35% { transform: scale(1.35); color: var(--xp); } 100% { transform: scale(1); } }

.stage {
  position: relative; display: block; width: 100%; height: clamp(210px, 38vh, 330px); border: 0; padding: 0;
  border-radius: 22px; overflow: hidden; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  background:
    radial-gradient(110% 80% at 50% 105%, color-mix(in oklab, var(--ta) 42%, transparent), transparent 62%),
    radial-gradient(60% 50% at 85% 10%, color-mix(in oklab, var(--tb) 22%, transparent), transparent 70%),
    linear-gradient(180deg, #1b1f3d, #11142a);
  box-shadow: inset 0 0 0 1px var(--line);
}
.stage::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.4px);
  background-size: 10px 10px;
}
.ground {
  position: absolute; left: 50%; bottom: 13%; width: 62%; height: 15%; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in oklab, var(--ta) 55%, #05060f), color-mix(in oklab, var(--ta) 20%, transparent) 70%, transparent);
}
.mon-vis { position: absolute; left: 50%; bottom: 20%; transform: translateX(-50%); display: grid; place-items: end center; pointer-events: none; }
.mon-vis .bob { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; display: grid; place-items: end center; }
.mon-vis .bob.squash { animation: squash .14s ease-out; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes squash { 0% { transform: scale(1, 1); } 45% { transform: scale(1.1, .9); } 100% { transform: scale(1, 1); } }
.stage .hint {
  position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 12px; color: var(--muted);
  letter-spacing: .08em; text-transform: uppercase; pointer-events: none;
}
.ring { position: absolute; left: 50%; bottom: 26%; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; border: 3px solid var(--xp); pointer-events: none; animation: ring .7s ease-out forwards; }
@keyframes ring { from { transform: scale(.5); opacity: 1; } to { transform: scale(5); opacity: 0; } }

.floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fl { position: absolute; font-family: var(--display); font-weight: 700; font-size: 17px; white-space: nowrap; text-shadow: 0 2px 0 rgba(0, 0, 0, .55); animation: rise .9s ease-out forwards; }
.fl.xp { color: var(--xp); }
.fl.co { color: var(--gold); font-size: 15px; }
.fl.dmg { color: #fff; font-size: 20px; }
.fl.crit { color: var(--warn); font-size: 24px; }
.fl.heal { color: var(--good); }
@keyframes rise { 0% { transform: translate(-50%, 0) scale(.8); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1.08); } 100% { transform: translate(-50%, -64px) scale(1); opacity: 0; } }
.px { position: absolute; width: 6px; height: 6px; background: var(--ta); pointer-events: none; animation: burst .55s ease-out forwards; }
@keyframes burst { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

.xpbox { margin-top: 12px; }
.bar { position: relative; height: 16px; border-radius: 6px; background: #0b0d1c; box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
.bar > i { position: absolute; left: 2px; top: 2px; bottom: 2px; border-radius: 4px; background: linear-gradient(180deg, #a6ecff, var(--xp) 55%, #2fa7d6); width: 0; transition: width .12s linear; }
.bar::after { content: ""; position: absolute; inset: 2px; pointer-events: none; background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(5, 8, 20, .35) 9px 10px); }
.bar.cap > i { background: linear-gradient(180deg, #ffe7a3, var(--gold) 55%, #d09a1c); }
.xprow { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.xprow b { color: var(--text); font-family: var(--display); font-weight: 500; }

.goal { margin-top: 12px; display: flex; gap: 10px; align-items: center; font-size: 13.5px; color: var(--muted); }
.goal strong { color: var(--text); }

.action { margin-top: 14px; display: grid; gap: 8px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 800; font-size: 16px; cursor: pointer;
  background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); touch-action: manipulation;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn .sub { font-weight: 500; font-size: 12.5px; opacity: .85; }
.btn.fight { background: var(--fight); color: #fff; box-shadow: 0 6px 22px -6px rgba(255, 95, 90, .7); flex-direction: column; gap: 2px; animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 6px 30px -2px rgba(255, 95, 90, .95); } }
.btn.gold { background: var(--gold); color: var(--gold-ink); box-shadow: none; }
.btn.ghost { background: transparent; }
.btn.small { padding: 9px 12px; font-size: 14px; border-radius: 11px; width: auto; }

.path { list-style: none; margin: 18px 0 0; padding: 0; display: flex; align-items: stretch; gap: 6px; overflow-x: auto; }
.path li { flex: 1 1 0; min-width: 84px; background: var(--panel); border-radius: 14px; padding: 8px 6px 7px; text-align: center; box-shadow: inset 0 0 0 1px var(--line); position: relative; }
.path li.now { box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--ta) 80%, white); background: color-mix(in oklab, var(--ta) 14%, var(--panel)); }
.path li.done { opacity: .78; }
.path .pv { height: 56px; display: grid; place-items: center; }
.path .pn { font-size: 12px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.path .pl { font-size: 11px; color: var(--muted); }
.path .ck { position: absolute; top: 6px; right: 7px; color: var(--good); font-weight: 800; font-size: 13px; }
.path li.fightstep { flex: 0 0 auto; min-width: 70px; background: color-mix(in oklab, var(--fight) 14%, var(--panel)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--fight) 45%, var(--line)); }

.rates { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rate { background: var(--panel); border-radius: 14px; padding: 10px 12px; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.rate small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rate b { font-family: var(--display); font-weight: 500; font-size: 18px; }
.rate b.xpc { color: var(--xp); }
.rate b.gc { color: var(--gold); }

.tip { margin-top: 14px; background: color-mix(in oklab, var(--xp) 10%, var(--panel)); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--xp) 35%, var(--line)); }
.tip b { color: var(--xp); }
.tip button { margin-top: 8px; }

/* shop */
.h2 { font-family: var(--display); font-size: 22px; font-weight: 600; margin: 4px 0 2px; }
.lead { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.seg { display: flex; background: var(--panel); border-radius: 12px; padding: 4px; gap: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 8px 4px; font-weight: 800; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.sect { margin: 18px 0 8px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.ups { display: grid; gap: 8px; }
.up { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: var(--panel); border-radius: 16px; padding: 12px; box-shadow: inset 0 0 0 1px var(--line); }
.up-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in oklab, var(--c) 22%, var(--panel-2)); color: var(--c); }
.up-ico svg { width: 26px; height: 26px; }
.up-main { min-width: 0; }
.up-name { font-weight: 800; font-size: 15px; }
.up-lv { font-family: var(--display); font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 4px; }
.up-desc { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.up-eff { font-family: var(--display); font-size: 13.5px; margin-top: 2px; }
.up-eff .nx { color: var(--good); }
.buy { border: 0; border-radius: 12px; padding: 8px 10px; min-width: 86px; background: var(--gold); color: var(--gold-ink); font-weight: 800; cursor: pointer; display: grid; gap: 0; text-align: center; touch-action: manipulation; }
.buy small { font-size: 10.5px; font-weight: 700; opacity: .8; }
.buy b { font-family: var(--display); font-size: 15px; font-weight: 600; white-space: nowrap; }
.buy:disabled { background: var(--panel-2); color: var(--faint); box-shadow: inset 0 0 0 1px var(--line); cursor: default; }
.buy.max { background: var(--panel-2); color: var(--good); box-shadow: inset 0 0 0 1px var(--line); }

/* pokédex */
.dexstat { display: flex; gap: 14px; margin: 12px 0 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.dexstat b { color: var(--text); font-family: var(--display); font-weight: 500; font-size: 15px; }
.dexbar { height: 8px; border-radius: 5px; background: #0b0d1c; overflow: hidden; display: flex; box-shadow: inset 0 0 0 1px var(--line); }
.dexbar i { display: block; height: 100%; }
.dexbar .r { background: var(--good); }
.dexbar .s { background: color-mix(in oklab, var(--good) 35%, var(--line)); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; margin-top: 14px; }
.cell { background: var(--panel); border: 0; border-radius: 12px; padding: 6px 4px 6px; text-align: center; box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; min-width: 0; color: var(--text); }
.cell .cv { height: 58px; display: grid; place-items: center; }
.cell .cn { font-family: var(--display); font-size: 11px; color: var(--faint); }
.cell .cm { font-size: 11px; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell.reg { background: color-mix(in oklab, var(--c, var(--ta)) 12%, var(--panel)); }
.cell.reg .cn { color: var(--good); }
.cell.unk .cm { color: var(--faint); }
.cell.now { box-shadow: inset 0 0 0 2px var(--gold); }

/* sprites and emblems */
.spr { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.sil { filter: brightness(0) saturate(0); opacity: .55; }
.seen-img { filter: saturate(.25) brightness(.8); opacity: .8; }
.emb {
  --s: 64px; width: var(--s); height: var(--s); border-radius: 50%; position: relative; display: grid; place-items: center; flex: none;
  background:
    radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .55) 0 7%, transparent 8%),
    radial-gradient(circle, color-mix(in oklab, var(--a) 70%, #0b0d1c) 0 52%, transparent 53%),
    conic-gradient(from 200deg, var(--a) 0 50%, var(--b) 50% 100%);
  box-shadow: inset 0 0 0 calc(var(--s) * .045) rgba(0, 0, 0, .35), 0 calc(var(--s) * .06) 0 rgba(0, 0, 0, .3);
}
.emb::after { content: ""; position: absolute; inset: 14%; border-radius: 50%; box-shadow: inset 0 0 0 calc(var(--s) * .03) rgba(255, 255, 255, .25); }
.emb span { font-family: var(--display); font-weight: 700; font-size: calc(var(--s) * .3); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .45); position: relative; z-index: 1; line-height: 1; }
.emb.leg { box-shadow: inset 0 0 0 calc(var(--s) * .045) rgba(0, 0, 0, .35), 0 0 0 calc(var(--s) * .05) var(--gold), 0 calc(var(--s) * .08) 0 rgba(0, 0, 0, .3); }
.emb.sil { --a: #2b3157; --b: #232849; filter: none; opacity: 1; }
.emb.sil span { color: #59608c; text-shadow: none; }
.emb.dim { filter: saturate(.3) brightness(.85); }

/* modal / sheet */
.veil { position: fixed; inset: 0; background: rgba(5, 6, 16, .72); display: grid; align-items: end; justify-items: center; z-index: 50; padding: 16px 12px calc(12px + env(safe-area-inset-bottom, 0px)); animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 520px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 8px); overflow-y: auto; background: var(--panel); border-radius: 22px; padding: 20px 18px 18px; box-shadow: inset 0 0 0 1px var(--line), 0 -10px 40px rgba(0, 0, 0, .5); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } }
.sheet h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0 0 6px; text-wrap: balance; }
.sheet p { margin: 0 0 12px; color: var(--muted); }
.sheet .row { display: flex; gap: 8px; margin-top: 14px; }
.sheet .row .btn { flex: 1; }
.starters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
.starter { border: 0; background: var(--panel-2); border-radius: 16px; padding: 10px 6px 12px; cursor: pointer; display: grid; justify-items: center; gap: 6px; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.starter .sv { height: 76px; display: grid; place-items: center; }
.starter b { font-size: 14px; overflow-wrap: anywhere; }
.statgrid { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; align-items: center; font-size: 13px; margin: 10px 0; }
.statgrid .sb { height: 8px; border-radius: 4px; background: #0b0d1c; overflow: hidden; }
.statgrid .sb i { display: block; height: 100%; background: var(--c, var(--xp)); border-radius: 4px; }
.statgrid .sv2 { font-family: var(--display); text-align: right; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; margin: 8px 0 4px; }
.kv span { color: var(--muted); }
.kv b { font-family: var(--display); font-weight: 500; text-align: right; }
.flavor { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; color: var(--text); margin-top: 10px; }
.dexhead { display: flex; gap: 14px; align-items: center; }
.dexhead .big { width: 120px; height: 120px; display: grid; place-items: center; flex: none; background: radial-gradient(closest-side, color-mix(in oklab, var(--a, #555) 30%, transparent), transparent); border-radius: 50%; }
.evo-sum { display: grid; gap: 4px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 14px; }
.evo-sum li b { font-family: var(--display); font-weight: 500; }

/* toasts */
#toasts { position: fixed; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top, 0px)); display: grid; justify-items: center; gap: 6px; pointer-events: none; z-index: 60; padding: 0 16px; }
.toast { background: #262c57; color: var(--text); border-radius: 12px; padding: 8px 14px; font-size: 13.5px; font-weight: 700; box-shadow: 0 8px 24px rgba(0, 0, 0, .4), inset 0 0 0 1px var(--line); animation: toast 2.8s ease-in-out forwards; max-width: 480px; text-align: center; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }

/* evolution overlay */
.evo { position: fixed; inset: 0; z-index: 70; background: #05060f; display: grid; place-items: center; text-align: center; padding: 24px; animation: fade .25s; }
.evo .ev-stage { width: 220px; height: 220px; display: grid; place-items: center; position: relative; }
.evo .ev-stage > * { position: absolute; }
.evo .ev-from, .evo .ev-to { left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; }
.evo .ev-from { animation: evoA 2.6s steps(1) forwards; }
.evo .ev-to { opacity: 0; animation: evoB 2.6s steps(1) forwards; }
.evo .ev-flash { inset: -40px; border-radius: 50%; background: radial-gradient(closest-side, #fff, transparent); opacity: 0; animation: flash 2.6s ease-out forwards; }
.evo.go .ev-from, .evo.go .ev-to { filter: brightness(0) invert(1); }
.evo.done .ev-from { opacity: 0; animation: none; }
.evo.done .ev-to { opacity: 1; animation: none; filter: none; }
@keyframes evoA { 0% { opacity: 1; } 20% { opacity: 0; } 30% { opacity: 1; } 45% { opacity: 0; } 52% { opacity: 1; } 62% { opacity: 0; } 67% { opacity: 1; } 74% { opacity: 0; } 78% { opacity: 1; } 84%, 100% { opacity: 0; } }
@keyframes evoB { 0% { opacity: 0; } 20% { opacity: 1; } 30% { opacity: 0; } 45% { opacity: 1; } 52% { opacity: 0; } 62% { opacity: 1; } 67% { opacity: 0; } 74% { opacity: 1; } 78% { opacity: 0; } 84%, 100% { opacity: 1; } }
@keyframes flash { 0%, 80% { opacity: 0; } 88% { opacity: 1; } 100% { opacity: 0; } }
.evo h2 { font-family: var(--display); font-size: 24px; font-weight: 600; margin: 18px 0 6px; text-wrap: balance; }
.evo p { color: var(--muted); margin: 0 0 16px; }

/* battle */
.battle { position: fixed; inset: 0; z-index: 40; background: var(--ink); display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.battle .col { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.field {
  position: relative; flex: 1; min-height: 300px; border-radius: 22px; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer;
  background:
    radial-gradient(70% 45% at 76% 40%, color-mix(in oklab, var(--eb, #888) 30%, transparent), transparent 70%),
    radial-gradient(70% 45% at 26% 86%, color-mix(in oklab, var(--ta) 30%, transparent), transparent 70%),
    linear-gradient(180deg, #1c2042, #10132a);
  box-shadow: inset 0 0 0 1px var(--line);
}
.field.shake { animation: shake .25s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.hpcard { position: absolute; background: rgba(13, 15, 34, .86); border-radius: 14px; padding: 8px 10px 9px; width: min(62%, 260px); box-shadow: inset 0 0 0 1px var(--line); }
.hpcard.e { top: 12px; left: 12px; }
.hpcard.p { bottom: 12px; right: 12px; }
.hpcard .nm { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 14px; }
.hpcard .nm span:last-child { font-family: var(--display); font-weight: 500; color: var(--muted); white-space: nowrap; }
.hp { height: 10px; border-radius: 5px; background: #0b0d1c; overflow: hidden; margin-top: 5px; box-shadow: inset 0 0 0 1px var(--line); }
.hp i { display: block; height: 100%; width: 100%; background: var(--good); transition: width .18s linear, background-color .3s; }
.hpnum { font-family: var(--display); font-size: 12px; color: var(--muted); margin-top: 3px; text-align: right; }
.charge { height: 5px; border-radius: 3px; background: #0b0d1c; margin-top: 6px; overflow: hidden; }
.charge i { display: block; height: 100%; background: var(--warn); width: 0; transition: width .1s; }
.charge.full i { background: var(--fight); }
.bspr { position: absolute; display: grid; place-items: end center; pointer-events: none; }
.bspr.e { right: 8%; top: 22%; }
.bspr.p { left: 6%; bottom: 20%; }
.bspr .plat { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 150%; height: 26px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .45), transparent); z-index: -1; }
.bspr .hit { animation: hitflash .22s steps(2); }
@keyframes hitflash { 50% { opacity: .2; } }
.bspr .lunge { animation: lunge .22s ease-out; }
@keyframes lunge { 40% { transform: translate(10px, -6px); } }
.blog { min-height: 46px; margin: 10px 0; background: var(--panel); border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 700; box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; }
.bact { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.bact .btn { padding: 12px 10px; font-size: 14px; }
.bact .btn b { font-family: var(--display); font-weight: 500; }
.timer { position: absolute; top: 14px; right: 14px; font-family: var(--display); color: var(--muted); font-size: 14px; }
.tapnote { position: absolute; left: 0; right: 0; bottom: 30%; text-align: center; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .45); pointer-events: none; }

.matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 10px 0 6px; }
.matchup .side { text-align: center; min-width: 0; }
.matchup .side .mv { height: 92px; display: grid; place-items: center; }
.matchup .side b { display: block; font-size: 14px; overflow-wrap: anywhere; }
.matchup .side small { color: var(--muted); font-family: var(--display); }
.matchup .vs { font-family: var(--display); font-size: 22px; color: var(--fight); }
.verdict { border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px; margin: 10px 0 4px; }
.verdict.ok { background: color-mix(in oklab, var(--good) 16%, var(--panel-2)); color: #bff3d1; }
.verdict.mid { background: color-mix(in oklab, var(--warn) 16%, var(--panel-2)); color: #ffe6a6; }
.verdict.hard { background: color-mix(in oklab, var(--bad) 18%, var(--panel-2)); color: #ffc4c2; }
.itemrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 12px; padding: 8px 10px; margin-top: 8px; font-size: 13.5px; }
.itemrow b { font-family: var(--display); font-weight: 500; }

.more-list { display: grid; gap: 8px; }
.card { background: var(--panel); border-radius: 16px; padding: 14px; box-shadow: inset 0 0 0 1px var(--line); }
.card h3 { margin: 0 0 6px; font-size: 15px; }
.card p { margin: 0 0 8px; color: var(--muted); font-size: 13.5px; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; font-size: 14px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--gold); }
textarea { width: 100%; min-height: 84px; background: #0b0d1c; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }
.help li { margin-bottom: 6px; color: var(--muted); font-size: 13.5px; }
.help li b { color: var(--text); }
.fine { font-size: 12px; color: var(--faint); }

@media (prefers-reduced-motion: reduce) {
  .mon-vis .bob, .btn.fight, .evo .ev-from, .evo .ev-to, .evo .ev-flash { animation: none !important; }
  .evo .ev-to { opacity: 1; }
  .evo .ev-from { opacity: 0; }
}
body.calm .mon-vis .bob, body.calm .btn.fight { animation: none; }

    } catch (e) { cloud.ref = null; }
  }

  // ---------- derived ----------
  function regionOfLi() { return ctx(W, S).line.region; }
  function pendingStarter() {
    if (S.done) return false;
    const r = regionOfLi();
    return S.starters[r] == null && S.li === regionStart(W, r);
  }
  function curCps() { const c = ctx(W, S); return coinsPerSec(W, S, c.p, c.sp.bst); }
  function xpToLevel(c, target) {
    let sum = -S.xp;
    for (let L = S.lvl; L < target; L++) sum += xpNeed(W, c.line, c.p, L, spOf(W, c.line.m[S.stage]));
    return Math.max(0, sum);
  }
  function powerBonus() { const c = ctx(W, S); return Math.pow(S.lvl / c.line.bl, 1.2) - 1; }

  // ---------- toasts ----------
  function toast(msg) {
    const box = $('#toasts');

    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    box.appendChild(t); setTimeout(() => t.remove(), 2900);
  }
  function vibe(ms) { if (S.settings.vibe && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* not allowed here */ } } }

  // ---------- sheets ----------
  let curSheet = null;
  function openSheet(html, opts = {}) {
    closeSheet(true);
    const veil = document.createElement('div');
    veil.className = 'veil';
    veil.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    if (opts.dismissible !== false) veil.addEventListener('pointerdown', e => { if (e.target === veil) closeSheet(); });
    document.body.appendChild(veil);
    curSheet = { veil, onClose: opts.onClose, dismissible: opts.dismissible !== false };
    const first = veil.querySelector('[data-autofocus]') || veil.querySelector('button');
    if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);
    return veil.firstElementChild;
  }
  function closeSheet(silent) {
    if (!curSheet) return;
    const { veil, onClose } = curSheet;
    curSheet = null; veil.remove();
    if (!silent && onClose) onClose();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && curSheet && curSheet.dismissible) closeSheet(); });

  // ---------- tabs ----------
  let tab = 'train';
  function setTab(t) {

    if (t === 'more') renderMore();
    $('#main').scrollTop = 0;
  }
  $$('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  function renderAll() {
    if (!S) return;
    document.body.classList.toggle('calm', !!S.settings.calm);
    renderHeader();
    if (tab === 'train') renderTrain(); else if (tab === 'shop') renderShop(); else if (tab === 'dex') renderDex(); else renderMore();
    if (pendingStarter() && !curSheet) openStarter();
  }

  // ---------- header ----------
  function renderHeader() {
    const r = regionOfLi(); const [name, a, b] = W.R[r];
    let n = 0; for (let i = a; i <= b; i++) if (S.reg[i]) n++;
    $('#hdr-region').textContent = name;
    $('#hdr-dex').textContent = n + '/' + (b - a + 1);
  }

  // ---------- training ----------
  function setTypeColors(sp) {
    const a = TYPE_COL[sp.types[0]], b = TYPE_COL[sp.types[1] != null ? sp.types[1] : sp.types[0]];
    document.documentElement.style.setProperty('--ta', a);
    document.documentElement.style.setProperty('--tb', b);
  }
  function stageReq(line, s) {
    const m = line.meth[s];
    const lv = line.lv[s];
    if (!m) return '';
    if (m[0] === 'stone') return `${esc(m[1])} ab Lv. ${lv}`;
    if (m[0] === 'level') return `ab Lv. ${lv}`;
    return `ab Lv. ${lv} · ${esc(m[1])}`;
  }
  function pathHTML(c) {
    const line = c.line; const out = [];
    line.m.forEach((id, s) => {
      const sp = W.P[id - 1];
      const done = s < S.stage, now = s === S.stage;
      const mode = done || now || S.reg[id] ? 'reg' : S.seen[id] ? 'seen' : 'unk';
      const sub = s === 0 ? `Start Lv. ${line.lv[0]}` : stageReq(line, s);
      out.push(`<li class="${done ? 'done' : ''} ${now ? 'now' : ''}">
        ${done || S.reg[id] ? '<span class="ck" aria-label="gelevelt">✓</span>' : ''}
        <div class="pv">${monHTML(id, 56, { mode, emb: 0.78 })}</div>
        <div class="pn">${esc(sp.name)}</div><div class="pl">${sub}</div></li>`);
    });
    const opp = W.P[line.opp - 1];
    out.push(`<li class="fightstep"><div class="pv"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ff8a85" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l9 9M4 4v4M4 4h4M20 4l-9 9M20 4v4M20 4h-4M7 17l-3 3M17 17l3 3M8.5 15.5l-2-2M15.5 15.5l2-2"/></svg></div>
      <div class="pn">Kampf</div><div class="pl">${S.ready ? 'vs ' + esc(opp.name) : 'ab Lv. ' + line.bl}</div></li>`);
    return out.join('');
  }
  function tipHTML() {
    if (S.flags.tut) return '';
    return `<div class="tip" id="tut"><b>So läuft's:</b> Dein Pokémon sammelt jede Sekunde EP. Tippe es an, dann gibt es extra EP und Coins. Mit Coins kaufst du im Shop Upgrades. Erreicht dein Pokémon seine letzte Entwicklung, wartet ein Kampf, den du mit schnellem Tippen gewinnst.
      <div><button class="btn small" id="tut-ok">Verstanden</button></div></div>`;
  }
  function renderTrain() {
    const v = $('#v-train');

    if (pendingStarter()) {
      const r = regionOfLi();
      v.innerHTML = `<div class="card"><h3>${esc(W.R[r][0])} wartet auf dich</h3><p>Wähle deinen Partner, um das Training zu starten.</p><button class="btn gold" id="pick">Partner wählen</button></div>`;

        <span class="floaters" id="t-fl"></span>

    const st = $('#stage');
    st.addEventListener('pointerdown', e => { e.preventDefault(); tapTrain(e); });
    st.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tapTrain(null); } });
    st.addEventListener('contextmenu', e => e.preventDefault());
    const tut = $('#tut-ok'); if (tut) tut.onclick = () => { S.flags.tut = 1; markDirty(); $('#tut').remove(); };
    renderAction();
    refresh(true);
  }
  let actionKey = '';
  function renderAction() {
    const box = $('#t-action'); if (!box) return;
    const c = ctx(W, S);
    let key = '', html = '';
    if (S.stone && c.isStone) {
      const price = stonePrice();
      key = 'stone' + (S.coins >= price);
      html = `<button class="btn gold" id="a-stone" ${S.coins >= price ? '' : 'disabled'}>${esc(c.nextMeth[1])} kaufen und benutzen<span class="sub">· ${fInt(price)} Coins</span></button>`;
    } else if (c.final && S.ready) {
      const cool = Math.ceil((S.cool - Date.now()) / 1000);
      const opp = W.P[c.line.opp - 1];
      if (cool > 0) { key = 'cool' + cool; html = `<button class="btn" disabled>${esc(c.sp.name)} erholt sich noch ${cool} Sek.</button>`; }
      else { key = 'fight'; html = `<button class="btn fight" id="a-fight">Kampf gegen ${esc(opp.name)}<span class="sub">Lv. ${c.line.oppLv} · Tippen entscheidet</span></button>`; }
    }

    const sBtn = $('#a-stone'); if (sBtn) sBtn.onclick = buyStone;
    const fBtn = $('#a-fight'); if (fBtn) fBtn.onclick = openPreBattle;
  }
  function stonePrice() { return Math.max(50, 30 * curCps()); }
  function buyStone() {
    const price = stonePrice();
    if (S.coins < price) return;
    S.coins -= price;
    const ev = useStone(W, S);
    markDirty();
    handleEvents(ev);
  }

  let lastTap = 0, floatCount = 0;
  function tapTrain(e) {
    if (!S || pendingStarter() || S.done) return;
    const now = performance.now();
    if (now - lastTap < 55) return;
    lastTap = now;
    const c = ctx(W, S);
    const cps = coinsPerSec(W, S, c.p, c.sp.bst);
    const coin = coinsPerTap(cps, S), xp = xpPerTap(S);
    const atCap = S.lvl >= c.cap;
    S.coins += coin; S.life += coin; S.stats.taps++;
    const ev = addXP(W, S, xp);
    const st = $('#stage');
    if (st) {
      const r = st.getBoundingClientRect();
      const x = e && e.clientX != null ? e.clientX - r.left : r.width / 2;
      const y = e && e.clientY != null ? e.clientY - r.top : r.height / 2;
      if (!atCap) floater(`+${fRate(xp)} EP`, 'xp', x, y - 10);
      floater(`+${fInt(coin)}`, 'co', x + rnd(-26, 26), y + 16);
      const bob = $('#t-bob');
      if (bob && !reduceMotion()) { bob.classList.remove('squash'); void bob.offsetWidth; bob.classList.add('squash'); }
      if (!reduceMotion()) burst(x, y, 4);
      if (S.stats.taps === 41) { const h = $('#t-hint'); if (h) h.hidden = true; }
    }
    vibe(6);
    handleEvents(ev);
  }
  function floater(text, cls, x, y, host) {
    host = host || $('#t-fl'); if (!host) return;
    if (floatCount > 22) return;
    const f = document.createElement('span');
    f.className = 'fl ' + cls; f.textContent = text;
    f.style.left = x + 'px'; f.style.top = y + 'px';
    host.appendChild(f); floatCount++;
    setTimeout(() => { f.remove(); floatCount--; }, 900);
  }
  function burst(x, y, n, host) {
    host = host || $('#t-fl'); if (!host) return;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('span'); p.className = 'px';
      const a = rnd(0, Math.PI * 2), d = rnd(26, 60);
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.setProperty('--dx', Math.cos(a) * d + 'px'); p.style.setProperty('--dy', Math.sin(a) * d + 'px');
      host.appendChild(p); setTimeout(() => p.remove(), 560);
    }
  }
  function levelFx() {
    const b = $('#t-lv');
    if (b) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
    const st = $('#stage');
    if (st && !reduceMotion()) { const r = document.createElement('span'); r.className = 'ring'; st.appendChild(r); setTimeout(() => r.remove(), 720); }
  }

  // ---------- events from the rules ----------
  const evoQueue = []; let evoShowing = false;
  function handleEvents(ev, quiet) {
    if (!ev || !ev.length) return;
    let lv = 0, structural = false;
    for (const e of ev) {
      if (e.e === 'level') lv++;
      else if (e.e === 'evolve') { structural = true; markDirty(); if (!quiet) { evoQueue.push(e); } }
      else if (e.e === 'stone') { structural = true; if (!quiet) toast(`${ctx(W, S).sp.name} ist bereit. Jetzt fehlt nur noch der Stein.`); }
      else if (e.e === 'ready') { structural = true; markDirty(); if (!quiet) { toast('Kampf bereit!'); vibe(30); } }
    }
    if (lv && !quiet) levelFx();
    if (structural) { renderHeader(); if (tab === 'train') renderTrain(); }
    if (!quiet && evoQueue.length && !evoShowing) showEvo();
  }
  function showEvo() {
    const e = evoQueue.shift(); if (!e) { evoShowing = false; return; }
    evoShowing = true;
    const A = W.P[e.from - 1], B2 = W.P[e.to - 1];
    const ov = document.createElement('div');
    ov.className = 'evo go';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = `<div>
      <div class="ev-stage"><span class="ev-flash"></span><span class="ev-from">${monHTML(A.id, 170, { kind: 'anim', scale: 2.4 })}</span><span class="ev-to">${monHTML(B2.id, 170, { kind: 'anim', scale: 2.4 })}</span></div>
      <h2 id="ev-t">${esc(A.name)} entwickelt sich …</h2><p id="ev-p">&nbsp;</p>
      <button class="btn gold" id="ev-ok" style="visibility:hidden">Weiter</button></div>`;
    document.body.appendChild(ov);
    const finish = () => {
      if (!ov.isConnected) return;
      ov.classList.remove('go'); ov.classList.add('done');
      $('#ev-t', ov).textContent = `${A.name} hat sich zu ${B2.name} entwickelt!`;
      $('#ev-p', ov).textContent = (e.isNew ? `${A.name} ist jetzt im Pokédex gelevelt. ` : '') + `+${fInt(e.reward)} Coins`;
      const ok = $('#ev-ok', ov); ok.style.visibility = 'visible'; ok.focus({ preventScroll: true });
      vibe(40);
    };
    const t = setTimeout(finish, reduceMotion() ? 200 : 2700);
    const close = () => { clearTimeout(t); ov.remove(); evoShowing = false; if (evoQueue.length) showEvo(); };
    $('#ev-ok', ov).onclick = close;
    ov.addEventListener('pointerdown', ev2 => { if (ov.classList.contains('done') && ev2.target === ov) close(); });
  }

  // ---------- refresh numbers ----------
  let shopTick = 0;
  function refresh(force) {
    if (!S) return;
    const c = ctx(W, S);
    const cps = coinsPerSec(W, S, c.p, c.sp.bst);
    $('#coins').textContent = fInt(S.coins);
    $('#cps').textContent = '+' + fRate(cps) + ' Coins/s';
    // dots on tabs
    let any = false;
    for (const u of UPG) { if (u.max && S.up[u.id] >= u.max) continue; if (upCost(u.id, S.up[u.id]) <= S.coins) { any = true; break; } }
    $('#shop-dot').hidden = !any;
    if (tab === 'train' && !pendingStarter() && !S.done && $('#t-fill')) {

      $('#t-xp').innerHTML = atCap ? `<b>Maximum für diesen Abschnitt</b>` : `<b>${fRate(S.xp)}</b> / ${fRate(need)} EP`;
      $('#t-rate').textContent = '+' + fRate(xpPerSec(S)) + ' EP/s';

  }
  function goalText(c, atCap) {
    const xps = xpPerSec(S);

  // ---------- shop ----------
  let buyMode = 1;
  const UP_INFO = {

    zahltag: { col: '#ffcb45', desc: 'Ein Tipp bringt 1 Coin plus diesen Anteil deines Einkommens pro Sekunde.', lab: 'Tipp', val: v => nf2.format(v) + ' s', ico: '<circle cx="9" cy="9" r="5"/><circle cx="15" cy="15" r="5"/>' },
    amulett: { col: '#ffb347', desc: 'Coins pro Sekunde +20 % je Stufe.', lab: 'Coins/s', val: v => '×' + fMult(v), ico: '<circle cx="12" cy="14" r="6"/><path d="M12 8V3M9 3h6"/><path d="M12 11v6M10 13h3a1 1 0 0 1 0 2h-2a1 1 0 0 0 0 2h3"/>' },
    protein: { col: '#ff7b74', desc: 'Mehr Schaden im Kampf, ×1,12 je Stufe.', lab: 'Schaden', val: v => '×' + fMult(v), ico: '<path d="M5 19l9-9M14 10l3-3 2 2-3 3M8 13l3 3"/><path d="M4 20l2-2"/>' },
    kp: { col: '#6fe39a', desc: 'Mehr KP im Kampf, ×1,12 je Stufe.', lab: 'KP', val: v => '×' + fMult(v), ico: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>' },
  };
  function bulk(id) {
    const u = UPGI[id]; const n = S.up[id];
    const room = u.max ? u.max - n : Infinity;

    let m;

      m = Math.floor(Math.log(S.coins * (u.r - 1) / a + 1) / Math.log(u.r));
      m = clamp(m, 1, room);

  }
  function upRow(id) {

  }
  const ITEMS = {
    potion: { name: 'Supertrank', desc: 'Heilt im Kampf die Hälfte deiner KP.', col: '#6fe39a', max: 20, price: () => Math.max(30, 25 * curCps()), ico: '<path d="M9 3h6M10 3v5l-4 7a4 4 0 0 0 3.5 6h5a4 4 0 0 0 3.5-6l-4-7V3"/><path d="M7 15h10"/>' },
    xatk: { name: 'X-Angriff', desc: 'Ein Kampf lang 50 % mehr Schaden.', col: '#ff7b74', max: 9, price: () => Math.max(80, 60 * curCps()), ico: '<path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/>' },
    candy: { name: 'Sonderbonbon', desc: 'Sofort ein Level aufsteigen.', col: '#c7a3ff', price: candyPrice, ico: '<rect x="7" y="8" width="10" height="8" rx="4"/><path d="M7 12l-4-3v6zM17 12l4-3v6z"/>' },

  function moveFor(attTypes, defTypes) {

    const need = st.eHp / ttd;
    const auto = st.hit * x, per = (st.tap + st.special / K.specialEvery) * x;
    return Math.max(0, (need - auto) / per);
  }

    else { cls = 'hard'; txt = `Sehr schwer: etwa ${f(t0)} Tipps pro Sekunde nötig. Trainiere weiter oder rüste im Shop auf.`; }

    if (S.inv.potion > 0 && tp < t0 - 0.05) extra.push(`mit ${S.inv.potion} Supertrank${S.inv.potion > 1 ? 'en' : ''}: ${f(tp)}/s`);

    const host = $('#b-fl'), spr = $(who === 'e' ? '#b-espr' : '#b-pspr'), f = $('#b-field');
    if (!host || !spr) return;
    const fr = f.getBoundingClientRect(), r = spr.getBoundingClientRect();
    floater(text, cls, r.left - fr.left + r.width / 2 + rnd(-22, 22), r.top - fr.top + r.height * 0.35, host);
  }
  function flash(who, cls) {
    const spr = $(who === 'e' ? '#b-espr' : '#b-pspr'); if (!spr) return;
    const img = spr.lastElementChild; if (!img || reduceMotion()) return;
    img.classList.remove(cls); void img.offsetWidth; img.classList.add(cls);
  }
  function dmgEnemy(d, crit, label) {
    BT.ehp -= d;
    bfloat(fInt(d), crit ? 'crit' : 'dmg', 'e');
    flash('e', 'hit');
    if (label) blog(label);
    if (BT.ehp <= 0) endBattle(true);
  }
  function tapBattle(e) {
    if (!BT || BT.over || BT.paused) return;
    const now = performance.now();
    if (now - BT.lastTap < 55) return;
    BT.lastTap = now;
    S.stats.taps++;
    BT.charge++;
    const f = $('#b-field');
    if (e && f && !reduceMotion()) { const r = f.getBoundingClientRect(); burst(e.clientX - r.left, e.clientY - r.top, 3, $('#b-fl')); }
    if (BT.charge >= K.specialEvery) {
      BT.charge = 0;
      const d = BT.st.special * BT.x * rnd(0.95, 1.05);
      const et = effText(BT.pm.raw);
      flash('p', 'lunge'); vibe(25);
      dmgEnemy(d, true, `${BT.P.name} setzt ${BT.pm.names[1]} ein!${et ? ' ' + et : ''}`);
    } else {
      dmgEnemy(BT.st.tap * BT.x * rnd(0.9, 1.1), false);
      vibe(5);
    }
    battleUI();
  }
  function usePotion() {
    if (!BT || BT.over || S.inv.potion <= 0 || BT.potCd > 0) return;
    S.inv.potion--; BT.potCd = 1.2;
    const heal = BT.st.maxHp * 0.5;
    BT.hp = Math.min(BT.st.maxHp, BT.hp + heal);
    bfloat('+' + fInt(heal), 'heal', 'p');
    blog(`Supertrank! ${BT.P.name} ist wieder fitter.`);
    markDirty(); battleUI();
  }
  function useX() {
    if (!BT || BT.over || S.inv.xatk <= 0 || BT.xUsed) return;
    S.inv.xatk--; BT.xUsed = true; BT.x = 1.5;
    blog(`X-Angriff! ${BT.P.name} teilt jetzt 50 % mehr Schaden aus.`);
    markDirty(); battleUI();
  }
  function battleStep(dt) {
    if (!BT || BT.over || BT.paused) return;
    BT.t += dt; BT.potCd = Math.max(0, BT.potCd - dt);
    BT.nextP -= dt; BT.nextE -= dt;
    let guard = 0;
    while (BT.nextP <= 0 && !BT.over && guard++ < 10) {
      BT.nextP += 1;
      const crit = Math.random() < 0.05;
      const d = BT.st.hit * BT.x * rnd(0.92, 1.08) * (crit ? 1.5 : 1);
      flash('p', 'lunge');
      dmgEnemy(d, crit, crit ? 'Volltreffer!' : (BT.t < 1.5 ? (effText(BT.pm.raw) ? `${BT.pm.names[0]}: ${effText(BT.pm.raw)}` : '') : ''));
    }
    guard = 0;
    while (BT.nextE <= 0 && !BT.over && guard++ < 10) {
      BT.nextE += K.enemyInterval;
      BT.eHits++;
      const crit = Math.random() < 0.05;
      const d = BT.st.eHit * rnd(0.92, 1.08) * (crit ? 1.5 : 1);
      BT.hp -= d;
      bfloat(fInt(d), crit ? 'crit' : 'dmg', 'p');
      flash('p', 'hit');
      if (!reduceMotion()) { const f = $('#b-field'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
      if (BT.eHits === 1 || crit || BT.eHits % 4 === 0) {
        const et = effText(BT.em.raw);
        blog(`${BT.O.name} setzt ${crit ? BT.em.names[1] : BT.em.names[0]} ein!${crit ? ' Volltreffer!' : et ? ' ' + et : ''}`);
      }
      if (BT.hp <= BT.st.maxHp * 0.25 && BT.hp > 0 && S.inv.potion > 0 && !BT.warned) { BT.warned = true; blog(`${BT.P.name} wird schwach. Ein Supertrank hilft!`); }
      if (BT.hp <= 0) endBattle(false);
    }
    battleUI();
  }
  function endBattle(won) {
    if (!BT || BT.over) return;
    BT.over = true; battleUI();
    const P = BT.P, O = BT.O;
    if (won) {
      const ev = winBattle(W, S);
      markDirty(); saveLocal();
      const win = ev.find(e => e.e === 'win');
      const reg = ev.find(e => e.e === 'region');
      const done = ev.find(e => e.e === 'gameDone');
      vibe(60);
      setTimeout(() => {
        openSheet(`<h2>Sieg!</h2>
          <p>${esc(O.name)} ist besiegt. ${win.isNew ? esc(P.name) + ' ist jetzt im Pokédex gelevelt.' : esc(P.name) + ' hat seine Stärke bewiesen.'}</p>
          <div class="kv"><span>Belohnung</span><b>+${fInt(win.reward)} Coins</b><span>Kampfdauer</span><b>${nf1.format(BT.t)} s</b></div>
          <div class="row"><button class="btn gold" data-autofocus id="w-ok">Weiter</button></div>`, {
          dismissible: false,
        });
        $('#w-ok').onclick = () => {
          closeSheet(true); closeBattle(true); actionKey = '';
          if (done) { renderAll(); openDone(); }
          else if (reg) openRegionDone(reg);
          else { renderAll(); const n = ctx(W, S).sp; toast(`Neues Training: ${n.name}`); }
        };
      }, 450);
    } else {
      S.stats.losses++;
      S.cool = Date.now() + K.lossCooldown * 1000;
      markDirty(); saveLocal();
      const left = clamp(BT.ehp / BT.st.eHp, 0, 1);
      const tips = [];
      tips.push(`Im Shop helfen <b>Protein</b> (Schaden) und <b>KP-Plus</b> (mehr KP).`);
      const c = ctx(W, S);
      if (S.lvl < c.cap) tips.push(`Weiter trainieren lohnt sich: Jedes Level macht ${esc(P.name)} stärker.`);
      tips.push(`<b>Supertränke</b> und <b>X-Angriff</b> geben dir im Kampf Luft.`);
      setTimeout(() => {
        openSheet(`<h2>Niederlage</h2>
          <p>${esc(P.name)} wurde besiegt. ${esc(O.name)} hatte noch ${nf0.format(Math.ceil(left * 100))} % KP.</p>
          <ul class="help">${tips.map(t => `<li>${t}</li>`).join('')}</ul>
          <p class="fine">${esc(P.name)} erholt sich ${K.lossCooldown} Sekunden lang und trainiert dabei weiter.</p>
          <div class="row"><button class="btn gold" data-autofocus id="l-ok">Zurück zum Training</button></div>`);
        $('#l-ok').onclick = () => closeSheet();
        curSheet.onClose = () => { closeBattle(); renderAll(); };
      }, 450);
    }
  }
  function closeBattle(silent) {
    const box = $('#battle');
    box.hidden = true; box.innerHTML = '';
    BT = null;
    if (!silent) { actionKey = ''; renderAll(); }
  }

  // ---------- region done / game done ----------
  function openRegionDone(reg) {
    const from = W.R[reg.from], to = W.R[reg.to];
    openSheet(`<h2>${esc(from[0])} abgeschlossen!</h2>
      <p>Alle ${from[2] - from[1] + 1} Pokémon aus ${esc(from[0])} sind gelevelt. Als Belohnung gibt es dauerhaft ×${nf1.format(K.regionBonus)} auf EP und Coins.</p>
      <div class="kv"><span>Bonus-Coins</span><b>+${fInt(reg.reward)}</b></div>
      <div class="row"><button class="btn gold" data-autofocus id="rg-ok">Auf nach ${esc(to[0])}</button></div>`, { dismissible: false });
    $('#rg-ok').onclick = () => { closeSheet(true); dexRegion = null; renderAll(); };
  }
  function doneHTML() {
    return `<div class="card"><h3>Reise abgeschlossen</h3><p>Du hast alle 386 Pokémon aus Kanto, Johto und Hoenn gelevelt. Weitere Regionen folgen.</p>
      <div class="kv"><span>Spielzeit</span><b>${fTime(S.stats.time)}</b><span>Tipps</span><b>${fInt(S.stats.taps)}</b><span>Kämpfe gewonnen</span><b>${S.stats.wins}</b></div></div>`;
  }
  function openDone() {
    openSheet(`<h2>Alle 386 Pokémon gelevelt!</h2><p>Kanto, Johto und Hoenn sind komplett. Starke Leistung.</p>
      <div class="kv"><span>Spielzeit</span><b>${fTime(S.stats.time)}</b><span>Kämpfe gewonnen</span><b>${S.stats.wins}</b><span>Tipps</span><b>${fInt(S.stats.taps)}</b></div>
      <div class="row"><button class="btn gold" id="gd-ok">Pokédex ansehen</button></div>`, { dismissible: false });
    $('#gd-ok').onclick = () => { closeSheet(true); setTab('dex'); };
  }

  // ---------- more ----------
  let resetArmed = false;
  function renderMore() {
    const v = $('#v-more');
    const st = S.stats;
    v.innerHTML = `<h2 class="h2">Mehr</h2>
      <div class="more-list">
        <div class="card"><h3>Statistik</h3><div class="kv">
          <span>Aktive Spielzeit</span><b>${fTime(st.time)}</b>
          <span>Pension (offline)</span><b>${fTime(st.away || 0)}</b>
          <span>Tipps</span><b>${fInt(st.taps)}</b>
          <span>Entwicklungen</span><b>${st.evos}</b>
          <span>Kämpfe gewonnen / verloren</span><b>${st.wins} / ${st.losses}</b>
          <span>Coins insgesamt</span><b>${fInt(S.life)}</b>
          <span>Pokédex gelevelt</span><b>${S.regCount} / 386</b></div></div>
        <div class="card"><h3>Einstellungen</h3>
          <label class="toggle"><span>Vibration beim Tippen (Android)</span><input type="checkbox" id="set-vibe" ${S.settings.vibe ? 'checked' : ''}></label>
          <label class="toggle"><span>Ruhige Animationen</span><input type="checkbox" id="set-calm" ${S.settings.calm ? 'checked' : ''}></label></div>
        <div class="card"><h3>Spielstand</h3>
          <p>Gespeichert wird automatisch in diesem Browser${cloud.ref ? ' und zusätzlich in deinem Claude-Konto' : ''}. Mit dem Code ziehst du deinen Fortschritt auf ein anderes Gerät um.</p>
          <div class="row" style="margin-top:0"><button class="btn small" id="ex-btn">Code anzeigen</button><button class="btn small" id="im-btn">Code einfügen</button></div>
          <div id="ex-box" hidden style="margin-top:10px"><textarea id="ex-ta" readonly aria-label="Spielstand-Code"></textarea><button class="btn small" id="ex-copy" style="margin-top:6px">Kopieren</button></div>
          <div id="im-box" hidden style="margin-top:10px"><textarea id="im-ta" aria-label="Spielstand-Code einfügen" placeholder="Code hier einfügen"></textarea><button class="btn small gold" id="im-go" style="margin-top:6px">Spielstand laden</button></div>
          <div style="margin-top:12px"><button class="btn small" id="rs-btn">${resetArmed ? 'Wirklich alles löschen? Tippe nochmal' : 'Neu anfangen'}</button></div></div>
        <div class="card"><h3>So funktioniert's</h3><ul class="help">
          <li><b>Training:</b> Dein Pokémon sammelt jede Sekunde EP. Tippen bringt extra EP und Coins.</li>
          <li><b>Entwicklung:</b> Es entwickelt sich zu den Original-Levels. Steine kaufst du, sobald es so weit ist. Tausch- und Freundschaftsentwicklungen passieren hier per Level.</li>
          <li><b>Kampf:</b> Nach der letzten Entwicklung kämpft dein Pokémon gegen einen ebenbürtigen Gegner aus der Region. Es greift jede Sekunde selbst an, deine Tipps treffen zusätzlich. Nach dem Sieg ist es im Pokédex gelevelt.</li>
          <li><b>Pokédex:</b> Jedes gelevelte Pokémon gibt +2 % auf EP und Coins und verdient dauerhaft mit.</li>
          <li><b>Pension:</b> Auch wenn du weg bist, wird bis zu 12 Stunden weiter trainiert.</li>
          <li><b>Regionen:</b> Sind alle Pokémon einer Region gelevelt, geht es weiter: Kanto, Johto, Hoenn.</li></ul></div>
        <div class="card"><p class="fine">Daten: PokéAPI (pokeapi.co). ${spritesOK ? 'Bilder werden live aus dem PokéAPI-Sprite-Archiv geladen.' : 'In dieser Ansicht sind externe Bilder gesperrt, deshalb zeigt das Spiel eigene Typ-Embleme.'} Fan-Projekt ohne Verbindung zu Nintendo, Game Freak oder The Pokémon Company.</p></div>
      </div>`;
    $('#set-vibe').onchange = e => { S.settings.vibe = e.target.checked; markDirty(); };
    $('#set-calm').onchange = e => { S.settings.calm = e.target.checked; document.body.classList.toggle('calm', S.settings.calm); markDirty(); };
    $('#ex-btn').onclick = () => { const b = $('#ex-box'); b.hidden = !b.hidden; $('#im-box').hidden = true; $('#ex-ta').value = exportCode(); };
    $('#im-btn').onclick = () => { const b = $('#im-box'); b.hidden = !b.hidden; $('#ex-box').hidden = true; };
    $('#ex-copy').onclick = () => {
      const ta = $('#ex-ta');
      try { navigator.clipboard.writeText(ta.value).then(() => toast('Code kopiert'), () => { ta.select(); toast('Markiert. Jetzt kopieren.'); }); }
      catch (e) { ta.select(); toast('Markiert. Jetzt kopieren.'); }
    };
    $('#im-go').onclick = () => {
      const s = importCode($('#im-ta').value);
      if (!s) { toast('Der Code ist ungültig.'); return; }
      closeBattle(true); S = s; S.savedAt = Date.now(); markDirty(); saveLocal(); dexRegion = null; renderAll(); toast('Spielstand geladen');
    };
    $('#rs-btn').onclick = () => {
      if (!resetArmed) { resetArmed = true; renderMore(); setTimeout(() => { resetArmed = false; if (tab === 'more') renderMore(); }, 5000); return; }
      resetArmed = false; closeBattle(true);
      S = freshState(); markDirty(); saveLocal(); dexRegion = null; actionKey = '';
      setTab('train'); renderAll();
    };
  }
  function exportCode() {
    const bytes = new TextEncoder().encode(JSON.stringify(S));
    let bin = '';
    for (let i = 0; i < bytes.length; i += 4096) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 4096));
    return 'PKIDLE1:' + btoa(bin);
  }
  function importCode(code) {
    try {
      code = String(code || '').trim();
      if (!code.startsWith('PKIDLE1:')) return null;
      const bin = atob(code.slice(8));
      const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
      return sanitize(JSON.parse(new TextDecoder().decode(bytes)));
    } catch (e) { return null; }
  }

  // ---------- offline progress ----------
  function offlineCatchup(sec, showModal) {
    sec = Math.min(sec, K.offlineCapH * 3600);
    if (!S || sec < 1 || pendingStarter() || S.done) return;
    const c = ctx(W, S);
    const cps = coinsPerSec(W, S, c.p, c.sp.bst);
    const lv0 = S.lvl, sp0 = c.sp;
    const coins = cps * sec;
    S.coins += coins; S.life += coins;
    S.stats.away = (S.stats.away || 0) + sec;
    const ev = addXP(W, S, xpPerSec(S) * sec);
    handleEvents(ev, true);
    markDirty();
    if (!showModal) return;
    const evos = ev.filter(e => e.e === 'evolve');
    const now = ctx(W, S).sp;
    const lines = [`<span>Coins</span><b>+${fInt(coins + evos.reduce((a, e) => a + e.reward, 0))}</b>`];
    lines.push(`<span>${esc(sp0.name)}</span><b>Lv. ${lv0} → ${S.lvl}</b>`);
    for (const e of evos) lines.push(`<span>Entwickelt</span><b>${esc(W.P[e.from - 1].name)} → ${esc(W.P[e.to - 1].name)}</b>`);
    let note = '';
    if (S.ready) note = `<p>${esc(now.name)} ist bereit für den Kampf.</p>`;
    else if (S.stone) note = `<p>${esc(now.name)} wartet auf einen Entwicklungsstein.</p>`;
    openSheet(`<h2>Willkommen zurück!</h2>
      <p>Du warst ${fTime(sec)} weg${sec >= K.offlineCapH * 3600 ? ' (Pension trainiert maximal 12 Std.)' : ''}. In der Zeit hat die Pension weiter trainiert.</p>
      <div class="kv">${lines.join('')}</div>${note}
      <div class="row"><button class="btn gold" data-autofocus id="wb-ok">Weiter</button></div>`);
    $('#wb-ok').onclick = () => closeSheet();
  }

  // ---------- main loop ----------
  let last = performance.now(), uiT = 0, saveT = 0, cloudT = 0;
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (S) {
      if (dt > 3) { offlineCatchup(dt, dt >= 60); if (BT) BT.paused = false; dt = 0; }
      if (dt > 0) {
        if (!pendingStarter() && !S.done) {
          const c = ctx(W, S);
          const cps = coinsPerSec(W, S, c.p, c.sp.bst);
          S.coins += cps * dt; S.life += cps * dt;
          const ev = addXP(W, S, xpPerSec(S) * dt);
          if (ev.length) handleEvents(ev);
        }
        S.stats.time += dt;
        battleStep(dt);
      }
      uiT += dt; saveT += dt; cloudT += dt;
      if (uiT >= 0.1) { uiT = 0; refresh(); }
      if (saveT >= 5) { saveT = 0; saveLocal(); }
      if (cloudT >= 20) { cloudT = 0; cloudWrite(); }
    }
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    if (!S) return;
    if (document.hidden) { if (BT) BT.paused = true; saveLocal(); markDirty(); cloudWrite(); }
    else { if (BT) BT.paused = false; last = performance.now() - Math.max(0, Date.now() - S.savedAt); }
  });
  window.addEventListener('pagehide', () => { if (S) saveLocal(); });

  // ---------- boot ----------
  let bootSavedAt = 0;
  function start(data) {
    let s = null;
    if (data && typeof data.save === 'string') { try { s = sanitize(JSON.parse(data.save)); } catch (e) { s = null; } }
    const local = s || loadLocal();
    bootSavedAt = local ? local.savedAt || 0 : 0;
    S = local || freshState();
    const away = (Date.now() - (S.savedAt || Date.now())) / 1000;
    renderAll();
    if (away > 5) offlineCatchup(away, away >= 60 && !s);
    saveLocal();
    last = performance.now();
    requestAnimationFrame(frame);
    probeSprites();
    initCloud();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ save: JSON.stringify(S) })); } catch (e) { /* optional */ } }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();

</script>

</body>
