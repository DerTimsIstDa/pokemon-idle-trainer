/* Layout: one-screen phone app in normal document flow (no position: fixed, so taps always
   land where the buttons are drawn, even after the iOS keyboard was open).
   Header, scrolling middle, tab bar. Overlays are absolute inside the body.
   The active Pokémon's types tint the stages; coins are gold, EP are cyan, shinies sparkle gold. */
:root {
  color-scheme: dark;
  --ink: #0e1020;
  --panel: #171a31;
  --panel-2: #20254a;
  --line: #2e3563;
  --text: #edf0ff;
  --muted: #a0a8d0;
  --faint: #6a729e;
  --gold: #ffcb45;
  --gold-ink: #3a2600;
  --xp: #63d5ff;
  --fight: #ff5f5a;
  --good: #4fd685;
  --warn: #f4c443;
  --bad: #f0605e;
  --shiny: #ffe27a;
  --ta: #8a8fb8;
  --tb: #8a8fb8;
  --display: "Ziffern", "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --dia: #b49cff;
  --body: "M PLUS Rounded 1c", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 16px;
  --sat: 0px;
  --sab: 0px;
  --tap: 44px;
}
/* standalone build (GitHub Pages): the page itself handles the phone's safe areas */
.gh { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.evo .ev-stage img, .bspr img, .mon-vis img, .solo-vis img { max-width: none; }
html, body { height: 100%; overflow: hidden; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.stage, .field, .spr, .emb, .solo-stage { -webkit-touch-callout: none; }
body {
  margin: 0; position: relative; background: var(--ink); color: var(--text);
  font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 2px;
}
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

#app { position: relative; height: 100%; display: flex; flex-direction: column; }
.col { width: 100%; max-width: 520px; margin-inline: auto; }

/* header */
.top {
  flex: none; padding: calc(8px + var(--sat)) 16px 8px;
  background: linear-gradient(180deg, #121531, rgba(18, 21, 49, .92));
  border-bottom: 1px solid var(--line);
}
.top .col { display: flex; align-items: center; gap: 10px; }
.coins { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.coin-ico {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff3c4 0 18%, var(--gold) 19% 62%, #c98a12 63%);
  box-shadow: inset 0 0 0 2px #e7a92a;
}
.coins b { font-family: var(--display); font-size: 24px; color: var(--gold); font-weight: 600; line-height: 1; white-space: nowrap; }
.coins small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.prog {
  flex: none; display: grid; justify-items: end; align-content: center; gap: 2px; min-height: var(--tap); padding: 2px 6px; margin: 0;
  background: none; border: 0; border-radius: 10px; color: var(--text); cursor: pointer; text-align: right; line-height: 1.1;
}
.prog > * { pointer-events: none; }
.prog .dia { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.prog .dia b { font-family: var(--display); font-size: 18px; font-weight: 600; color: var(--dia); }
.prog .dia small { font-family: var(--display); font-size: 12.5px; color: var(--muted); }
.prog .rg { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.prog .dx { font-family: var(--display); font-size: 12px; letter-spacing: .02em; color: var(--text); margin-left: 3px; }
.gem { display: inline-block; flex: none; width: 13px; height: 13px; background: linear-gradient(135deg, #f3edff, var(--dia) 45%, #6c50d8); clip-path: polygon(22% 0, 78% 0, 100% 34%, 50% 100%, 0 34%); }
.gi { width: 1em; height: 1em; vertical-align: -.14em; color: var(--dia); display: inline-block; }
.dia-t { color: var(--dia); font-weight: 800; white-space: nowrap; }
.diabig { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.diabig .gem { width: 26px; height: 26px; align-self: center; }
.diabig b { font-family: var(--display); font-size: 34px; font-weight: 600; color: var(--dia); line-height: 1; }
.diabig small { color: var(--muted); font-size: 13.5px; }
.bar.dia > i { background: linear-gradient(180deg, #ebe3ff, var(--dia) 55%, #7a5cf0); }
.iconbtn {
  flex: none; position: relative; width: var(--tap); height: var(--tap); border: 0; border-radius: 12px;
  background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; cursor: pointer; padding: 0;
}
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }

.update { flex: none; background: color-mix(in oklab, var(--xp) 18%, var(--panel)); border-bottom: 1px solid var(--line); padding: 6px 16px; }
.update .col { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 700; }
.update .col span { flex: 1; min-width: 0; }

main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 14px 16px 24px; }
.view[hidden] { display: none !important; }

/* tab bar */
.tabs {
  flex: none; display: flex; background: #121531; border-top: 1px solid var(--line);
  padding: 0 4px var(--sab);
}
.tabs .col { display: flex; }
.tab {
  flex: 1; min-width: 0; min-height: 58px; background: none; border: 0; padding: 7px 2px 8px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; color: var(--faint); font-size: 11px; font-weight: 700; position: relative; cursor: pointer;
}
.tab svg { width: 24px; height: 24px; pointer-events: none; }
.tab span { pointer-events: none; }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
.tab .dot { position: absolute; top: 7px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px #121531; }

/* training */
.mon-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.mon-head .l { min-width: 0; }
.dexno { font-family: var(--display); color: var(--muted); font-size: 14px; }
.mon-name { font-family: var(--display); font-size: 30px; font-weight: 600; line-height: 1.05; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px 1px; border-radius: 6px; background: var(--c); color: var(--cf); }
.lvbadge { flex: none; text-align: right; }
.lvbadge small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.lvbadge b { font-family: var(--display); font-size: 34px; line-height: 1; font-weight: 600; display: inline-block; }
.lvbadge b.pop, .solo-lv b.pop { animation: pop .45s ease-out; }
@keyframes pop { 0% { transform: scale(1); color: var(--text); } 35% { transform: scale(1.35); color: var(--xp); } 100% { transform: scale(1); } }

.stage {
  position: relative; display: block; width: 100%; height: clamp(210px, 38vh, 330px); border: 0; padding: 0;
  border-radius: 22px; overflow: hidden; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  background:
    radial-gradient(110% 80% at 50% 105%, color-mix(in oklab, var(--ta) 42%, transparent), transparent 62%),
    radial-gradient(60% 50% at 85% 10%, color-mix(in oklab, var(--tb) 22%, transparent), transparent 70%),
    linear-gradient(180deg, #1b1f3d, #11142a);
  box-shadow: inset 0 0 0 1px var(--line);
}
.stage::before, .solo-stage::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.4px);
  background-size: 10px 10px;
}
.ground {
  position: absolute; left: 50%; bottom: 13%; width: 62%; height: 15%; transform: translateX(-50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in oklab, var(--ta) 55%, #05060f), color-mix(in oklab, var(--ta) 20%, transparent) 70%, transparent);
}
.mon-vis { position: absolute; left: 50%; bottom: 20%; transform: translateX(-50%); display: grid; place-items: end center; pointer-events: none; }
.mon-vis .bob, .solo-vis .bob { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; display: grid; place-items: end center; }
.mon-vis .bob.squash, .solo-vis .bob.squash { animation: squash .14s ease-out; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes squash { 0% { transform: scale(1, 1); } 45% { transform: scale(1.1, .9); } 100% { transform: scale(1, 1); } }
.stage .hint {
  position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 12px; color: var(--muted);
  letter-spacing: .08em; text-transform: uppercase; pointer-events: none;
}
.ring { position: absolute; left: 50%; bottom: 26%; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; border: 3px solid var(--xp); pointer-events: none; animation: ring .7s ease-out forwards; }
@keyframes ring { from { transform: scale(.5); opacity: 1; } to { transform: scale(5); opacity: 0; } }

.floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fl { position: absolute; font-family: var(--display); font-weight: 700; font-size: 17px; white-space: nowrap; text-shadow: 0 2px 0 rgba(0, 0, 0, .55); animation: rise .9s ease-out forwards; pointer-events: none; }
.fl.xp { color: var(--xp); }
.fl.co { color: var(--gold); font-size: 15px; }
.fl.dmg { color: #fff; font-size: 20px; }
.fl.crit { color: var(--warn); font-size: 24px; }
.fl.heal { color: var(--good); }
@keyframes rise { 0% { transform: translate(-50%, 0) scale(.8); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1.08); } 100% { transform: translate(-50%, -64px) scale(1); opacity: 0; } }
.px { position: absolute; width: 6px; height: 6px; background: var(--ta); pointer-events: none; animation: burst .55s ease-out forwards; }
@keyframes burst { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

.xpbox { margin-top: 12px; }
.bar { position: relative; height: 16px; border-radius: 6px; background: #0b0d1c; box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
.bar > i { position: absolute; left: 2px; top: 2px; bottom: 2px; border-radius: 4px; background: linear-gradient(180deg, #a6ecff, var(--xp) 55%, #2fa7d6); width: 0; transition: width .12s linear; }
.bar::after { content: ""; position: absolute; inset: 2px; pointer-events: none; background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(5, 8, 20, .35) 9px 10px); }
.bar.cap > i, .bar.gold > i { background: linear-gradient(180deg, #ffe7a3, var(--gold) 55%, #d09a1c); }
.xprow { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.xprow b { color: var(--text); font-family: var(--display); font-weight: 500; }

.goal { margin-top: 12px; display: flex; gap: 10px; align-items: center; font-size: 13.5px; color: var(--muted); }
.goal strong { color: var(--text); }

.action { margin-top: 14px; display: grid; gap: 8px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 48px;
  border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 800; font-size: 16px; cursor: pointer; text-align: center;
  background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); touch-action: manipulation;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn .sub { font-weight: 500; font-size: 12.5px; opacity: .85; }
.btn.fight { background: var(--fight); color: #fff; box-shadow: 0 6px 22px -6px rgba(255, 95, 90, .7); flex-direction: column; gap: 2px; animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 6px 30px -2px rgba(255, 95, 90, .95); } }
.btn.gold { background: var(--gold); color: var(--gold-ink); box-shadow: none; }
.btn.ghost { background: transparent; }
.btn.small { min-height: var(--tap); padding: 9px 14px; font-size: 14px; border-radius: 12px; width: auto; }

.path { list-style: none; margin: 18px 0 0; padding: 0; display: flex; align-items: stretch; gap: 6px; overflow-x: auto; }
.path li { flex: 1 1 0; min-width: 84px; background: var(--panel); border-radius: 14px; padding: 8px 6px 7px; text-align: center; box-shadow: inset 0 0 0 1px var(--line); position: relative; }
.path li.now { box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--ta) 80%, white); background: color-mix(in oklab, var(--ta) 14%, var(--panel)); }
.path li.done { opacity: .78; }
.path .pv { height: 56px; display: grid; place-items: center; }
.path .pn { font-size: 12px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.path .pl { font-size: 11px; color: var(--muted); }
.path .ck { position: absolute; top: 6px; right: 7px; color: var(--good); font-weight: 800; font-size: 13px; }
.path li.fightstep { flex: 0 0 auto; min-width: 70px; background: color-mix(in oklab, var(--fight) 14%, var(--panel)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--fight) 45%, var(--line)); }

.rates { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rate { background: var(--panel); border-radius: 14px; padding: 10px 12px; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.rate small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rate b { font-family: var(--display); font-weight: 500; font-size: 18px; }
.rate b.xpc { color: var(--xp); }
.rate b.gc { color: var(--gold); }

.tip { margin-top: 14px; background: color-mix(in oklab, var(--xp) 10%, var(--panel)); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--xp) 35%, var(--line)); }
.tip b { color: var(--xp); }
.tip button { margin-top: 8px; }

/* shared section styles */
.h2 { font-family: var(--display); font-size: 22px; font-weight: 600; margin: 4px 0 2px; }
.lead { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.seg { display: flex; background: var(--panel); border-radius: 12px; padding: 4px; gap: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { flex: 1; min-height: var(--tap); border: 0; background: none; border-radius: 9px; padding: 6px 4px; font-weight: 800; font-size: 13px; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.seg button:disabled { opacity: .45; cursor: default; }
.seg svg { width: 14px; height: 14px; }
.seg.seg-r { flex-wrap: wrap; }
.seg.seg-r button { flex: 1 1 30%; }
.sect { margin: 18px 0 8px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }

/* shop */
.ups { display: grid; gap: 8px; }
.up { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: var(--panel); border-radius: 16px; padding: 12px; box-shadow: inset 0 0 0 1px var(--line); }
.up-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in oklab, var(--c) 22%, var(--panel-2)); color: var(--c); }
.up-ico svg { width: 26px; height: 26px; }
.up-main { min-width: 0; }
.up-name { font-weight: 800; font-size: 15px; }
.up-lv { font-family: var(--display); font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 4px; }
.up-desc { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.up-bag { font-family: var(--display); font-size: 12.5px; color: var(--xp); }
.up-bag:empty { display: none; }
.up-eff { font-family: var(--display); font-size: 13.5px; margin-top: 2px; }
.up-eff .nx { color: var(--good); }
.buy { border: 0; border-radius: 12px; padding: 8px 10px; min-width: 88px; min-height: 48px; background: var(--gold); color: var(--gold-ink); font-weight: 800; cursor: pointer; display: grid; gap: 0; align-content: center; text-align: center; touch-action: manipulation; }
.buy small { font-size: 10.5px; font-weight: 700; opacity: .8; }
.buy b { font-family: var(--display); font-size: 15px; font-weight: 600; white-space: nowrap; }
.buy:disabled { background: var(--panel-2); color: var(--faint); box-shadow: inset 0 0 0 1px var(--line); cursor: default; }
.buy.max { background: var(--panel-2); color: var(--good); box-shadow: inset 0 0 0 1px var(--line); }
.buy.dia { background: var(--dia); color: #1e1342; }
.buy.dia .gi { color: #1e1342; }
.buy.dia.poor { opacity: .5; }
.sect .dia-t b { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: 0; }

/* pokédex */
.dexstat { display: flex; gap: 14px; margin: 12px 0 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.dexstat b { color: var(--text); font-family: var(--display); font-weight: 500; font-size: 15px; }
.dexstat b.sh { color: var(--shiny); }
.dexbar { height: 8px; border-radius: 5px; background: #0b0d1c; overflow: hidden; display: flex; box-shadow: inset 0 0 0 1px var(--line); }
.dexbar i { display: block; height: 100%; }
.dexbar .r { background: var(--good); }
.dexbar .s { background: color-mix(in oklab, var(--good) 35%, var(--line)); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; margin-top: 14px; }
.cell { position: relative; background: var(--panel); border: 0; border-radius: 12px; padding: 6px 4px 6px; text-align: center; box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; min-width: 0; color: var(--text); }
.cell .cv { height: 58px; display: grid; place-items: center; pointer-events: none; }
.cell .cn { font-family: var(--display); font-size: 11px; color: var(--faint); }
.cell .cm { font-size: 11px; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .cl { font-family: var(--display); font-size: 11px; color: var(--xp); }
.cell.reg { background: color-mix(in oklab, var(--c, var(--ta)) 12%, var(--panel)); }
.cell.reg .cn { color: var(--good); }
.cell.unk .cm { color: var(--faint); }
.cell.now { box-shadow: inset 0 0 0 2px var(--gold); }
.cell.shiny { box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--shiny) 55%, var(--line)); }
.cell.now.shiny { box-shadow: inset 0 0 0 2px var(--gold); }
.sparkle { position: absolute; top: 4px; right: 6px; color: var(--shiny); font-size: 14px; line-height: 1; text-shadow: 0 0 6px rgba(255, 226, 122, .6); pointer-events: none; }

/* sprites and emblems */
.spr { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.sil { filter: brightness(0) saturate(0); opacity: .55; }
.seen-img { filter: saturate(.25) brightness(.8); opacity: .8; }
.emb {
  --s: 64px; width: var(--s); height: var(--s); border-radius: 50%; position: relative; display: grid; place-items: center; flex: none;
  background:
    radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .55) 0 7%, transparent 8%),
    radial-gradient(circle, color-mix(in oklab, var(--a) 70%, #0b0d1c) 0 52%, transparent 53%),
    conic-gradient(from 200deg, var(--a) 0 50%, var(--b) 50% 100%);
  box-shadow: inset 0 0 0 calc(var(--s) * .045) rgba(0, 0, 0, .35), 0 calc(var(--s) * .06) 0 rgba(0, 0, 0, .3);
}
.emb::after { content: ""; position: absolute; inset: 14%; border-radius: 50%; box-shadow: inset 0 0 0 calc(var(--s) * .03) rgba(255, 255, 255, .25); }
.emb span { font-family: var(--display); font-weight: 700; font-size: calc(var(--s) * .3); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .45); position: relative; z-index: 1; line-height: 1; }
.emb.leg { box-shadow: inset 0 0 0 calc(var(--s) * .045) rgba(0, 0, 0, .35), 0 0 0 calc(var(--s) * .05) var(--gold), 0 calc(var(--s) * .08) 0 rgba(0, 0, 0, .3); }
.emb.shiny { box-shadow: inset 0 0 0 calc(var(--s) * .045) rgba(0, 0, 0, .35), 0 0 0 calc(var(--s) * .05) var(--shiny), 0 0 calc(var(--s) * .25) rgba(255, 226, 122, .45); }
.emb.sil { --a: #2b3157; --b: #232849; filter: none; opacity: 1; }
.emb.sil span { color: #59608c; text-shadow: none; }
.emb.dim { filter: saturate(.3) brightness(.85); }

/* overlays: absolute inside the body, never position: fixed */
.veil { position: absolute; inset: 0; background: rgba(5, 6, 16, .72); display: grid; align-items: end; justify-items: center; z-index: 50; padding: calc(16px + var(--sat)) 12px calc(12px + var(--sab)); animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--panel); border-radius: 22px; padding: 20px 18px 18px; box-shadow: inset 0 0 0 1px var(--line), 0 -10px 40px rgba(0, 0, 0, .5); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } }
.sheet h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0 0 6px; text-wrap: balance; }
.sheet h3 { margin: 16px 0 6px; font-size: 15px; }
.sheet p { margin: 0 0 12px; color: var(--muted); }
.sheet .row { display: flex; gap: 8px; margin-top: 14px; }
.sheet .row .btn { flex: 1; }
.sheet .subline { margin: -2px 0 12px; color: var(--muted); font-size: 13.5px; }
.starters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
.starter { border: 0; background: var(--panel-2); border-radius: 16px; padding: 10px 6px 12px; cursor: pointer; display: grid; justify-items: center; gap: 6px; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.starter .sv { height: 76px; display: grid; place-items: center; pointer-events: none; }
.starter b { font-size: 14px; overflow-wrap: anywhere; }
.statgrid { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; align-items: center; font-size: 13px; margin: 10px 0; }
.statgrid .sb { height: 8px; border-radius: 4px; background: #0b0d1c; overflow: hidden; }
.statgrid .sb i { display: block; height: 100%; background: var(--c, var(--xp)); border-radius: 4px; }
.statgrid .sv2 { font-family: var(--display); text-align: right; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; margin: 8px 0 4px; }
.kv span { color: var(--muted); }
.kv b { font-family: var(--display); font-weight: 500; text-align: right; }
.flavor { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; color: var(--text); margin-top: 10px; }
.dexhead { display: flex; gap: 14px; align-items: center; }
.dexhead .big { width: 120px; height: 120px; display: grid; place-items: center; flex: none; background: radial-gradient(closest-side, color-mix(in oklab, var(--a, #555) 30%, transparent), transparent); border-radius: 50%; position: relative; }
.dexhead .twins { display: flex; gap: 6px; }
.dexhead .twins .big { width: 92px; height: 92px; }
.evo-sum { display: grid; gap: 4px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 14px; }
.evo-sum li b { font-family: var(--display); font-weight: 500; }
.badge-line { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: var(--shiny); }

/* toasts */
#toasts { position: absolute; left: 0; right: 0; top: calc(64px + var(--sat)); display: grid; justify-items: center; gap: 6px; pointer-events: none; z-index: 60; padding: 0 16px; }
.toast { background: #262c57; color: var(--text); border-radius: 12px; padding: 8px 14px; font-size: 13.5px; font-weight: 700; box-shadow: 0 8px 24px rgba(0, 0, 0, .4), inset 0 0 0 1px var(--line); animation: toast 2.8s ease-in-out forwards; max-width: 480px; text-align: center; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }

/* evolution and shiny overlay */
.evo { position: absolute; inset: 0; z-index: 70; background: #05060f; display: grid; place-items: center; text-align: center; padding: 24px; animation: fade .25s; }
.evo .ev-stage { width: 220px; height: 220px; display: grid; place-items: center; position: relative; }
.evo .ev-stage > * { position: absolute; }
.evo .ev-from, .evo .ev-to { left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; }
.evo .ev-from { animation: evoA 2.6s steps(1) forwards; }
.evo .ev-to { opacity: 0; animation: evoB 2.6s steps(1) forwards; }
.evo .ev-flash { inset: -40px; border-radius: 50%; background: radial-gradient(closest-side, #fff, transparent); opacity: 0; animation: flash 2.6s ease-out forwards; }
.evo.go .ev-from, .evo.go .ev-to { filter: brightness(0) invert(1); }
.evo.done .ev-from { opacity: 0; animation: none; }
.evo.done .ev-to { opacity: 1; animation: none; filter: none; }
@keyframes evoA { 0% { opacity: 1; } 20% { opacity: 0; } 30% { opacity: 1; } 45% { opacity: 0; } 52% { opacity: 1; } 62% { opacity: 0; } 67% { opacity: 1; } 74% { opacity: 0; } 78% { opacity: 1; } 84%, 100% { opacity: 0; } }
@keyframes evoB { 0% { opacity: 0; } 20% { opacity: 1; } 30% { opacity: 0; } 45% { opacity: 1; } 52% { opacity: 0; } 62% { opacity: 1; } 67% { opacity: 0; } 74% { opacity: 1; } 78% { opacity: 0; } 84%, 100% { opacity: 1; } }
@keyframes flash { 0%, 80% { opacity: 0; } 88% { opacity: 1; } 100% { opacity: 0; } }
.evo h2 { font-family: var(--display); font-size: 24px; font-weight: 600; margin: 18px 0 6px; text-wrap: balance; }
.evo p { color: var(--muted); margin: 0 0 16px; }
.shinyrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 6px 0 10px; }
.shinyrow > div { width: 86px; height: 86px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 226, 122, .25), transparent); }

/* battle */
.battle { position: absolute; inset: 0; z-index: 40; background: var(--ink); display: flex; flex-direction: column; padding: calc(10px + var(--sat)) 16px calc(12px + var(--sab)); }
.battle .col { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.field {
  position: relative; flex: 1; min-height: 280px; border-radius: 22px; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer;
  background:
    radial-gradient(70% 45% at 76% 40%, color-mix(in oklab, var(--eb, #888) 30%, transparent), transparent 70%),
    radial-gradient(70% 45% at 26% 86%, color-mix(in oklab, var(--ta) 30%, transparent), transparent 70%),
    linear-gradient(180deg, #1c2042, #10132a);
  box-shadow: inset 0 0 0 1px var(--line);
}
.field.shake { animation: shake .25s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.hpcard { position: absolute; background: rgba(13, 15, 34, .86); border-radius: 14px; padding: 8px 10px 9px; width: min(62%, 260px); box-shadow: inset 0 0 0 1px var(--line); pointer-events: none; }
.hpcard.e { top: 12px; left: 12px; }
.hpcard.p { bottom: 12px; right: 12px; }
.hpcard .nm { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 14px; }
.hpcard .nm span:last-child { font-family: var(--display); font-weight: 500; color: var(--muted); white-space: nowrap; }
.hp { height: 10px; border-radius: 5px; background: #0b0d1c; overflow: hidden; margin-top: 5px; box-shadow: inset 0 0 0 1px var(--line); }
.hp i { display: block; height: 100%; width: 100%; background: var(--good); transition: width .18s linear, background-color .3s; }
.hpnum { font-family: var(--display); font-size: 12px; color: var(--muted); margin-top: 3px; text-align: right; }
.teamdots { display: flex; gap: 4px; margin-top: 5px; }
.teamdots i { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); }
.teamdots i.ko { background: #3b4170; }
.charge { height: 5px; border-radius: 3px; background: #0b0d1c; margin-top: 6px; overflow: hidden; }
.charge i { display: block; height: 100%; background: var(--warn); width: 0; transition: width .1s; }
.charge.full i { background: var(--fight); }
.charge.boss { height: 7px; }
.charge.boss i { background: linear-gradient(90deg, var(--warn), var(--fight)); }
.bstate { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; min-height: 0; }
.st { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 6px; letter-spacing: .02em; white-space: nowrap; }
.st.warn { background: color-mix(in oklab, var(--fight) 30%, #141833); color: #ffd0cd; }
.st.good { background: color-mix(in oklab, var(--good) 28%, #141833); color: #c9f7da; }
.st.cold { background: color-mix(in oklab, var(--xp) 26%, #141833); color: #cdefff; }
.st.bad { background: color-mix(in oklab, var(--bad) 40%, #141833); color: #fff; }
.st.gold { background: color-mix(in oklab, var(--gold) 30%, #141833); color: #ffeab0; }
.teamdots i.on { background: var(--gold); }
.bspr { position: absolute; display: grid; place-items: end center; pointer-events: none; }
.bspr.e { right: 8%; top: 22%; }
.field.boss .bspr.e { right: 6%; top: 30%; }
.field.boss .hpcard.e { width: min(70%, 300px); }
.bspr.p { left: 6%; bottom: 20%; }
.bspr .plat { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 150%; height: 26px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .45), transparent); z-index: -1; }
.bspr .hit { animation: hitflash .22s steps(2); }
@keyframes hitflash { 50% { opacity: .2; } }
.bspr .lunge { animation: lunge .22s ease-out; }
@keyframes lunge { 40% { transform: translate(10px, -6px); } }
.blog { min-height: 46px; margin: 10px 0; background: var(--panel); border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 700; box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; }
.bact { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.bact .btn { padding: 10px 8px; font-size: 14px; white-space: nowrap; gap: 6px; }
.bact .btn b { font-family: var(--display); font-weight: 500; }
.timer { position: absolute; top: 14px; right: 14px; font-family: var(--display); color: var(--muted); font-size: 14px; pointer-events: none; }
.field.boss .timer { font-size: 17px; color: var(--text); }
.timer.late { color: var(--bad); }
.tapnote { position: absolute; left: 0; right: 0; bottom: 30%; text-align: center; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .45); pointer-events: none; transition: opacity .4s; }

.matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 10px 0 6px; }
.matchup .side { text-align: center; min-width: 0; }
.matchup .side .mv { height: 92px; display: grid; place-items: center; }
.matchup .side b { display: block; font-size: 14px; overflow-wrap: anywhere; }
.matchup .side small { color: var(--muted); font-family: var(--display); }
.matchup .vs { font-family: var(--display); font-size: 22px; color: var(--fight); }
/* difficulty: the colour always means "without items" (green easy, yellow medium, red hard) */
.verdict { --vc: var(--line); border-radius: 12px; padding: 10px 12px 10px 13px; font-weight: 700; font-size: 14px; margin: 10px 0 4px; border-left: 6px solid var(--vc); background: color-mix(in oklab, var(--vc) 20%, var(--panel-2)); color: var(--text); }
.verdict.ok { --vc: var(--good); color: #c9f7da; }
.verdict.mid { --vc: var(--warn); color: #ffeab4; }
.verdict.hard { --vc: var(--bad); color: #ffd0ce; }
.verdict .vl { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 6px; background: var(--vc); color: #10131f; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; vertical-align: 1px; }
.verdict .vi { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, .12); color: var(--text); font-size: 13px; font-weight: 600; }
.vdot { flex: none; width: 11px; height: 11px; margin-top: 4px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0, 0, 0, .25); }
.vdot.ok { background: var(--good); }
.vdot.mid { background: var(--warn); }
.vdot.hard { background: var(--bad); }
.verdict .vt { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
.diff { display: inline-block; padding: 2px 8px; border-radius: 6px; color: #10131f; font-size: 11px; font-weight: 800; letter-spacing: .03em; white-space: nowrap; }
.diff.ok { background: var(--good); }
.diff.mid { background: var(--warn); }
.diff.hard { background: var(--bad); }
.gym .gs .diff { margin-top: 3px; }
.itemrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 12px; padding: 6px 6px 6px 12px; margin-top: 8px; font-size: 13.5px; }
.itemrow b { font-family: var(--display); font-weight: 500; }
.teamrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.teamrow .tm { flex: 1 1 74px; min-width: 70px; background: var(--panel-2); border-radius: 12px; padding: 6px 4px; text-align: center; box-shadow: inset 0 0 0 1px var(--line); }
.teamrow .tm .tv { height: 58px; display: grid; place-items: center; }
.teamrow .tm b { display: block; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.teamrow .tm small { font-family: var(--display); color: var(--muted); font-size: 12px; }
.teamrow .tm .eff { font-size: 10.5px; font-weight: 800; }
.teamrow .tm .eff.adv { color: var(--good); }
.teamrow .tm .eff.dis { color: var(--bad); }

/* arena */
.solo { background: var(--panel); border-radius: 18px; padding: 12px; box-shadow: inset 0 0 0 1px var(--line); }
.solo-top { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: stretch; }
.solo-stage {
  position: relative; width: 132px; height: 132px; border: 0; padding: 0; border-radius: 16px; overflow: hidden; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  background: radial-gradient(90% 70% at 50% 100%, color-mix(in oklab, var(--sa, #8a8fb8) 45%, transparent), transparent 70%), linear-gradient(180deg, #1b1f3d, #11142a);
  box-shadow: inset 0 0 0 1px var(--line);
}
.solo-stage.shiny { box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--shiny) 70%, var(--line)), 0 0 18px rgba(255, 226, 122, .18); }
.solo-vis { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: grid; place-items: end center; pointer-events: none; }
.solo-stage .hint { position: absolute; left: 0; right: 0; top: 6px; text-align: center; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
.solo-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.solo-info h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.1; overflow-wrap: anywhere; }
.solo-lv { margin-top: auto; font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.solo-lv b { font-family: var(--display); font-size: 28px; color: var(--text); letter-spacing: 0; display: inline-block; margin-left: 4px; }
.solo .bar { margin-top: 12px; }
.boosts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.boost { position: relative; overflow: hidden; min-height: var(--tap); border: 0; border-radius: 12px; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left; font-size: 13px; color: var(--text); background: color-mix(in oklab, var(--c) 16%, var(--panel-2)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 45%, var(--line)); }
button.boost { cursor: pointer; }
button.boost > * { pointer-events: none; }
.boost b { font-weight: 800; }
.boost span { font-family: var(--display); color: var(--c); font-size: 14px; white-space: nowrap; }
.boost.on i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--c); width: 0; transition: width .1s linear; }
.solo .goal { margin-top: 8px; }
.empty { text-align: center; padding: 18px 12px; color: var(--muted); }
.empty h3 { color: var(--text); margin: 6px 0; font-size: 16px; }
.gyms { display: grid; gap: 8px; margin-top: 10px; }
.gym {
  display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; width: 100%; min-height: 64px;
  text-align: left; background: var(--panel); border: 0; border-radius: 16px; padding: 9px 12px; box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; color: var(--text);
}
.gym:disabled { cursor: default; }
.gym.locked { opacity: .55; }
.gym.won { box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--good) 40%, var(--line)); }
.gym > * { pointer-events: none; }
.gym .gm b { display: block; font-size: 15px; }
.gym .gm small { display: block; font-size: 12px; color: var(--muted); }
.gym .gs { text-align: right; }
.gym .gs b { display: block; font-family: var(--display); font-weight: 500; font-size: 15px; }
.gym .gs small { display: block; font-size: 11.5px; color: var(--muted); }
.gym .gs small.go { color: var(--gold); font-weight: 800; }
.gym.boss { grid-template-columns: 56px 1fr auto; min-height: 72px; }
.bossimg { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px; background: radial-gradient(closest-side, rgba(180, 156, 255, .22), transparent); }
.bossimg svg { width: 22px; height: 22px; color: #8c93c2; }
.bosshead { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; margin: 4px 0 2px; }
.bosshead .big { width: 112px; height: 112px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in oklab, var(--a, #777) 34%, transparent), transparent); }
.bosshead .kv { margin: 0; font-size: 13.5px; }
.sheet h3 small.muted { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 4px; }
.teamslots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.slot { position: relative; min-height: 96px; border: 0; border-radius: 12px; padding: 6px 4px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--text); display: grid; justify-items: center; align-content: start; gap: 1px; cursor: pointer; min-width: 0; }
.slot > * { pointer-events: none; }
.slot .sv { height: 50px; display: grid; place-items: center; }
.slot b { font-size: 11.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot small { font-family: var(--display); font-size: 12px; color: var(--xp); }
.slot .eff { font-size: 10.5px; font-weight: 800; }
.slot .eff.adv { color: var(--good); }
.slot .eff.dis { color: var(--bad); }

// ---------- data helpers ----------
function makeWorld(DATA) {
  const P = DATA.P.map((p, i) => ({
    id: i + 1, name: p[0], genus: p[1], types: p[2].map(t => t - 1), stats: p[3],
    bst: p[3].reduce((a, b) => a + b, 0), leg: p[4], from: DATA.F ? DATA.F[i] : 0,
  }));
  const lines = DATA.L.map((l, i) => ({
    i, region: l[0], m: l[1], lv: l[2], meth: l[3], bl: l[4], opp: l[5], oppLv: l[6], leg: !!l[7],
  }));
  const byRegion = DATA.R.map((_, r) => lines.filter(l => l.region === r));
  const kids = {};
  for (const sp of P) if (sp.from) (kids[sp.from] = kids[sp.from] || []).push(sp.id);
  return { P, lines, byRegion, kids, T: DATA.T, TI: DATA.TI, C: DATA.C, R: DATA.R };
}

// ordered global list of line indices, given starter choices per region (index 0..2 or null)
function lineOrder(W, starters) {
  const order = [];
  W.byRegion.forEach((rl, r) => {
    const s = starters[r];
    const ids = rl.map(l => l.i);
    if (s != null) {
      const first = ids.slice(0, 3);
      const pick = first[s];
      order.push(pick, ...first.filter(x => x !== pick), ...ids.slice(3));
    } else order.push(...ids);
  });
  return order;
}

function spOf(W, id) { return W.P[id - 1]; }

// The species itself, all its pre-evolutions and all its further evolutions.
function evolutionPath(W, id) {
  const out = new Set([id]);
  let p = W.P[id - 1].from;
  while (p) { out.add(p); p = W.P[p - 1].from; }
  const stack = [id];
  while (stack.length) {
    const x = stack.pop();
    for (const k of W.kids[x] || []) if (!out.has(k)) { out.add(k); stack.push(k); }
  }
  return [...out].sort((a, b) => a - b);
}

// ---------- trainer ----------
function trainerSel(S) { return S.trainer && S.trainer.sel ? TRAINER_BY_ID[S.trainer.sel] || null : null; }
function trainerLevel(S, id) {
  id = id || (S.trainer && S.trainer.sel);
  if (!id) return 0;
  return Math.max(1, (S.trainer.lv && S.trainer.lv[id]) || 1);
}
function trainerNeed(L) { const n = BALANCE.trainer.need; return n.base + n.mult * Math.pow(L, n.exp); }
// Multiplier for a bonus kind (1 = no bonus). 'discount' returns the price reduction (0 = none).
function tBonus(S, kind) {
  const t = trainerSel(S);
  const TB = BALANCE.trainer;
  if (!t) return kind === 'discount' ? 0 : 1;
  const steps = trainerLevel(S) - 1;
  if (kind === 'discount') return t.spec === 'discount' ? Math.min(TB.maxDiscount, TB.discountPerLevel * steps) : 0;
  let m = 1;
  if (TB.bonusPerLevel[kind]) m += TB.bonusPerLevel[kind] * steps;
  if (t.spec === kind) m += TB.specialPerLevel * steps;
  return m;
}
function trainerGain(S, amt, events) {
  const id = S.trainer && S.trainer.sel;
  if (!id || !(amt > 0)) return;
  const TB = BALANCE.trainer;
  let L = trainerLevel(S, id);
  if (L >= TB.maxLevel) return;
  let xp = (S.trainer.xp[id] || 0) + amt, up = false;
  while (L < TB.maxLevel) {
    const need = trainerNeed(L);
    if (xp < need) break;
    xp -= need; L++; up = true;
  }
  if (L >= TB.maxLevel) xp = 0;
  S.trainer.lv[id] = L; S.trainer.xp[id] = xp;
  if (up && events) events.push({ e: 'trainerLevel', id, lvl: L });
}

// ---------- main training formulas ----------
// Balance tables (log10 values per line position p), produced by the calibration simulation.
const TAB = { X: null, A: null, H: null };
function tabAt(arr, p) { if (!arr) return 0; return arr[Math.max(0, Math.min(arr.length - 1, p))]; }
function levelWork(L, bst, leg) { return Math.pow(L, K.xpExp) * Math.pow(bst / 300, K.bstExp) * (leg ? K.legXp : 1); }
function lineWork(W, line) {
  if (line._w) return line._w;
  let w = 0;
  const last = line.m.length - 1;
  for (let s = 0; s <= last; s++) {
    const sp = W.P[line.m[s] - 1];
    const from = line.lv[s];
    const to = s < last ? line.lv[s + 1] : (last === 0 ? line.bl : line.lv[s]);
    for (let L = from; L < to; L++) w += levelWork(L, sp.bst, sp.leg);
  }
  line._w = Math.max(w, 1);
  return line._w;
}
function lineTarget(W, line) { return K.T0 * Math.pow(lineWork(W, line) / K.Wref, K.Wexp); }
// XP needed for level L -> L+1 of species sp on line at position p
function xpNeed(W, line, p, L, sp) {
  const scale = Math.pow(10, tabAt(TAB.X, p)) * lineTarget(W, line) / lineWork(W, line);
  return scale * levelWork(L, sp.bst, sp.leg);
}

function dexCount(S) { return S.regCount || 0; }
function dexMult(S) { return 1 + K.dexBonus * dexCount(S) * tBonus(S, 'dex'); }
function regionMult(S) { return Math.pow(K.regionBonus, S.regionsDone || 0); }

function xpPerSec(S) {
  return upVal('pension', S.up.pension) * upVal('egg', S.up.egg) * dexMult(S) * regionMult(S) * tBonus(S, 'ep');
}
function xpPerTap(S) { return upVal('macho', S.up.macho) * xpPerSec(S) * tBonus(S, 'tapEp'); }

function teamValue(p, bst) { return K.coinTeam * Math.pow(K.G, p) * (bst / 400); }
// Income of all leveled Pokémon, computed from the Pokédex (positions stored in S.reg).
const _team = typeof WeakMap === 'function' ? new WeakMap() : null;
function teamIncome(W, S) {
  const hit = _team && _team.get(S);
  if (hit && hit.n === S.regCount) return hit.v;
  let v = 0;
  for (const id in S.reg) v += teamValue((+S.reg[id] || 1) - 1, W.P[id - 1].bst);
  if (_team) _team.set(S, { n: S.regCount, v });
  return v;
}
function activeIncome(W, S, p, bstActive) { return K.coinActive * Math.pow(K.G, p) * (bstActive / 300); }
function coinsPerSec(W, S, p, bstActive) {
  return (activeIncome(W, S, p, bstActive) + teamIncome(W, S)) * upVal('amulett', S.up.amulett) * dexMult(S) * regionMult(S) * tBonus(S, 'coins');
}
function coinsPerTap(cps, S) { return (K.tapCoinFlat + upVal('zahltag', S.up.zahltag) * cps) * tBonus(S, 'tapCoins'); }

function effRaw(W, att, def) {
  let best = 0;
  for (const t of att) { let m = 1; for (const d of def) m *= W.C[t][d]; best = Math.max(best, m); }
  return best;
}
function effSoft(raw) { return Math.sqrt(Math.max(raw, 2 / 3)); }

// main battle numbers for line, given player level and upgrades
function battleSetup(W, S, line, p, L) {
  const F = spOf(W, line.m[line.m.length - 1]);
  const O = spOf(W, line.opp);
  const local = Math.pow(F.bst / 500, 0.8) * (line.leg ? 1.5 : 1);
  const localE = Math.pow(F.bst / 500, 0.4) * (line.leg ? 1.2 : 1);
  const pe = effRaw(W, F.types, O.types), ee = effRaw(W, O.types, F.types);
  const hb = K.hitBase, hpb = K.hpBase;
  const parA = Math.pow(10, tabAt(TAB.A, p)), parH = Math.pow(10, tabAt(TAB.H, p));
  const lr = L / line.bl;
  const hit = hb * upVal('protein', S.up.protein) * Math.pow(lr, 1.2) * effSoft(pe) * tBonus(S, 'dmg');
  const maxHp = hpb * upVal('kp', S.up.kp) * Math.pow(lr, 0.8) * tBonus(S, 'hp');
  const eHp = hb * parA * K.ttkHits * local;
  const eHit = hpb * parH / (K.ttdSec / K.enemyInterval) * localE * effSoft(ee);
  return { F, O, pe, ee, hit, tap: hit * K.tapRatio, special: hit * K.specialMult, maxHp, eHp, eHit, oppLv: line.oppLv };
}

// deterministic estimate: can the player win with tapRate taps/s and potions?
function battleEstimate(B, tapRate, potions, xMult = 1) {
  const dps = (B.hit + tapRate * (B.tap + B.special / K.specialEvery)) * xMult;
  const ttk = B.eHp / dps;
  const ttd = B.maxHp * (1 + BALANCE.items.potion.heal * potions) / (B.eHit / K.enemyInterval);
  return { ttk, ttd, win: ttk < ttd, margin: ttd / ttk };
}

    s.starters = W.R.map((_, i) => (Array.isArray(o.starters) && o.starters[i] != null ? clamp(+o.starters[i] || 0, 0, 2) : null));
    for (const u of UPG) s.up[u.id] = clamp(Math.floor(+s.up[u.id] || 0), 0, u.max || 100000);
    for (const k of ['potion', 'xatk']) s.inv[k] = clamp(Math.floor(+s.inv[k] || 0), 0, BALANCE.items[k].max);
    for (const k of ['tapBoost', 'autoTap']) s.inv[k] = clamp(Math.floor(+s.inv[k] || 0), 0, 999);
    for (const k of Object.keys(s.inv)) if (!['potion', 'xatk', 'tapBoost', 'autoTap'].includes(k)) delete s.inv[k];
    s.regCount = Object.keys(s.reg).length;
    s.li = clamp(Math.floor(s.li), 0, W.lines.length - 1);
    const line = W.lines[lineOrder(W, s.starters)[s.li]];
    s.stage = clamp(Math.floor(+s.stage || 0), 0, line.m.length - 1);
    s.lvl = clamp(Math.floor(+s.lvl || K.startLevel), 1, 100);
    for (const k of ['coins', 'life', 'xp', 'rev', 'savedAt', 'cool', 'gymCool', 'created']) s[k] = isFinite(+s[k]) ? Math.max(0, +s[k]) : 0;
    // separate leveling: keep every trained Pokémon, only registered ones can be selected
    const so = isObj(o.solo) ? o.solo : {};
    s.solo = { sel: null, lv: numMap(so.lv, 1, BALANCE.solo.maxLevel, true), xp: numMap(so.xp, 0, 1e300, false) };
    const sel = +so.sel;
    if (sel && s.reg[sel]) { s.solo.sel = sel; if (!s.solo.lv[sel]) s.solo.lv[sel] = BALANCE.solo.startLevel; }
    // trainers: each one keeps its own level
    const tr = isObj(o.trainer) ? o.trainer : {};
    const tlv = numMap(tr.lv, 1, BALANCE.trainer.maxLevel, true), txp = numMap(tr.xp, 0, 1e300, false);
    s.trainer = { sel: TRAINER_BY_ID[tr.sel] ? tr.sel : null, lv: {}, xp: {} };
    for (const t of TRAINERS) { if (tlv[t.id]) s.trainer.lv[t.id] = tlv[t.id]; if (txp[t.id]) s.trainer.xp[t.id] = txp[t.id]; }
    if (s.trainer.sel && !s.trainer.lv[s.trainer.sel]) s.trainer.lv[s.trainer.sel] = 1;
    // gyms: wins per leader
    s.gyms = {};
    const gy = isObj(o.gyms) ? o.gyms : {};
    for (const g of GYMS) { const w = Math.floor(+gy[g.id] || 0); if (w > 0) s.gyms[g.id] = Math.min(w, 100000); }
    // Patch 2: diamonds, regions, bosses, boosts
    s.dia = isFinite(+o.dia) ? Math.max(0, Math.floor(+o.dia)) : 0;
    s.regionsOpen = clamp(Math.floor(+o.regionsOpen) || 1, 1, W.R.length);
    const rp = regionOfPos(W, s.li);
    if (s.done || s.li > regionStart(W, rp) || s.starters[rp] != null) s.regionsOpen = Math.max(s.regionsOpen, rp + 1);
    s.bosses = {};
    const bo = isObj(o.bosses) ? o.bosses : {};
    for (const b of BOSSES) { const w = Math.floor(+bo[b.id] || 0); if (w > 0) s.bosses[b.id] = Math.min(w, 100000); }
    s.bossCool = isFinite(+o.bossCool) ? Math.max(0, +o.bossCool) : 0;
    const bs = isObj(o.boost) ? o.boost : {};
    s.boost = { tap: clamp(+bs.tap || 0, 0, 36000), auto: clamp(+bs.auto || 0, 0, 36000) };
    s.bossTeam = Array.isArray(o.bossTeam) ? o.bossTeam.map(Number).filter((id, i, a) => id >= 1 && id <= NPOKE && a.indexOf(id) === i).slice(0, BALANCE.bosses.teamMax) : [];
    // shinies cover whole families, including evolutions that are new in this version
    for (const id of Object.keys(s.shiny)) unlockShiny(W, s, +id);
    s.seenVersion = typeof o.seenVersion === 'string' ? o.seenVersion : '1.0.0';
    delete s.team;
    return s;
  }
  function saveLocal() {
    if (!S) return;
    S.rev = (S.rev || 0) + 1; S.savedAt = Date.now(); S.gv = GAME_VERSION;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: progress lives for this visit only */ }
  }
  // A save from an older format or an older game version is copied to BACKUP_KEY on this device first.
  function backupOld(raw, obj) {
    const from = typeof obj.v === 'number' && obj.v >= 1 ? obj.v : 1;
    if (from >= SAVE_VERSION && !(typeof obj.gv === 'string' && cmpVer(GAME_VERSION, obj.gv) > 0)) return 0;
    try {
      const prev = JSON.parse(localStorage.getItem(BACKUP_KEY) || 'null');
      if (!prev || prev.raw !== raw) localStorage.setItem(BACKUP_KEY, JSON.stringify({ at: Date.now(), from, version: obj.gv || '1.0.0', raw }));
    } catch (e) { /* no room for a backup: the old save stays untouched until the next autosave */ }
    return from;
  }
  // Reads the local save and brings it to the current format.
  function loadLocal() {
    let raw = null, obj = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return null; }
    if (!raw) return null;
    try { obj = JSON.parse(raw); } catch (e) { return null; }
    if (!isObj(obj)) return null;
    backupOld(raw, obj);
    return sanitize(obj);
  }
  function readBackup() {

  }

  // cloud save through the artifact runtime (only inside claude.ai); otherwise browser storage only
  const cloud = { ref: null, busy: false, dirty: false, status: 'aus' };
  function markDirty() { cloud.dirty = true; }
  async function cloudWrite() {
    if (!cloud.ref || cloud.busy || !cloud.dirty) return;
    cloud.busy = true; cloud.dirty = false;
    try { saveLocal(); await cloud.ref.set({ json: JSON.stringify(S), rev: S.rev, savedAt: S.savedAt }); cloud.status = 'aktiv'; }
    catch (e) { cloud.dirty = true; if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { cloud.ref = null; cloud.status = 'nicht verfügbar'; } }
    finally { cloud.busy = false; }
  }
  async function initCloud() {
    const C = window.claude;
    if (!C || typeof C.use !== 'function') return;
    try {
      const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/save');
      const snap = await ref.get();
      cloud.ref = ref; cloud.status = 'aktiv';
      if (snap.exists) {
        const d = snap.data();
        let remote = null, obj = null;
        try { obj = d && typeof d.json === 'string' ? JSON.parse(d.json) : null; remote = sanitize(obj); } catch (e) { remote = null; }
        if (remote && remote.savedAt > bootSavedAt + 30000) {
          backupOld(d.json, obj);
          sheetQueue.length = 0; // pending sheets belong to the replaced state
          closeSheet(true); closeBattle(true);
          welcome = null;
          const notesFrom = cmpVer(GAME_VERSION, remote.seenVersion) > 0 ? remote.seenVersion : null;
          if (notesFrom) remote.seenVersion = GAME_VERSION;
          S = remote;
          markDirty(); // the cloud gets the converted save with the next autosave
          const away = (Date.now() - S.savedAt) / 1000;
          renderAll();
          if (notesFrom) queueSheet(() => openNotes(false, notesFrom));
          if (away > 5) offlineCatchup(away, away >= 60);
          toast('Spielstand aus der Cloud geladen');
        }
      } else { markDirty(); }
    } catch (e) { cloud.ref = null; }
    finally { releaseWelcome(); }
  }

  // ---------- derived ----------
  function regionOfLi() { return ctx(W, S).line.region; }
  function pendingStarter() {
    if (S.done) return false;

  }
  // true while the main game waits at a region that has to be bought with diamonds

  function xpToLevel(c, target) {
    let sum = -S.xp;
    for (let L = S.lvl; L < target; L++) sum += xpNeed(W, c.line, c.p, L, spOf(W, c.line.m[S.stage]));
    return Math.max(0, sum);

  function powerBonus() { const c = ctx(W, S); return Math.pow(S.lvl / c.line.bl, 1.2) - 1; }
  function itemPrice(id) {
    const it = BALANCE.items[id];
    const cps = curCps();
    let p;
    if (id === 'candy') {
      const c = ctx(W, S);
      if (S.lvl >= c.cap) return Infinity;
      const need = xpNeed(W, c.line, c.p, S.lvl, c.sp) - S.xp;
      p = Math.max(it.min, it.factor * need / xpPerSec(S) * cps);
    } else p = Math.max(it.min, it.sec * cps);
    return p * (1 - tBonus(S, 'discount'));

    // A sheet can open in the middle of a tap (e.g. a shiny on pointerdown). The click that finishes

    let swallow = pressActive;

    veil.addEventListener('pointerdown', e => { downOnVeil = e.target === veil; swallow = false; });

    document.body.appendChild(veil);

  // taps per second: best rate over a few seconds, and the average in seconds with taps
  const tapTimes = []; let tapSecKey = -1;
  function trackTap() {
    const now = performance.now(), st = S.stats;
    tapTimes.push(now);
    while (tapTimes.length && now - tapTimes[0] > 3000) tapTimes.shift();
    if (tapTimes.length >= 6) {
      const span = (now - tapTimes[0]) / 1000;
      if (span >= 2) st.tpsBest = Math.max(st.tpsBest || 0, Math.min(30, (tapTimes.length - 1) / span));
    }
    const sec = Math.floor(now / 1000);
    if (sec !== tapSecKey) { tapSecKey = sec; st.tapSecs = (st.tapSecs || 0) + 1; }
    st.tapSecTaps = (st.tapSecTaps || 0) + 1;
  }
  let lastTap = 0, floatCount = 0;

    if (!S || mainIdle()) return;

    const cps = coinsPerSec(W, S, c.p, c.sp.bst);
    const coin = coinsPerTap(cps, S), xp = xpPerTap(S);
    const atCap = S.lvl >= c.cap;
    S.coins += coin; S.life += coin; S.stats.taps++; trackTap();
    const ev = addXP(W, S, xp);

    if (st) {
      const r = st.getBoundingClientRect();
      const x = e && e.clientX != null ? e.clientX - r.left : r.width / 2;
      const y = e && e.clientY != null ? e.clientY - r.top : r.height / 2;

  async function loadFlavor(id, el) {
    if (flavorCache[id]) { el.textContent = flavorCache[id]; el.hidden = false; return; }
    if (!spritesOK) return; // sandboxed views block outside requests too
    try {
      const r = await fetch('https://pokeapi.co/api/v2/pokemon-species/' + id + '/');
      if (!r.ok) return;
      const j = await r.json();
      const de = (j.flavor_text_entries || []).filter(x => x.language && x.language.name === 'de');
      if (!de.length) return;
      const txt = de[de.length - 1].flavor_text.replace(FLAVOR_BREAKS, ' ').replace(/\s+/g, ' ').trim();
      flavorCache[id] = txt;
      try { localStorage.setItem('pkidle.flavor', JSON.stringify(flavorCache)); } catch (e) { /* ignore */ }

    return { type: best, raw: bv, names: MOVES[W.TI[best]] || MOVES.normal };
  }
  function effText(raw) { return raw >= 2 ? 'Sehr effektiv!' : raw < 1 ? 'Nicht sehr effektiv …' : ''; }
  // ---------- difficulty before a fight ----------
  // The colour always shows how hard the opponent is without items: green easy, yellow medium, red hard.

  const DIFF_LABEL = { ok: 'Einfach', mid: 'Mittel', hard: 'Schwer' };
  const fTaps = v => nf1.format(Math.ceil(v * 10) / 10);
  function diffChip(t) { const c = diffClass(t); return `<span class="diff ${c}">${DIFF_LABEL[c]}</span>`; }
  function itemsPhrase(p, x, boss) {
    const pp = p === 1 ? '1 Supertrank' : p + ' Supertränken';
    const xx = boss ? (x === 1 ? '1 X-Angriff' : x + ' X-Angriffen') : 'X-Angriff';
    return p > 0 && x > 0 ? pp + ' und ' + xx : p > 0 ? pp : x > 0 ? xx : null;
  }
  // t0: taps per second needed without items, ti: with the items in the bag (Infinity = not possible).
  // Nobody taps much faster than 12 times a second, so higher values are not shown as a number.
  const TAPS_MAX = 12;
  function verdictInfo(t0, ti, items, hardTip, itemNote, who = 'Dein Pokémon') {
    const cls = diffClass(t0);
    const main = !(t0 <= TAPS_MAX) ? `Mehr als ${TAPS_MAX} Tipps pro Sekunde nötig, so kaum zu schaffen` : t0 < 0.3 ? `${who} schafft das fast allein` : `Etwa ${fTaps(t0)} Tipps pro Sekunde nötig`;
    let html = `<span class="vl">${DIFF_LABEL[cls]}</span> ${esc(main)}.`;
    if (items && (ti < t0 - 0.05 || !(t0 <= TAPS_MAX))) {
      const ci = diffClass(ti);
      const res = !(ti <= TAPS_MAX) ? `immer noch mehr als ${TAPS_MAX} Tipps pro Sekunde` : ti < 0.3 ? 'fast von allein' : `etwa ${fTaps(ti)} Tipps pro Sekunde`;
      html += `<span class="vi"><i class="vdot ${ci}" aria-hidden="true"></i><span>Mit ${esc(items)}: ${res}, also ${DIFF_LABEL[ci].toLowerCase()}.${itemNote ? ' ' + esc(itemNote) : ''}</span></span>`;
    }
    if (!(Math.min(t0, ti) <= BALANCE.difficulty.medium)) html += `<span class="vt">${esc(hardTip)}</span>`;
    return { cls, html };
  }

    const auto = st.hit * x, per = (st.tap + st.special / K.specialEvery) * x;

      if (n > 0 && S.solo.sel) {
        const ev = [];
        const before = soloLevel(S, S.solo.sel);
        for (let i = 0; i < n; i++) soloTap(W, S, ev, true);
        if (ev.length) { markDirty(); handleEvents(ev); }
        autoFx += n;
        const st = $('#solo-stage');
        if (st && tab === 'arena' && autoFx >= 5) {
          autoFx = 0;
          const r = st.getBoundingClientRect();
          const x = rnd(0.3, 0.7) * r.width, y = rnd(0.35, 0.65) * r.height;
          if (soloLevel(S, S.solo.sel) < BALANCE.solo.maxLevel || before < BALANCE.solo.maxLevel) floater(`+${fRate(soloTapEp(S) * 5)}`, 'xp', x, y, $('#s-fl'));
          const bob = $('#s-bob');
          if (bob && !reduceMotion()) { bob.classList.remove('squash'); void bob.offsetWidth; bob.classList.add('squash'); }
        }

  function bossEvents() {
    if (!BT || BT.kind !== 'boss') return;
    const F = BT.F, name = BT.sp.name, B = BALANCE.bosses;
    const evs = F.ev.splice(0);
    for (const e of evs) {
      const m = bfMember(F);
      if (e.e === 'bossHit') {
        bfloat(fInt(e.d), e.kind === 'special' || bfMult(F) > 1.4 ? 'crit' : 'dmg', 'e');
        flash('e', 'hit');
        if (e.kind === 'special') { flash('p', 'lunge'); vibe(25); blog(`${m.sp.name} setzt eine Spezialattacke ein!`); }
        else if (e.kind === 'auto') flash('p', 'lunge');
      } else if (e.e === 'meHit') {
        bfloat(fInt(e.d), e.kind === 'special' ? 'crit' : 'dmg', 'p');
        flash('p', 'hit');
        if (e.kind === 'special' && !reduceMotion()) { const f = $('#b-field'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
        if (e.kind === 'special') { blog(`${name} trifft mit ${BT.b.move}!`); vibe(40); }
      } else if (e.e === 'charge') {
        const hp = F.mhp[F.idx], danger = hp <= m.eSpecial * 1.05;
        blog(`${name} lädt ${BT.b.move} auf!${danger ? (F.potions > 0 ? ` Das würde ${m.sp.name} besiegen. Schnell ein Supertrank!` : ` Das wird für ${m.sp.name} knapp.`) : ''}`);
        vibe(15);
      } else if (e.e === 'exhaust') blog(`${name} ist erschöpft und nimmt doppelten Schaden!${F.xatks > 0 && F.xT <= 0 ? ' Jetzt lohnt sich X-Angriff.' : ''}`);
      else if (e.e === 'exhaustEnd') blog(`${name} hat sich wieder gefangen.`);
      else if (e.e === 'shield') blog(`${name} baut einen Schutzschild auf: nur noch ${Math.round(B.shieldMult * 100)}${NB}% Schaden.`);
      else if (e.e === 'shieldEnd') blog('Der Schutzschild ist weg!');
      else if (e.e === 'heal') { bfloat('+' + fInt(e.d), 'heal', 'p'); blog(`Supertrank! ${m.sp.name} ist wieder fitter.`); }
      else if (e.e === 'xatk') blog(`X-Angriff! ${B.xatkTime} Sekunden lang mehr Schaden.`);
      else if (e.e === 'faint') blog(`${F.G.members[e.idx].sp.name} ist besiegt!`);
      else if (e.e === 'swap') { blog(`${F.G.members[e.idx].sp.name} kommt in den Kampf!`); vibe(30); }
      else if (e.e === 'swapIn') renderBossMember();
      else if (e.e === 'end') { bossUI(); endBoss(e.won, !!e.timeout); return; }
    }
    if (!BT.enraged && F.hp <= F.G.hpMax * B.enrageAt && !F.over) { BT.enraged = true; blog(`${name} wird wütend und greift schneller an!`); }

  // ---------- save transfer: file and code ----------
  // Code format 3: PKIDLE3:<base64url> of [3][fnv1a x4][json length x2][json][reg length x2][reg x2 bytes][seen length x2][seen bits]
  // Format 2 (version 1.0.1 to 1.1.0) stored the Pokédex positions in one byte each and can still be read.
  function b64uEncode(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 4096) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 4096));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64uDecode(str) {
    let t = str.replace(/-/g, '+').replace(/_/g, '/');
    if (t.length % 4 === 1) throw new Error('length');
    while (t.length % 4) t += '=';
    const bin = atob(t);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function fnv1a(bytes, from) {
    let h = 0x811c9dc5;
    for (let i = from; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  function packSave(st) {
    const core = {};
    for (const k of Object.keys(st)) if (k !== 'reg' && k !== 'seen' && k !== 'regCount') core[k] = st[k];
    const json = new TextEncoder().encode(JSON.stringify(core, (k, v) => (typeof v === 'number' && isFinite(v) && !Number.isInteger(v) ? +v.toPrecision(10) : v)));
    const reg = st.reg || {}, seen = st.seen || {};
    let nr = 0; for (let id = NPOKE; id >= 1; id--) if (reg[id]) { nr = id; break; }
    let ns = 0; for (let id = NPOKE; id >= 1; id--) if (seen[id] || reg[id]) { ns = Math.ceil(id / 8); break; }
    const out = new Uint8Array(7 + json.length + 2 + nr * 2 + 2 + ns);
    let o = 0;
    out[o++] = 3; o += 4;
    out[o++] = json.length >> 8; out[o++] = json.length & 255;
    out.set(json, o); o += json.length;
    out[o++] = nr >> 8; out[o++] = nr & 255;
    for (let id = 1; id <= nr; id++) { const v = reg[id] ? clamp(Math.round(+reg[id]) || 1, 1, 65535) : 0; out[o++] = v >> 8; out[o++] = v & 255; }
    out[o++] = ns >> 8; out[o++] = ns & 255;
    for (let id = 1; id <= ns * 8; id++) if (seen[id] || reg[id]) out[o + ((id - 1) >> 3)] |= 1 << ((id - 1) & 7);
    const h = fnv1a(out, 5);
    out[1] = h >>> 24; out[2] = (h >>> 16) & 255; out[3] = (h >>> 8) & 255; out[4] = h & 255;

  function unpackBin(bytes) {

    if (fnv1a(bytes, 5) !== h) return null;
    let o = 5;
    const jl = (bytes[o] << 8) | bytes[o + 1]; o += 2;

    const nr = (bytes[o] << 8) | bytes[o + 1]; o += 2;
    if (nr > NPOKE || o + nr * w + 2 > bytes.length) return null;
    const reg = {};
    for (let id = 1; id <= nr; id++) { const v = w === 2 ? (bytes[o] << 8) | bytes[o + 1] : bytes[o]; o += w; if (v) reg[id] = v; }
    const ns = (bytes[o] << 8) | bytes[o + 1]; o += 2;
    if (o + ns !== bytes.length) return null;
    const seen = {};
    for (let i = 0; i < ns * 8 && i < NPOKE; i++) if (bytes[o + (i >> 3)] & (1 << (i & 7))) seen[i + 1] = 1;

  // Finds a save code anywhere in pasted text or a file and repairs what chat apps do to long codes:
  // invisible characters, line breaks, extra text around it, percent-encoding, "+" turned into spaces.
  const cc = list => list.map(c => (Array.isArray(c) ? String.fromCharCode(c[0]) + '-' + String.fromCharCode(c[1]) : String.fromCharCode(c))).join('');
  const INVISIBLE = new RegExp('[' + cc([0xAD, 0x34F, 0x61C, 0x115F, 0x1160, 0x17B4, 0x17B5, 0x180E, [0x200B, 0x200F], [0x202A, 0x202E], [0x2060, 0x206F], [0xFE00, 0xFE0F], 0xFEFF]) + ']', 'g');
  const CODE_START = new RegExp('PKIDLE\\s*([123])\\s*[:' + String.fromCharCode(0xFF1A) + ']', 'gi');
  function readSaveText(text) {
    let t = String(text || '').replace(INVISIBLE, '');
    t = t.replace(/%2B/gi, '+').replace(/%2F/gi, '/').replace(/%3D/gi, '=').replace(/%3A/gi, ':');
    CODE_START.lastIndex = 0;
    let m, found = false;
    while ((m = CODE_START.exec(t))) {
      found = true;
      const ver = m[1];
      const chunks = t.slice(m.index + m[0].length).split(/\s+/).filter(Boolean).slice(0, 400);
      for (let k = chunks.length; k >= 1; k--) {
        const bin = ver !== '1';
        const joins = bin ? [''] : ['', '+'];
        for (const j of joins) {
          const cand = chunks.slice(0, k).join(j).replace(bin ? /[^A-Za-z0-9\-_]/g : /[^A-Za-z0-9+/=]/g, '');
          if (!cand) continue;

  }
  function summarize(st) {

    const sp = W.P[line.m[Math.min(st.stage, line.m.length - 1)] - 1];

        if (!dl) { svMsg('In dieser Ansicht lässt sich keine Datei speichern. Nutze „Code kopieren“.', true); return; }
        return dl.save({ filename: f.name, data: f.text }).then(() => toast('Datei gespeichert'), e => {
          if (e && (e.code === 'declined' || e.code === 'rate_limited')) return;
          svMsg('In dieser Ansicht lässt sich keine Datei speichern. Nutze „Code kopieren“.', true);
        });
      }, () => svMsg('In dieser Ansicht lässt sich keine Datei speichern. Nutze „Code kopieren“.', true));
      return;
    }
    const blob = new Blob([f.text], { type: 'text/plain' });
    const download = () => {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = f.name; link.rel = 'noopener';
      document.body.appendChild(link); link.click();
      setTimeout(() => { URL.revokeObjectURL(url); link.remove(); }, 4000);
      toast('Download gestartet');
    };
    const touch = matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.share && navigator.canShare && typeof File === 'function') {
      let file = null;
      try { file = new File([blob], f.name, { type: 'text/plain' }); } catch (e) { file = null; }

        navigator.share({ files: [file], title: 'Idle-Trainer Spielstand' }).catch(e => { if (!e || e.name !== 'AbortError') download(); });

    download();
  }

      S.stats.away = (S.stats.away || 0) + sec;
      markDirty();
      if (showModal) addWelcome({ sec: real, capped: real > sec, coins, gated: true, evos: [], note: `<p>${esc(W.R[gateRegion(W, S)][0])} wartet noch darauf, mit Diamanten freigeschaltet zu werden.</p>` });
      return;
    }
    const c = ctx(W, S);
    const cps = coinsPerSec(W, S, c.p, c.sp.bst);
    const lv0 = S.lvl, sp0 = c.sp;
    const coins = cps * sec * boost;
    S.coins += coins; S.life += coins;
    S.stats.away = (S.stats.away || 0) + sec;
    const ev = addXP(W, S, xpPerSec(S) * sec * boost);
    handleEvents(ev, true);
    markDirty();
    if (!showModal) return;
    const evos = ev.filter(e => e.e === 'evolve');
    const tUp = ev.filter(e => e.e === 'trainerLevel').pop();
    const now = ctx(W, S).sp;
    let note = '';
    if (S.ready) note = `<p>${esc(now.name)} ist bereit für den Kampf.</p>`;
    else if (S.stone) note = `<p>${esc(now.name)} wartet auf einen Entwicklungsstein.</p>`;
    addWelcome({ sec: real, capped: real > sec, coins: coins + evos.reduce((x, e) => x + e.reward, 0), gated: false, name0: sp0.name, lv0, lv1: S.lvl, evos: evos.map(e => [e.from, e.to]), trainer: tUp ? { id: tUp.id, lvl: tUp.lvl } : null, note });
  }

  // ---------- viewport guard (iOS keeps a shifted or shrunken viewport after the keyboard) ----------
  (function viewportGuard() {
    let maxH = window.innerHeight;
    const isField = el => !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    const settle = () => {
      if (isField(document.activeElement)) return;
      if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
      const se = document.scrollingElement;
      if (se && (se.scrollTop || se.scrollLeft)) { se.scrollTop = 0; se.scrollLeft = 0; }
      const app = document.getElementById('app');
      if (app && window.innerHeight < maxH - 4) {
        const main = document.getElementById('main'), top = main.scrollTop;
        app.style.display = 'none'; void app.offsetHeight; app.style.display = '';
        main.scrollTop = top;
      }
    };
    const later = () => setTimeout(settle, 160);
    window.addEventListener('resize', () => { if (!isField(document.activeElement)) maxH = Math.max(maxH, window.innerHeight); });
    window.addEventListener('orientationchange', () => setTimeout(() => { maxH = window.innerHeight; settle(); }, 400));
    document.addEventListener('focusout', later);
    window.addEventListener('scroll', () => { if (!isField(document.activeElement)) settle(); }, { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', later);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) later(); });
  })();

  // ---------- update check against the published version on GitHub ----------
  function checkRemoteVersion() {
    if (window.claude || location.protocol !== 'https:') return;
    fetch('version.json', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null))
      .then(j => {
        if (!j || typeof j.version !== 'string' || cmpVer(j.version, GAME_VERSION) <= 0) return;
        $('#update-text').textContent = `Version ${j.version} ist verfügbar.`;
        $('#update').hidden = false;
        $('#update-btn').onclick = () => { saveLocal(); location.reload(); };
      })
      .catch(() => { /* offline */ });
  }

  // ---------- main loop ----------
  let last = performance.now(), lastWall = Date.now(), uiT = 0, saveT = 0, cloudT = 0;
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    // Time away (app in the background, phone asleep) is the wall-clock gap between two frames.
    // Each gap is seen by exactly one frame, so every absence is credited exactly once.
    const wall = Date.now(), gap = (wall - lastWall) / 1000; lastWall = wall;
    if (S) {
      if (gap > 3) { offlineCatchup(gap, gap >= 60); if (BT) BT.paused = false; dt = 0; }
      else dt = clamp(dt, 0, 3);
      if (dt > 0) {
        if (!mainIdle()) {
          const c = ctx(W, S);
          const cps = coinsPerSec(W, S, c.p, c.sp.bst);
          S.coins += cps * dt; S.life += cps * dt;
          const ev = addXP(W, S, xpPerSec(S) * dt);
          if (ev.length) handleEvents(ev);
        } else if (gated()) { // waiting for the next region: the Pokédex team keeps earning
          const cps = cpsNow(W, S);
          S.coins += cps * dt; S.life += cps * dt;
        }
        S.stats.time += dt;
        battleStep(dt);
        bossStep(dt);
        boostStep(dt);
      }
      uiT += dt; saveT += dt; cloudT += dt;
      if (uiT >= 0.1) { uiT = 0; refresh(); }
      if (saveT >= 5) { saveT = 0; saveLocal(); }
      if (cloudT >= 20) { cloudT = 0; cloudWrite(); }
    }
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    if (!S) return;
    if (document.hidden) { if (BT) BT.paused = true; saveLocal(); markDirty(); cloudWrite(); }
    else if (BT) BT.paused = false;
  });
  window.addEventListener('pagehide', () => { if (S) saveLocal(); });

  // ---------- boot ----------
  let bootSavedAt = 0;
  function start(data) {
    let s = null;
    if (data && typeof data.save === 'string') { try { s = sanitize(JSON.parse(data.save)); } catch (e) { s = null; } }
    const local = s || loadLocal();
    bootSavedAt = local ? local.savedAt || 0 : 0;
    S = local || freshState();
    const away = (Date.now() - (S.savedAt || Date.now())) / 1000;
    const notesFrom = local && cmpVer(GAME_VERSION, S.seenVersion) > 0 ? S.seenVersion : null;
    renderAll();
    if (notesFrom) { S.seenVersion = GAME_VERSION; queueSheet(() => openNotes(false, notesFrom)); }
    // inside claude.ai the cloud save may replace this state, so its welcome window waits for that check
    welcomeHold = !!(window.claude && typeof window.claude.use === 'function');
    if (welcomeHold) setTimeout(() => { if (welcomeHold) releaseWelcome(); }, 4000);
    if (away > 5) offlineCatchup(away, away >= 60 && !s);
    saveLocal();
    last = performance.now(); lastWall = Date.now();
    requestAnimationFrame(frame);
    probeSprites();
    initCloud();
    checkRemoteVersion();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ save: JSON.stringify(S) })); } catch (e) { /* optional */ } }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();

</script>

<script>if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
