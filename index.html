    };
    return { n, f: (a, b) => a + (b - a) * n(), i: (a, b) => Math.floor(a + (b - a + 1) * n()) };
  }

  // Szenen-Koordinaten: viewBox 400 x 440, Horizont bei y = 232, Arenamitte (200 | 318)
  const VW = 400, VH = 440, H = 232, AX = 200, AY = 318, ARX = 170, ARY = 60;
  const inArena = (x, y, k = 1.1) => ((x - AX) / ARX) ** 2 + ((y - AY) / ARY) ** 2 < k;

  function jag(R, x0, y0, x1, y1, n, amp) {
    const out = [[x0, y0]];
    const nx = -(y1 - y0), ny = x1 - x0, len = Math.hypot(nx, ny) || 1;
    for (let k = 1; k < n; k++) {
      const t = k / n, o = R.f(-amp, amp);
      out.push([x0 + (x1 - x0) * t + (nx / len) * o, y0 + (y1 - y0) * t + (ny / len) * o]);
    }
    out.push([x1, y1]);
    return out;
  }

  function blob(R, cx, cy, n, rmin, rmax, sx, sy, fill, op) {
    let s = '';
    for (let k = 0; k < n; k++) {
      s += `<circle cx="${r1(cx + R.f(-sx, sx))}" cy="${r1(cy + R.f(-sy, sy))}" r="${r1(R.f(rmin, rmax))}" fill="${fill}"${op != null ? ` opacity="${op}"` : ''}/>`;
    }
    return s;
  }

  function wave(y, amp, len, x0, x1, bottom) {
    let d = `M${x0} ${y}`, x = x0;
    while (x < x1) { d += ` q${len / 4} ${-amp} ${len / 2} 0 t${len / 2} 0`; x += len; }
    return bottom == null ? d : d + ` L${x} ${bottom} L${x0} ${bottom}Z`;
  }

  const flameD = (x, y, w, h) =>
    `M${r1(x - w / 2)} ${r1(y)}C${r1(x - w / 2)} ${r1(y - h * 0.45)} ${r1(x - w * 0.12)} ${r1(y - h * 0.55)} ${r1(x)} ${r1(y - h)}C${r1(x + w * 0.16)} ${r1(y - h * 0.6)} ${r1(x + w / 2)} ${r1(y - h * 0.42)} ${r1(x + w / 2)} ${r1(y)}Z`;

  function flame(R, x, y, w, h, p) {
    return `<g class="bo-a-flame" style="--dur:${r1(R.f(1.1, 1.9))}s;--del:${r1(-R.f(0, 2))}s">` +
      `<path d="${flameD(x, y, w * 1.25, h * 1.08)}" fill="${p.glow}" opacity=".35"/>` +
      `<path d="${flameD(x, y, w, h)}" fill="${p.glow}"/>` +
      `<path d="${flameD(x, y, w * 0.55, h * 0.6)}" fill="${p.light}"/></g>`;
  }

  const leafD = (L, W) => `M${-L / 2} 0Q0 ${-W} ${L / 2} 0Q0 ${W} ${-L / 2} 0Z`;
  const star4 = (cx, cy, r) => {
    const q = r * 0.16;
    return `M${r1(cx)} ${r1(cy - r)}Q${r1(cx + q)} ${r1(cy - q)} ${r1(cx + r)} ${r1(cy)}Q${r1(cx + q)} ${r1(cy + q)} ${r1(cx)} ${r1(cy + r)}Q${r1(cx - q)} ${r1(cy + q)} ${r1(cx - r)} ${r1(cy)}Q${r1(cx - q)} ${r1(cy - q)} ${r1(cx)} ${r1(cy - r)}Z`;
  };
  function gearPts(cx, cy, r, n) {
    const out = [], ri = r * 0.8, st = (Math.PI * 2) / n;
    for (let k = 0; k < n; k++) {
      const a = k * st;
      for (const [rr, f] of [[ri, 0], [r, 0.12], [r, 0.38], [ri, 0.5]]) out.push([cx + Math.cos(a + st * f) * rr, cy + Math.sin(a + st * f) * rr]);
    }
    return P(out);
  }
  const hexPts = (cx, cy, r) => P([0, 1, 2, 3, 4, 5].map((k) => [cx + Math.cos(Math.PI / 6 + (k * Math.PI) / 3) * r, cy + Math.sin(Math.PI / 6 + (k * Math.PI) / 3) * r]));

  // Grasbüschel in den unteren Ecken
  function tufts(R, color, n = 14) {
    let s = '';
    for (const side of [0, 1]) {
      for (let k = 0; k < n; k++) {
        const x = side ? R.f(330, 412) : R.f(-12, 70), h = R.f(16, 44), w = R.f(3, 6), lean = R.f(-12, 12);
        s += `<path d="M${r1(x - w)} ${VH}Q${r1(x + lean * 0.4)} ${r1(VH - h * 0.6)} ${r1(x + lean)} ${r1(VH - h)}Q${r1(x + lean * 0.4 + 1)} ${r1(VH - h * 0.5)} ${r1(x + w)} ${VH}Z" fill="${color}"/>`;
      }
    }
    return s;
  }

  // Lichtstrahlen von oben
  function rays(R, p, n, x0, x1, slope) {
    let s = '';
    for (let k = 0; k < n; k++) {
      const x = R.f(x0, x1), w = R.f(14, 34);
      s += `<polygon class="bo-a-ray" style="--o:${r1(R.f(0.06, 0.13) * 100) / 100};--del:${r1(-R.f(0, 7))}s" points="${P([[x, -10], [x + w, -10], [x + w + slope, H + 10], [x + slope - w * 1.5, H + 10]])}" fill="${p.light}"/>`;
    }
    return s;
  }

  // Seitliche Felswand mit gezackter Kante und Lichtkante
  function wall(R, side, topX, botX, fill, rim, rimOp = 0.45) {
    const edge = jag(R, topX, -6, botX, H + 14, 10, 14);
    const outer = side === 'l' ? [[-8, H + 14], [-8, -6]] : [[VW + 8, H + 14], [VW + 8, -6]];
    return `<polygon points="${P([...edge, ...outer])}" fill="${fill}"/><polyline points="${P(edge)}" fill="none" stroke="${rim}" stroke-width="2" stroke-linejoin="round" opacity="${rimOp}"/>`;
  }

  /* ------------------------------------------------------------------ */
  /* Szenen pro Typ (Hintergrund, Boden, Vordergrund)                     */
  /* ------------------------------------------------------------------ */

  const MOTIFS = {
    normal(p, R) {
      let back = rays(R, p, 5, -20, 170, 170), floor = '', front = '';
      back += `<path d="M-10 196Q70 164 150 184T310 174T470 168V${H + 6}H-10Z" fill="${shade(p.mid, 0.1)}"/>`;
      back += blob(R, 110, 184, 7, 9, 16, 46, 6, shade(p.mid, -0.12)) + blob(R, 290, 176, 7, 9, 16, 46, 6, shade(p.mid, -0.12));
      back += `<path d="M-10 216Q90 196 190 210T390 204T590 200V${H + 6}H-10Z" fill="${shade(p.mid, -0.2)}"/>`;
      for (const [x, top] of [[20, 96], [380, 88]]) {
        back += `<rect x="${x - 8}" y="${top + 10}" width="16" height="${H - top}" rx="4" fill="${shade(p.deep, 0.12)}"/>`;
        back += blob(R, x, top, 10, 18, 34, 42, 30, shade(p.mid, -0.38)) + blob(R, x, top - 6, 6, 10, 18, 32, 20, shade(p.mid, -0.12), 0.85);
      }
      for (let k = 0; k < 70; k++) {
        const x = R.f(-5, 405), y = R.f(H - 2, H + 26), h = R.f(4, 10);
        floor += `<path d="M${r1(x - 2)} ${r1(y)}L${r1(x)} ${r1(y - h)}L${r1(x + 2)} ${r1(y)}Z" fill="${shade(p.floor, 0.2)}"/>`;
      }
      for (let k = 0; k < 44; k++) {
        const x = R.f(0, 400), y = R.f(H + 18, VH);
        if (!inArena(x, y, 1.3)) floor += `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(R.f(1.2, 2.4))}" fill="${R.n() < 0.5 ? p.light : p.glow}" opacity=".85"/>`;
      }
      front += tufts(R, shade(p.floor, -0.3));
      return { back, floor, front };
    },

    fire(p, R, u) {
      const defs = `<linearGradient id="${u}lava" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.light}"/><stop offset=".55" stop-color="${p.glow}"/><stop offset="1" stop-color="${p.glow}" stop-opacity=".25"/></linearGradient>` +
        `<linearGradient id="${u}up" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.glow}" stop-opacity="0"/><stop offset="1" stop-color="${p.glow}" stop-opacity=".38"/></linearGradient>`;
      let back = `<rect x="0" y="60" width="${VW}" height="${H - 48}" fill="url(#${u}up)"/>`, floor = '', front = '';
      for (const [x, y0, w] of [[168, 24, 12], [236, 52, 9], [204, 92, 6]]) {
        back += `<rect x="${x - w * 1.5}" y="${y0}" width="${w * 3}" height="${H - y0}" fill="${p.glow}" opacity=".4" filter="url(#${u}soft)"/>`;
        back += `<rect class="bo-a-glow" style="--del:${r1(-R.f(0, 3))}s" x="${x - w / 2}" y="${y0}" width="${w}" height="${H - y0}" rx="${w / 2}" fill="url(#${u}lava)"/>`;
      }
      for (let k = 0; k < 10; k++) {
        const x = R.f(110, 290), w = R.f(8, 18), h = R.f(18, 58);
        back += `<path d="M${r1(x - w / 2)} -2L${r1(x)} ${r1(h)}L${r1(x + w / 2)} -2Z" fill="${shade(p.deep, 0.12)}"/>`;
      }
      back += wall(R, 'l', 150, 56, shade(p.deep, 0.08), p.glow) + wall(R, 'r', 250, 344, shade(p.deep, 0.08), p.glow);
      for (const [x0, x1] of [[6, 86], [314, 394]]) for (let k = 0; k < 4; k++) { const h = R.f(38, 78); back += flame(R, R.f(x0, x1), H + 16, h * R.f(0.36, 0.48), h, p); }
      for (let k = 0; k < 7; k++) {
        const x0 = R.f(0, 400), y0 = R.f(H + 10, VH), c = P(jag(R, x0, y0, x0 + R.f(-130, 130), y0 + R.f(-30, 40), 6, 9));
        floor += `<polyline points="${c}" fill="none" stroke="${p.glow}" stroke-width="6" opacity=".35" filter="url(#${u}soft)"/><polyline class="bo-a-glow" style="--del:${r1(-R.f(0, 3))}s" points="${c}" fill="none" stroke="${p.light}" stroke-width="1.6" stroke-linejoin="round"/>`;
      }
      for (const [x, y] of [[20, 420], [70, 438], [360, 425], [395, 410]]) front += `<polygon points="${P([[x - 34, y + 24], [x - 18, y - 16], [x + 8, y - 24], [x + 30, y + 24]])}" fill="${shade(p.deep, 0.05)}"/>`;
      return { defs, back, floor, front };
    },

    water(p, R) {
      let back = rays(R, p, 6, -40, 360, 60), floor = '', front = '';
      for (const [side, a, b] of [['l', 70, 30], ['r', 330, 372]]) back += wall(R, side, a, b, shade(p.deep, 0.06), p.light, 0.25);
      for (const [y, amp, len, fill, op, dur, dir] of [[150, 5, 90, shade(p.mid, 0.18), 0.55, 16, 1], [176, 6, 110, p.mid, 0.78, 21, -1], [204, 7, 130, shade(p.mid, -0.28), 0.95, 26, 1]]) {
        back += `<path class="bo-a-wave" style="--dx:${len * dir}px;--dur:${dur}s" d="${wave(y, amp, len, -260, 680, H + 12)}" fill="${fill}" opacity="${op}"/>`;
        back += `<path class="bo-a-wave" style="--dx:${len * dir}px;--dur:${dur}s" d="${wave(y, amp, len, -260, 680)}" fill="none" stroke="${p.light}" stroke-width="1.2" opacity=".3"/>`;
      }
      for (let k = 0; k < 3; k++) floor += `<ellipse class="bo-a-ripple" style="--del:${-k * 1.5}s" cx="${AX}" cy="${AY}" rx="${ARX + 18}" ry="${ARY + 7}" fill="none" stroke="${p.light}" stroke-width="1.4" opacity=".4"/>`;
      for (let k = 0; k < 18; k++) { const x = R.f(0, 400), y = R.f(H + 14, VH); if (!inArena(x, y, 1.5)) floor += `<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(R.f(8, 22))}" ry="${r1(R.f(2, 4))}" fill="${p.light}" opacity=".12"/>`; }
      for (const [x0, x1] of [[0, 60], [340, 400]]) for (let k = 0; k < 5; k++) {
        const x = R.f(x0, x1), h = R.f(50, 110), bend = R.f(-14, 14);
        front += `<path class="bo-a-sway" style="--dur:${r1(R.f(3.5, 6))}s;--del:${r1(-R.f(0, 4))}s" d="M${r1(x - 4)} ${VH}C${r1(x - 4 + bend)} ${r1(VH - h * 0.4)} ${r1(x - bend)} ${r1(VH - h * 0.7)} ${r1(x + bend * 0.5)} ${r1(VH - h)}C${r1(x + 2 - bend)} ${r1(VH - h * 0.7)} ${r1(x + 4 + bend)} ${r1(VH - h * 0.4)} ${r1(x + 4)} ${VH}Z" fill="${shade(p.mid, -0.1)}"/>`;
      }
      return { back, floor, front };
    },

    electric(p, R, u) {
      let back = '', floor = '', front = '';
      for (const x of [34, 366]) {
        back += `<path d="M${x - 15} ${H + 8}L${x - 4} 92L${x + 4} 92L${x + 15} ${H + 8}" fill="none" stroke="${shade(p.mid, -0.2)}" stroke-width="3"/>`;
        let z = `M${x - 13} ${H}`; for (let y = H; y > 100; y -= 18) { const t = (y - 92) / (H - 92); z += `L${r1(x + (y % 36 ? 1 : -1) * (4 + 10 * t))} ${y - 18}`; }
        back += `<path d="${z}" fill="none" stroke="${shade(p.mid, -0.2)}" stroke-width="1.6"/>`;
        back += `<circle cx="${x}" cy="86" r="16" fill="${p.glow}" opacity=".5" filter="url(#${u}soft)" class="bo-a-glow"/><circle cx="${x}" cy="86" r="7" fill="${p.light}"/>`;
      }
      for (let k = 0; k < 14; k++) back += blob(R, R.f(-20, 420), R.f(-14, 46), 4, 18, 40, 30, 10, shade(p.mid, -0.45));
      for (let k = 0; k < 8; k++) back += blob(R, R.f(0, 400), R.f(40, 64), 3, 12, 24, 30, 6, shade(p.mid, 0.05), 0.45);
      back += `<rect class="bo-a-flash" style="--dur:4.6s;--del:0s" width="${VW}" height="${H}" fill="${p.light}" opacity=".12"/>`;
      for (const [x0, x1, d] of [[96, 70, 0], [306, 336, 1.6], [214, 196, 3]]) {
        const pts = P(jag(R, x0, 40, x1, H + 4, 9, 14));
        back += `<g class="bo-a-flash" style="--dur:4.6s;--del:${-d}s"><polyline points="${pts}" fill="none" stroke="${p.glow}" stroke-width="8" opacity=".7" filter="url(#${u}soft)"/><polyline points="${pts}" fill="none" stroke="${p.light}" stroke-width="2.4" stroke-linejoin="round"/></g>`;
      }
      for (let k = 0; k < 8; k++) {
        let x = R.f(0, 400), y = R.f(H + 14, VH - 10); const pts = [[x, y]];
        for (let s = 0; s < 3; s++) { if (s % 2) y += R.f(-26, 26); else x += R.f(-70, 70); pts.push([x, y]); }
        floor += `<polyline class="bo-a-glow" style="--del:${r1(-R.f(0, 3))}s" points="${P(pts)}" fill="none" stroke="${p.glow}" stroke-width="1.5" opacity=".7"/><circle cx="${r1(x)}" cy="${r1(y)}" r="2.6" fill="${p.light}"/>`;
      }
      return { back, floor, front };
    },

    grass(p, R) {
      let back = rays(R, p, 4, 40, 260, 80), floor = '', front = '';
      back += `<rect x="150" y="150" width="100" height="${H - 150}" fill="${shade(p.sky, -0.3)}" opacity=".45"/><rect x="132" y="196" width="136" height="${H - 196}" fill="${shade(p.sky, -0.32)}" opacity=".5"/><polygon points="140,150 200,118 260,150" fill="${shade(p.sky, -0.3)}" opacity=".45"/>`;
      for (let k = 0; k < 9; k++) back += blob(R, R.f(-10, 410), R.f(196, 214), 5, 10, 20, 26, 6, shade(p.mid, -0.25), 0.95);
      for (const [x, w] of [[22, 44], [380, 48]]) back += `<path d="M${x - w / 2} -10L${x + w / 2} -10L${x + w / 2 + 6} ${H}Q${x + w} ${H + 12} ${x + w + 14} ${H + 14}L${x - w - 14} ${H + 14}Q${x - w} ${H + 12} ${x - w / 2 - 6} ${H}Z" fill="${shade(p.deep, 0.08)}"/>`;
      back += blob(R, 200, 0, 36, 22, 44, 230, 22, shade(p.mid, -0.42)) + blob(R, 200, 26, 18, 10, 20, 210, 16, shade(p.mid, -0.15), 0.8);
      for (let k = 0; k < 5; k++) {
        const x = R.f(70, 340), len = R.f(60, 150); let v = `<path d="M${r1(x)} 10Q${r1(x + R.f(-14, 14))} ${r1(len / 2)} ${r1(x + R.f(-6, 6))} ${r1(len)}" fill="none" stroke="${shade(p.mid, 0.05)}" stroke-width="2.4"/>`;
        for (let t = 30; t < len; t += 22) v += `<path transform="translate(${r1(x + R.f(-6, 6))} ${t}) rotate(${r1(R.f(-50, 50) + (t % 44 ? 30 : -30))})" d="${leafD(12, 4)}" fill="${shade(p.glow, -0.35)}"/>`;
        back += `<g class="bo-a-sway" style="--dur:${r1(R.f(4, 7))}s;--del:${r1(-R.f(0, 4))}s">${v}</g>`;
      }
      for (let k = 0; k < 80; k++) { const x = R.f(-5, 405), y = R.f(H - 2, H + 30), h = R.f(5, 12); floor += `<path d="M${r1(x - 1.8)} ${r1(y)}L${r1(x + R.f(-2, 2))} ${r1(y - h)}L${r1(x + 1.8)} ${r1(y)}Z" fill="${shade(p.floor, 0.22)}"/>`; }
      for (let k = 0; k < 30; k++) { const x = R.f(0, 400), y = R.f(H + 24, VH); if (!inArena(x, y, 1.3)) floor += `<path transform="translate(${r1(x)} ${r1(y)}) rotate(${r1(R.f(0, 180))})" d="${leafD(10, 3)}" fill="${shade(p.floor, -0.25)}"/>`; }
      for (const [x, rot] of [[-6, -25], [404, 205]]) front += `<path transform="translate(${x} ${VH - 20}) rotate(${rot})" d="M0 0Q50 -38 110 0Q50 30 0 0Z" fill="${shade(p.mid, -0.25)}"/><path transform="translate(${x} ${VH - 20}) rotate(${rot})" d="M0 0L104 0" stroke="${shade(p.mid, 0.08)}" stroke-width="1.6"/>`;
      front += tufts(R, shade(p.floor, -0.35), 10);
      return { back, floor, front };
    },

    ice(p, R, u) {
      const defs = `<linearGradient id="${u}ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.light}" stop-opacity=".95"/><stop offset="1" stop-color="${p.glow}" stop-opacity=".35"/></linearGradient>` +
        `<linearGradient id="${u}aur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${p.glow}" stop-opacity="0"/><stop offset=".5" stop-color="${p.light}" stop-opacity=".5"/><stop offset="1" stop-color="${p.glow}" stop-opacity="0"/></linearGradient>`;
      let back = `<path class="bo-a-drift" style="--dx:-24px;--dur:14s" d="M-40 70Q60 30 160 64T360 52T520 60L520 92Q420 84 340 96T140 96T-40 104Z" fill="url(#${u}aur)" opacity=".7"/>`, floor = '', front = '';
      back += `<polygon points="${P([[-10, H + 4], [40, 150], [80, 186], [130, 120], [190, 190], [240, 140], [290, 182], [340, 128], [410, 196], [410, H + 4]])}" fill="${shade(p.mid, 0.12)}"/>`;
      back += `<polygon points="${P([[110, 146], [130, 120], [150, 150], [138, 142], [126, 152]])}" fill="${p.light}" opacity=".85"/><polygon points="${P([[318, 152], [340, 128], [362, 156], [348, 148], [334, 160]])}" fill="${p.light}" opacity=".85"/>`;
      for (const [side, a, b] of [['l', 96, 40], ['r', 304, 360]]) back += wall(R, side, a, b, shade(p.deep, 0.1), p.light, 0.5);
      for (let k = 0; k < 26; k++) { const x = R.f(-5, 405), w = R.f(5, 14), h = R.f(14, 64); back += `<path d="M${r1(x - w / 2)} -2L${r1(x)} ${r1(h)}L${r1(x + w / 2)} -2Z" fill="url(#${u}ice)"/>`; }
      for (const [x0, x1, dir] of [[0, 60, 1], [340, 400, -1]]) for (let k = 0; k < 4; k++) {
        const x = R.f(x0, x1), h = R.f(70, 150), w = R.f(14, 26), lean = R.f(6, 22) * dir;
        back += `<polygon points="${P([[x - w / 2, H + 12], [x - w / 3 + lean, H + 12 - h * 0.85], [x + lean * 1.2, H + 12 - h], [x + w / 2, H + 12]])}" fill="url(#${u}ice)" stroke="${p.light}" stroke-width=".8" stroke-opacity=".7"/>`;
      }
      for (let k = 0; k < 9; k++) { const x0 = R.f(0, 400), y0 = R.f(H + 10, VH); floor += `<polyline points="${P(jag(R, x0, y0, x0 + R.f(-90, 90), y0 + R.f(-20, 30), 5, 6))}" fill="none" stroke="${p.light}" stroke-width="1" opacity=".45"/>`; }
      for (const [x, y, rx] of [[30, 440, 80], [380, 444, 90]]) front += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="26" fill="${shade(p.light, -0.1)}" opacity=".9"/>`;
      return { defs, back, floor, front };
    },

    fighting(p, R, u) {
      let back = '', floor = '', front = '';
      for (let x = 0, k = 0; x < VW; x += 36, k++) back += `<rect x="${x}" y="40" width="36" height="${H - 40}" fill="${shade(p.mid, k % 2 ? -0.12 : -0.22)}"/>`;
      back += `<rect x="0" y="28" width="${VW}" height="20" fill="${shade(p.deep, 0.12)}"/><rect x="0" y="46" width="${VW}" height="4" fill="${p.glow}" opacity=".35"/><rect x="0" y="${H - 18}" width="${VW}" height="18" fill="${shade(p.deep, 0.15)}"/>`;

      for (const [x, dir] of [[18, 1], [384, -1]]) {
        let t = `<path d="M${x - 10} ${H + 14}Q${x} 150 ${x + 4 * dir} 70L${x + 12 * dir} 70Q${x + 14 * dir} 150 ${x + 12} ${H + 14}Z" fill="#050304"/>`;
        for (const [y, l, c] of [[90, 60, -30], [120, 46, 20], [150, 40, -18]]) t += `<path d="M${x + 6 * dir} ${y}Q${x + l * 0.5 * dir} ${y + c} ${x + l * dir} ${y - 10}" fill="none" stroke="#050304" stroke-width="4" stroke-linecap="round"/>`;
        back += t;
      }
      for (let k = 0; k < 6; k++) { const x0 = R.f(0, 400), y0 = R.f(H + 10, VH), c = P(jag(R, x0, y0, x0 + R.f(-110, 110), y0 + R.f(-20, 30), 6, 8)); floor += `<polyline points="${c}" fill="none" stroke="${p.glow}" stroke-width="5" opacity=".25" filter="url(#${u}soft)"/><polyline class="bo-a-glow" points="${c}" fill="none" stroke="${p.glow}" stroke-width="1.2" opacity=".8"/>`; }
      return { defs, back, floor, front };
    },

    steel(p, R, u) {
      let back = '', floor = '', front = '';
      for (let y = 0; y < H; y += 44) for (let x = 0; x < VW; x += 50) {
        back += `<rect x="${x + 1}" y="${y + 1}" width="48" height="42" fill="${shade(p.mid, R.f(-0.25, -0.05))}" stroke="${shade(p.deep, 0.05)}" stroke-width="1"/>`;
        back += `<circle cx="${x + 6}" cy="${y + 6}" r="1.4" fill="${p.light}" opacity=".35"/><circle cx="${x + 44}" cy="${y + 6}" r="1.4" fill="${p.light}" opacity=".35"/>`;
      }
      for (const [cx, cy, r, n, turn, dur] of [[52, 64, 52, 12, '360deg', 34], [370, 40, 40, 10, '-360deg', 26], [118, 120, 26, 8, '-360deg', 18]]) back += `<g class="bo-a-spin" style="--turn:${turn};--dur:${dur}s"><polygon points="${gearPts(cx, cy, r, n)}" fill="${shade(p.mid, -0.38)}"/><circle cx="${cx}" cy="${cy}" r="${r * 0.32}" fill="${shade(p.mid, 0.05)}"/><circle cx="${cx}" cy="${cy}" r="${r * 0.12}" fill="${shade(p.deep, 0.1)}"/></g>`;
      back += `<rect x="0" y="196" width="${VW}" height="14" fill="${shade(p.mid, 0.12)}"/><rect x="0" y="196" width="${VW}" height="3" fill="${p.light}" opacity=".3"/>`;
      for (const x of [60, 160, 260, 360]) back += `<rect x="${x - 6}" y="192" width="12" height="22" rx="2" fill="${shade(p.mid, -0.1)}"/>`;
      for (const x of [140, 260]) back += `<polygon class="bo-a-ray" style="--o:.1;--del:${r1(-R.f(0, 6))}s" points="${P([[x - 8, 0], [x + 8, 0], [x + 70, H], [x - 70, H]])}" fill="${p.light}"/><rect x="${x - 14}" y="0" width="28" height="8" fill="${shade(p.deep, 0.2)}"/>`;
      for (let k = -7; k <= 7; k++) floor += `<path d="M${AX + k * 30} ${H}L${r1(AX + k * 30 * 2.7)} ${VH}" stroke="${shade(p.floor, -0.35)}" stroke-width="1.2"/>`;
      for (const y of [256, 288, 330, 386]) floor += `<path d="M0 ${y}H${VW}" stroke="${shade(p.floor, -0.35)}" stroke-width="1.2"/>`;
      for (let k = 0; k < 18; k++) { const x = R.f(0, 400), y = R.f(H + 10, VH); if (!inArena(x, y, 1.3)) floor += `<circle cx="${r1(x)}" cy="${r1(y)}" r="1.6" fill="${p.light}" opacity=".35"/>`; }
      return { back, floor, front };
    },

    fairy(p, R) {
      let back = '', floor = '', front = '';
      back += `<path d="M-10 200Q80 172 170 192T350 182T530 178V${H + 6}H-10Z" fill="${shade(p.sky, 0.12)}" opacity=".7"/>`;
      for (const [x, dir] of [[10, 1], [390, -1]]) {
        back += `<path d="M${x - 10} ${H + 14}Q${x + 6 * dir} 170 ${x + 30 * dir} 110Q${x + 50 * dir} 70 ${x + 80 * dir} 50L${x + 86 * dir} 58Q${x + 50 * dir} 90 ${x + 40 * dir} 130Q${x + 24 * dir} 180 ${x + 14} ${H + 14}Z" fill="${shade(p.deep, 0.15)}"/>`;
        back += blob(R, x + 50 * dir, 50, 26, 16, 34, 70, 40, shade(p.glow, -0.3)) + blob(R, x + 50 * dir, 46, 22, 10, 24, 70, 36, p.glow, 0.9) + blob(R, x + 50 * dir, 40, 14, 5, 12, 70, 34, p.light, 0.9);
      }
      for (let g = 0; g < 2; g++) {
        const y0 = 120 + g * 34; let d = '';
        for (let k = 0; k <= 12; k++) { const t = k / 12, x = 90 + t * 220, y = y0 + Math.sin(t * Math.PI) * 26; d += `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(R.f(2, 3.4))}" fill="${k % 2 ? p.light : p.glow}" opacity=".9"/>`; }
        back += d;
      }
      for (let k = 0; k < 32; k++) {
        const a = (k / 32) * Math.PI * 2, x = AX + Math.cos(a) * (ARX + 18), y = AY + Math.sin(a) * (ARY + 8);
        floor += `<g transform="translate(${r1(x)} ${r1(y)})">${[0, 72, 144, 216, 288].map((d) => `<ellipse transform="rotate(${d})" cx="0" cy="-2.6" rx="1.7" ry="2.6" fill="${k % 3 ? p.light : p.glow}"/>`).join('')}<circle r="1.2" fill="${shade(p.glow, -0.3)}"/></g>`;
      }
      front += tufts(R, shade(p.floor, -0.25), 8);
      return { back, floor, front };
    }
  };

  /* ------------------------------------------------------------------ */
  /* Akzente des Zweittyps (zusätzlich zu dessen Partikeln und Licht)      */
  /* ------------------------------------------------------------------ */

  const ACCENTS = {
    flying(q, R, u) {
      let back = '';
      for (let k = 0; k < 6; k++) back += `<ellipse class="bo-a-drift" style="--dx:${r1(R.f(-30, 30))}px;--dur:${r1(R.f(12, 20))}s;--del:${r1(-R.f(0, 10))}s" cx="${r1(R.f(0, 400))}" cy="${r1(R.f(176, 222))}" rx="${r1(R.f(60, 120))}" ry="${r1(R.f(9, 16))}" fill="#ffffff" opacity="${r1(R.f(0.2, 0.32) * 100) / 100}" filter="url(#${u}soft)"/>`;
      return { back };
    },
    ghost(q, R, u) {
      let back = '';
      for (const [y, rx] of [[150, 220], [200, 260]]) back += `<ellipse class="bo-a-drift" style="--dx:${r1(R.f(-30, 30))}px;--dur:${r1(R.f(10, 15))}s" cx="200" cy="${y}" rx="${rx}" ry="20" fill="${q.light}" opacity=".16" filter="url(#${u}soft)"/>`;
      for (let k = 0; k < 5; k++) {
        const x = R.f(30, 370), y = R.f(70, 190);
        back += `<g class="bo-a-bob" style="--dy:${r1(-R.f(5, 12))}px;--dur:${r1(R.f(3, 5))}s;--del:${r1(-R.f(0, 4))}s"><path d="${flameD(x, y, 9, 18)}" fill="${q.glow}" opacity=".9"/><path d="${flameD(x, y, 4.5, 10)}" fill="${q.light}"/></g>`;
      }
      return { back };
    },
    electric(q, R, u) {
      let back = '';
      for (let k = 0; k < 9; k++) back += blob(R, R.f(-20, 420), R.f(-16, 28), 4, 16, 34, 30, 8, '#0b0b14', 0.55);
      const pts = P(jag(R, 250, 20, 232, 200, 8, 12));
      back += `<g class="bo-a-flash" style="--dur:5.2s;--del:-2.2s"><polyline points="${pts}" fill="none" stroke="${q.glow}" stroke-width="7" opacity=".6" filter="url(#${u}soft)"/><polyline points="${pts}" fill="none" stroke="${q.light}" stroke-width="2" stroke-linejoin="round"/></g>`;
      return { back };
    },
    dark(q) {
      return { back: `<rect width="${VW}" height="${H}" fill="#000" opacity=".28"/><ellipse cx="200" cy="${H - 4}" rx="260" ry="26" fill="${q.glow}" opacity=".22"/>` };
    },
    dragon(q, R) {
      let floor = '';
      for (let k = 0; k < 24; k++) {
        const a = (k / 24) * Math.PI * 2, x = AX + Math.cos(a) * (ARX + 16), y = AY + Math.sin(a) * (ARY + 6);
        floor += `<rect x="${r1(x - 3)}" y="${r1(y - 1.5)}" width="6" height="3" rx="1" fill="${q.light}" opacity=".6"/>`;
      }
      return { floor };
    },
    fire(q, R, u) {
      let floor = '';
      for (let k = 0; k < 5; k++) {
        const x0 = R.f(0, 400), y0 = R.f(H + 10, VH), c = P(jag(R, x0, y0, x0 + R.f(-110, 110), y0 + R.f(-26, 34), 6, 8));
        floor += `<polyline points="${c}" fill="none" stroke="${q.glow}" stroke-width="5" opacity=".3" filter="url(#${u}soft)"/><polyline class="bo-a-glow" points="${c}" fill="none" stroke="${q.light}" stroke-width="1.3" stroke-linejoin="round" opacity=".85"/>`;
      }
      return { floor };
    }
  };

  /* ------------------------------------------------------------------ */
  /* Partikeleffekte                                                      */
  /* ------------------------------------------------------------------ */

  function part(kind, x, y, shape, v, R) {
    return `<g transform="translate(${r1(x)} ${r1(y)})"><g class="bo-p bo-p-${kind}" style="--dur:${r1(v.dur)}s;--del:${r1(-R.f(0, v.dur))}s;--dx:${r1(v.dx || 0)}px;--dy:${r1(v.dy || 0)}px;--o:${r1((v.o ?? 1) * 10) / 10};--rot:${r1(v.rot || 0)}deg">${shape}</g></g>`;
  }

  function particles(type, q, R, m, u) {
    const n = (c) => Math.max(1, Math.round(c * m));
    const out = [];
    const A = (kind, x, y, shape, v) => out.push(part(kind, x, y, shape, v, R));
    const dotL = (r) => `<circle r="${r1(r)}" fill="url(#${u}L)"/>`, dotG = (r) => `<circle r="${r1(r)}" fill="url(#${u}G)"/>`;
    switch (type) {
      case 'normal':
        for (let k = 0; k < n(24); k++) A('rise', R.f(0, 400), R.f(150, 440), dotL(R.f(2.4, 4.6)), { dur: R.f(7, 11), dx: R.f(-24, 24), dy: -R.f(70, 150), o: R.f(0.5, 0.9) });
        break;
      case 'fire':
        for (let k = 0; k < n(36); k++) A('rise', R.f(0, 400), R.f(260, 450), `<circle r="${r1(R.f(0.9, 2.1))}" fill="${R.n() < 0.5 ? q.light : q.glow}"/>`, { dur: R.f(3, 6), dx: R.f(-40, 40), dy: -R.f(170, 320), o: R.f(0.6, 1) });
        for (let k = 0; k < n(8); k++) A('rise', R.f(0, 400), R.f(300, 450), dotG(R.f(5, 9)), { dur: R.f(4, 7), dx: R.f(-20, 20), dy: -R.f(120, 220), o: 0.6 });
        break;
      case 'water':
        for (let k = 0; k < n(28); k++) A('rise', R.f(0, 400), R.f(240, 450), `<circle r="${r1(R.f(1.6, 4.6))}" fill="${q.light}" fill-opacity=".12" stroke="${q.light}" stroke-width=".9"/>`, { dur: R.f(4, 8), dx: R.f(-14, 14), dy: -R.f(120, 260), o: R.f(0.5, 0.9) });
        break;
      case 'electric':
        for (let k = 0; k < n(22); k++) A('twinkle', R.f(10, 390), R.f(60, 430), `<path d="M-3 4L0 -1H-2L2 -6" fill="none" stroke="${q.light}" stroke-width="1.4" stroke-linecap="round"/>`, { dur: R.f(0.8, 1.8), o: 1 });
        for (const [x0, x1, d] of [[20, 44, 0.8], [380, 352, 2.6]]) {
          const pts = P(jag(R, x0, -6, x1, R.f(250, 330), 8, 12));
          out.push(`<g class="bo-a-flash" style="--dur:4.2s;--del:${-d}s"><polyline points="${pts}" fill="none" stroke="${q.glow}" stroke-width="8" opacity=".6" filter="url(#${u}soft)"/><polyline points="${pts}" fill="none" stroke="${q.light}" stroke-width="2.2" stroke-linejoin="round"/></g>`);
        }
        break;
      case 'grass':
        for (let k = 0; k < n(18); k++) A('fall', R.f(-20, 420), R.f(-30, 180), `<path d="${leafD(R.f(8, 13), 3.4)}" fill="${R.n() < 0.5 ? q.glow : shade(q.glow, -0.3)}"/>`, { dur: R.f(6, 10), dx: R.f(-70, 70), dy: R.f(220, 330), rot: R.f(200, 560), o: 0.95 });
        break;
      case 'ice':
        for (let k = 0; k < n(40); k++) A('fall', R.f(-20, 420), R.f(-30, 200), `<circle r="${r1(R.f(0.9, 2.4))}" fill="#ffffff"/>`, { dur: R.f(6, 11), dx: R.f(-40, 40), dy: R.f(220, 360), o: R.f(0.6, 1) });
        break;
      case 'fighting':
        for (let k = 0; k < 3; k++) out.push(`<g transform="translate(${AX} ${AY})"><g class="bo-p bo-p-ring" style="--dur:2.6s;--del:${-k * 0.87}s;--o:.75"><ellipse rx="${ARX * 0.7}" ry="${ARY * 0.7}" fill="none" stroke="${q.glow}" stroke-width="2.2"/></g></g>`);
        for (let k = 0; k < n(18); k++) A('rise', R.f(0, 400), R.f(280, 450), `<circle r="${r1(R.f(1, 2.2))}" fill="${q.light}"/>`, { dur: R.f(3, 5), dx: R.f(-30, 30), dy: -R.f(80, 160), o: 0.7 });
        break;
      case 'poison':
        for (let k = 0; k < n(26); k++) A('rise', R.f(0, 400), R.f(250, 450), `<circle r="${r1(R.f(2, 5.5))}" fill="${R.n() < 0.5 ? q.light : q.glow}" fill-opacity=".35" stroke="${R.n() < 0.5 ? q.light : q.glow}" stroke-width="1"/>`, { dur: R.f(2.6, 4.6), dx: R.f(-10, 10), dy: -R.f(50, 120), o: 0.9 });
        break;
      case 'ground':
        for (let k = 0; k < n(34); k++) A('streak', R.f(-100, 300), R.f(80, 440), `<circle r="${r1(R.f(0.8, 2))}" fill="${q.light}"/>`, { dur: R.f(5, 9), dx: R.f(160, 260), o: R.f(0.3, 0.6) });
        break;
      case 'flying':
        for (let k = 0; k < n(16); k++) A('streak', R.f(400, 520), R.f(40, 420), `<path d="M0 0H${r1(R.f(36, 80))}" stroke="${q.light}" stroke-width="1.3" stroke-linecap="round"/>`, { dur: R.f(1.8, 3.4), dx: -R.f(420, 560), o: R.f(0.35, 0.6) });
        for (let k = 0; k < n(6); k++) A('fall', R.f(0, 400), R.f(-20, 140), `<path d="${leafD(14, 3)}" fill="${q.light}"/>`, { dur: R.f(7, 11), dx: R.f(-90, 90), dy: R.f(200, 300), rot: R.f(90, 300), o: 0.85 });
        break;
      case 'psychic':
        for (let k = 0; k < n(18); k++) A('rise', R.f(0, 400), R.f(140, 440), dotG(R.f(4, 8)), { dur: R.f(5, 9), dx: R.f(-20, 20), dy: -R.f(80, 170), o: R.f(0.6, 1) });
        break;
      case 'bug':
        for (let k = 0; k < n(20); k++) A('wander', R.f(10, 390), R.f(80, 420), dotL(R.f(2.6, 4.4)), { dur: R.f(2.5, 5), dx: R.f(-40, 40), dy: R.f(-30, 30), o: 1 });
        break;
      case 'rock':
        for (let k = 0; k < n(14); k++) { const s = R.f(1.5, 3.5); A('fall', R.f(0, 400), R.f(-20, 160), `<polygon points="${P([[-s, s], [-s * 0.4, -s], [s, -s * 0.3], [s * 0.6, s]])}" fill="${shade(q.light, -0.3)}"/>`, { dur: R.f(6, 10), dx: R.f(-20, 20), dy: R.f(160, 280), rot: R.f(90, 360), o: 0.8 }); }
        for (let k = 0; k < n(16); k++) A('rise', R.f(0, 400), R.f(250, 440), `<circle r="${r1(R.f(0.8, 1.8))}" fill="${q.light}"/>`, { dur: R.f(5, 9), dx: R.f(-30, 30), dy: -R.f(40, 100), o: 0.4 });
        break;
      case 'ghost':
        for (let k = 0; k < n(14); k++) { const rx = R.f(4, 7); A('rise', R.f(0, 400), R.f(200, 450), `<ellipse rx="${r1(rx)}" ry="${r1(rx * 1.5)}" fill="url(#${u}L)"/>`, { dur: R.f(6, 10), dx: R.f(-30, 30), dy: -R.f(130, 220), o: R.f(0.5, 0.8) }); }
        break;
      case 'dragon':
        for (let k = 0; k < n(28); k++) A('rise', R.f(0, 400), R.f(220, 450), R.n() < 0.5 ? dotL(R.f(2.4, 4.2)) : dotG(R.f(2.4, 4.2)), { dur: R.f(4, 7), dx: R.f(-50, 50), dy: -R.f(150, 260), o: R.f(0.7, 1) });
        break;
      case 'dark':
        for (let k = 0; k < n(10); k++) A('rise', R.f(0, 400), R.f(260, 470), `<ellipse rx="${r1(R.f(14, 28))}" ry="${r1(R.f(8, 14))}" fill="#000000"/>`, { dur: R.f(7, 11), dx: R.f(-20, 20), dy: -R.f(70, 130), o: 0.35 });
        for (let k = 0; k < n(14); k++) A('twinkle', R.f(0, 400), R.f(80, 420), `<circle r="${r1(R.f(1, 1.8))}" fill="${q.glow}"/>`, { dur: R.f(1.6, 3.2), o: 1 });
        break;
      case 'steel':
        for (let k = 0; k < n(14); k++) A('twinkle', R.f(10, 390), R.f(20, 420), `<path d="${star4(0, 0, R.f(3, 6))}" fill="#ffffff"/>`, { dur: R.f(2, 4), o: 0.9 });
        break;
      case 'fairy':
        for (let k = 0; k < n(18); k++) A('twinkle', R.f(10, 390), R.f(20, 420), `<path d="${star4(0, 0, R.f(2.5, 5.5))}" fill="${R.n() < 0.5 ? q.light : q.glow}"/>`, { dur: R.f(1.8, 3.6), o: 1 });
        for (let k = 0; k < n(12); k++) A('fall', R.f(-20, 420), R.f(-30, 160), `<ellipse rx="3.4" ry="2" fill="${q.glow}"/>`, { dur: R.f(6, 10), dx: R.f(-60, 60), dy: R.f(220, 320), rot: R.f(180, 540), o: 0.9 });
        break;
    }
    return out.join('');
  }

  /* ------------------------------------------------------------------ */
  /* Szene zusammensetzen                                                 */
  /* ------------------------------------------------------------------ */

  function buildScene(types, uid, seed) {
    const t1 = TYPES[types[0]] ? types[0] : 'normal';
    const p = TYPES[t1];
    const t2 = TYPES[types[1]] ? types[1] : null;
    const halo = t2 ? TYPES[t2].glow : p.glow;
    const R = rng(seed);
    const m = (MOTIFS[t1] || MOTIFS.normal)(p, R, uid);
    const acc = (t2 && ACCENTS[t2]) ? ACCENTS[t2](TYPES[t2], R, uid) : {};
    const ticks = Array.from({ length: 36 }, (_, k) => {
      const a = (k / 36) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      return `M${r1(AX + c * (ARX - 10))} ${r1(AY + s * (ARY - 3.5))}L${r1(AX + c * (ARX - 3))} ${r1(AY + s * (ARY - 1))}`;
    }).join('');
    return `<svg class="bo-scene" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="${uid}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.sky}"/><stop offset=".55" stop-color="${p.mid}"/><stop offset="1" stop-color="${p.deep}"/></linearGradient>
<radialGradient id="${uid}halo" cx="276" cy="214" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${halo}" stop-opacity=".55"/><stop offset=".45" stop-color="${halo}" stop-opacity=".16"/><stop offset="1" stop-color="${halo}" stop-opacity="0"/></radialGradient>
<linearGradient id="${uid}floor" x1="0" y1="${H}" x2="0" y2="${VH}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${p.floor}"/><stop offset="1" stop-color="${shade(p.floor, -0.45)}"/></linearGradient>
<radialGradient id="${uid}disk" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="${p.glow}" stop-opacity=".42"/><stop offset=".5" stop-color="${shade(p.floor, 0.06)}" stop-opacity=".92"/><stop offset="1" stop-color="${shade(p.floor, -0.35)}"/></radialGradient>
<radialGradient id="${uid}vig" cx=".5" cy=".42" r=".78"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<filter id="${uid}soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
${m.defs || ''}
</defs>
<rect width="${VW}" height="${VH}" fill="url(#${uid}sky)"/>
${m.back}
${acc.back || ''}
<rect width="${VW}" height="${VH}" fill="url(#${uid}halo)"/>
<path d="M-10 ${H}Q200 ${H - 10} 410 ${H}V${VH + 10}H-10Z" fill="url(#${uid}floor)"/>
${m.floor}
${acc.floor || ''}
<g class="bo-arena">
<ellipse cx="${AX}" cy="${AY + 6}" rx="${ARX + 6}" ry="${ARY + 4}" fill="#000" opacity=".35" filter="url(#${uid}soft)"/>
<ellipse cx="${AX}" cy="${AY}" rx="${ARX}" ry="${ARY}" fill="url(#${uid}disk)"/>
<ellipse cx="${AX}" cy="${AY}" rx="${ARX}" ry="${ARY}" fill="none" stroke="${p.glow}" stroke-width="6" opacity=".5" filter="url(#${uid}soft)"/>
<ellipse cx="${AX}" cy="${AY}" rx="${ARX}" ry="${ARY}" fill="none" stroke="${p.glow}" stroke-width="1.8"/>
<path d="${ticks}" stroke="${p.light}" stroke-width="1.4" opacity=".55"/>
<ellipse cx="${AX}" cy="${AY}" rx="${ARX - 26}" ry="${ARY - 9}" fill="none" stroke="${p.light}" stroke-width="1.1" stroke-dasharray="3 6" opacity=".35"/>
<path d="M${AX - ARX + 8} ${AY}H${AX - 66}M${AX + 66} ${AY}H${AX + ARX - 8}" stroke="${p.glow}" stroke-width="1.4" opacity=".55"/>
<ellipse class="bo-a-glow" cx="${AX}" cy="${AY}" rx="64" ry="22.5" fill="none" stroke="${p.glow}" stroke-width="7" opacity=".45" filter="url(#${uid}soft)"/>
<ellipse cx="${AX}" cy="${AY}" rx="64" ry="22.5" fill="${p.deep}" fill-opacity=".45" stroke="${p.glow}" stroke-width="2.4"/>
<g transform="translate(${AX} ${AY}) scale(2.2 .8) translate(-12 -12)" style="color:${p.glow}" fill="${p.glow}" fill-rule="evenodd" opacity=".75">${ICONS[t1]}</g>
</g>
${m.front || ''}
<rect width="${VW}" height="${VH}" fill="url(#${uid}vig)"/>
</svg>`;
  }

  function buildFx(types, uid, seed) {
    const R = rng(seed * 7 + 3);
    const t1 = TYPES[types[0]] ? types[0] : 'normal';
    const t2 = TYPES[types[1]] ? types[1] : null;
    const layers = t2 ? [[t1, 0.45], [t2, 1]] : [[t1, 1]];
    let defs = `<filter id="${uid}fxsoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>`, body = '';
    layers.forEach(([t, m], i) => {
      const q = TYPES[t], u = `${uid}f${i}`;
      defs += `<radialGradient id="${u}L"><stop offset="0" stop-color="${q.light}"/><stop offset=".35" stop-color="${q.light}" stop-opacity=".6"/><stop offset="1" stop-color="${q.light}" stop-opacity="0"/></radialGradient>` +
        `<radialGradient id="${u}G"><stop offset="0" stop-color="${shade(q.glow, 0.4)}"/><stop offset=".35" stop-color="${q.glow}" stop-opacity=".6"/><stop offset="1" stop-color="${q.glow}" stop-opacity="0"/></radialGradient>` +
        `<filter id="${u}soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>`;
      body += particles(t, q, R, m, u);
    });
    return `<svg class="bo-fx" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false"><defs>${defs}</defs>${body}</svg>`;
  }

  /* ------------------------------------------------------------------ */
  /* PokéAPI                                                              */
  /* ------------------------------------------------------------------ */

  const memo = new Map();
  const readCache = () => { try { return JSON.parse(localStorage.getItem(CONFIG.cacheKey) || '{}') || {}; } catch (e) { return {}; } };
  const writeCache = (key, val) => { try { const c = readCache(); c[key] = val; localStorage.setItem(CONFIG.cacheKey, JSON.stringify(c)); } catch (e) { /* Speicher nicht verfügbar */ } };

  async function getJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`PokéAPI antwortet mit ${res.status}: ${url}`);
    return res.json();
  }
  const pickName = (names, fallback) => (names.find((n) => n.language.name === CONFIG.lang) || {}).name || fallback;

  function cached(key, loader) {
    if (memo.has(key)) return memo.get(key);
    const stored = readCache()[key];
    const pr = stored ? Promise.resolve(stored) : loader().then((v) => { writeCache(key, v); return v; });
    memo.set(key, pr);
    pr.catch(() => memo.delete(key));
    return pr;
  }

  const loadTypeName = (type, url) => cached(`t:${type}`, async () => pickName((await getJSON(url)).names, type));

  // Liefert { id, name, types: ['steel','dragon'], typeNames: ['Stahl','Drache'], art }
  function loadPokemon(id) {
    const own = CONFIG.local ? CONFIG.local(id) : null; // Patch 8
    if (own) return Promise.resolve(own);
    return cached(`p:${id}`, async () => {
      const poke = await getJSON(`${CONFIG.apiBase}/pokemon/${id}`);
      const species = await getJSON(poke.species.url);
      const slots = poke.types.slice().sort((a, b) => a.slot - b.slot);
      const types = slots.map((t) => t.type.name);
      const typeNames = await Promise.all(slots.map((t) => loadTypeName(t.type.name, t.type.url)));
      const other = (poke.sprites && poke.sprites.other) || {};
      const art = (other['official-artwork'] || {}).front_default || (other.home || {}).front_default || null;
      return { id, name: pickName(species.names, species.name), types, typeNames, art };
    });
  }

  // Patch 8: src darf eine Liste sein, die Quellen werden nacheinander versucht (jede höchstens artTimeout ms).
  function loadImage(src) {
    const list = (Array.isArray(src) ? src : [src]).filter(Boolean);
    return new Promise((resolve, reject) => {
      if (!list.length) { reject(new Error('Kein Artwork in der PokéAPI hinterlegt')); return; }
      const next = (i) => {
        if (i >= list.length) { reject(new Error('Artwork konnte nicht geladen werden: ' + list.join(', '))); return; }
        const img = new Image();
        let done = false, timer = 0;
        const fail = () => { if (done) return; done = true; clearTimeout(timer); next(i + 1); };
        timer = setTimeout(fail, CONFIG.artTimeout);
        img.decoding = 'async';
        img.alt = '';
        img.onload = () => { if (done) return; done = true; clearTimeout(timer); resolve(img); };
        img.onerror = fail;
        img.src = list[i];
      };
      next(0);
    });
  }
  // Patch 8: erst das Bild, dann das Ersatzbild. Patch 8.1: Pixelart-Sprites werden markiert (scharf vergrößern).
  const loadArt = (mon) => loadImage(mon.art)
    .then((img) => { if (mon.pixel) { img.dataset.pix = '1'; img.classList.add('is-pix'); } return img; })
    .catch((err) => (mon.fallback ? loadImage(mon.fallback) : Promise.reject(err)));
  const isPix = (img) => !!(img && img.dataset && img.dataset.pix === '1');
  // Patch 8.1: Kopie des Sprites für das Aufblitzen (weiß, golden, rot) und die Silhouette im Intro. Sie nutzt
  // dieselbe Bilddatei, läuft also im selben Takt wie die GIF-Animation, und ist sonst unsichtbar.
  function mkFlash(img) {
    const f = img.cloneNode();
    f.className = 'bo-flash' + (isPix(img) ? ' is-pix' : '');
    f.removeAttribute('data-pix');
    f.alt = '';
    return f;
  }

  /* Patch 8.1: Bewegte Teile der Vektorszene und die Partikel als eigene HTML-Ebenen. Jedes bewegte Element
     wandert samt allem, was es von seinen Eltern erbt, in eine kleine eigene SVG; die Animation (dieselben
     Keyframes) liegt dann auf der HTML-Ebene darum und läuft auf der Grafikkarte. */
  const SVGNS = 'http://www.w3.org/2000/svg';
  const LIFT_CLS = /(^|\s)bo-(a-[a-z]+|p)(\s|$)/;
  const LIFT_OPACITY = /(^|\s)bo-(p-[a-z]+|a-(glow|flash|ripple|pulse|star|ray))(\s|$)/;
  const LIFT_KEEP = ['fill', 'stroke', 'stroke-width', 'stroke-linecap', 'stroke-linejoin', 'stroke-dasharray', 'fill-opacity', 'stroke-opacity', 'fill-rule', 'color'];
  function liftAnimations(svg, box) {
    if (!svg || !box || !svg.getScreenCTM || typeof DOMPoint === 'undefined') return 0;
    const all = Array.from(svg.querySelectorAll('[class]')).filter((el) => LIFT_CLS.test(el.getAttribute('class')));
    const outer = all.filter((el) => !all.some((o) => o !== el && o.contains(el)));
    const rs = svg.getScreenCTM();
    if (!rs) return 0;
    const inv = rs.inverse(), M = 16;
    let n = 0;
    const stars = []; // Sterne funkeln in vier Gruppen statt jeder für sich (dutzende Ebenen weniger, gleiches Bild)
    for (const el of outer) {
      const cls = el.getAttribute('class'), vars = el.getAttribute('style') || '';
      const cs = global.getComputedStyle(el), tb = cs.transformBox, to = cs.transformOrigin;
      const inherited = LIFT_KEEP.map((k) => [k, el.hasAttribute(k) ? null : cs.getPropertyValue(k)]);
      let op = 1;
      for (let a = el.parentNode; a && a !== svg; a = a.parentNode) op *= parseFloat(global.getComputedStyle(a).opacity) || 0;
      el.setAttribute('class', '');
      let bb = null, em = null, pm = null;
      try { bb = el.getBBox(); em = el.getScreenCTM(); pm = el.parentNode.getScreenCTM(); } catch (e) { bb = null; }
      if (!bb || !em || !pm || !(bb.width + bb.height > 0)) { el.setAttribute('class', cls); continue; }
      const m = inv.multiply(em), pmat = inv.multiply(pm);
      const pts = [[bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]]
        .map(([x, y]) => new DOMPoint(x, y).matrixTransform(m));
      const x0 = Math.min(...pts.map((q) => q.x)) - M, y0 = Math.min(...pts.map((q) => q.y)) - M;
      const w = Math.max(...pts.map((q) => q.x)) + M - x0, h = Math.max(...pts.map((q) => q.y)) + M - y0;
      let ox = w / 2, oy = h / 2;
      if (tb === 'fill-box') {
        const [a, b] = String(to).split(' ').map(parseFloat);
        const q = new DOMPoint(bb.x + (a || 0), bb.y + (b || 0)).matrixTransform(m);
        ox = q.x - x0; oy = q.y - y0;
      }
      for (const [k, v] of inherited) if (v) el.style.setProperty(k, v);
      for (const part of vars.split(';')) { const k = part.split(':')[0].trim(); if (k.startsWith('--')) el.style.removeProperty(k); }
      if (LIFT_OPACITY.test(cls)) el.removeAttribute('opacity');
      if (/(^|\s)bo-a-star(\s|$)/.test(cls)) {
        const sv = {}; for (const part of vars.split(';')) { const kv = part.split(':'); const k = (kv[0] || '').trim(); if (k.startsWith('--')) sv[k.slice(2)] = parseFloat(kv[1]); }
        el.setAttribute('opacity', sv.o != null ? sv.o : 1);
        stars.push({ el, x0, y0, x1: x0 + w, y1: y0 + h, pmat, dur: sv.dur || 3 });
        continue;
      }
      const layer = document.createElement('div');
      layer.className = 'bo-al';
      layer.setAttribute('style', `left:${x0}px;top:${y0}px;width:${w}px;height:${h}px;transform-origin:${ox}px ${oy}px`);
      const kind = (/bo-(p-[a-z]+|a-[a-z]+)/.exec(cls) || [])[1] || '', v = {};
      for (const part of vars.split(';')) { const kv = part.split(':'); const k = (kv[0] || '').trim(); if (k.startsWith('--')) v[k.slice(2)] = parseFloat(kv[1]); }
      layer._an = { kind, v, cls };
      if (kind === 'a-ray' || kind === 'a-star') layer.style.opacity = v.o != null ? v.o : 1;
      if (kind === 'a-flash') layer.style.opacity = 0;
      const s2 = document.createElementNS(SVGNS, 'svg');
      s2.setAttribute('width', w); s2.setAttribute('height', h); s2.setAttribute('viewBox', `${x0} ${y0} ${w} ${h}`);
      s2.setAttribute('aria-hidden', 'true'); s2.setAttribute('focusable', 'false');
      const g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('transform', `matrix(${pmat.a} ${pmat.b} ${pmat.c} ${pmat.d} ${pmat.e} ${pmat.f})`);
      if (op < 1) g.setAttribute('opacity', op);
      g.appendChild(el);
      s2.appendChild(g); layer.appendChild(s2); box.appendChild(layer);
      n++;
    }
    const G = Math.min(4, stars.length);
    for (let gi = 0; gi < G; gi++) {
      const mem = stars.filter((_, i) => i % G === gi);
      const x0 = Math.min(...mem.map((q) => q.x0)), y0 = Math.min(...mem.map((q) => q.y0));
      const w = Math.max(...mem.map((q) => q.x1)) - x0, h = Math.max(...mem.map((q) => q.y1)) - y0;
      const dur = mem.reduce((a, q) => a + q.dur, 0) / mem.length;
      const layer = document.createElement('div');
      layer.className = 'bo-al';
      layer.setAttribute('style', `left:${x0}px;top:${y0}px;width:${w}px;height:${h}px`);
      layer._an = { kind: 'a-stars', v: { o: 1, dur, del: -dur * gi / G }, cls: 'bo-a-star' };
      const s2 = document.createElementNS(SVGNS, 'svg');
      s2.setAttribute('width', w); s2.setAttribute('height', h); s2.setAttribute('viewBox', `${x0} ${y0} ${w} ${h}`);
      s2.setAttribute('aria-hidden', 'true'); s2.setAttribute('focusable', 'false');
      for (const q of mem) {
        const g = document.createElementNS(SVGNS, 'g');
        g.setAttribute('transform', `matrix(${q.pmat.a} ${q.pmat.b} ${q.pmat.c} ${q.pmat.d} ${q.pmat.e} ${q.pmat.f})`);
        g.appendChild(q.el); s2.appendChild(g);
      }
      layer.appendChild(s2); box.appendChild(layer);
      n++;
    }
    return n;
  }
  // Patch 8.1: die Bewegungen der gehobenen Ebenen als Web Animations mit festen Werten. CSS-Keyframes mit Variablen
  // (var(--dx) ...) rechnet der Browser in jedem Bild auf dem Hauptthread neu, feste Werte gibt er an die Grafikkarte.
  // Dieselben Bewegungen wie die Keyframes bo-rise ... bo-sway oben, mit der Zeitkurve wie in CSS je Abschnitt.
  const AN = {
    'p-rise': { e: 'linear', k: (v) => [{ transform: 'translate(0px,0px)', opacity: 0 }, { opacity: v.o, offset: 0.15 }, { opacity: v.o, offset: 0.8 }, { transform: `translate(${v.dx || 0}px,${v.dy || 0}px)`, opacity: 0 }] },
    'p-fall': { e: 'linear', k: (v) => [{ transform: 'translate(0px,0px) rotate(0deg)', opacity: 0 }, { opacity: v.o, offset: 0.1 }, { opacity: v.o, offset: 0.85 }, { transform: `translate(${v.dx || 0}px,${v.dy || 0}px) rotate(${v.rot || 0}deg)`, opacity: 0 }] },
    'p-twinkle': { e: 'ease-in-out', k: (v) => [{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1)', opacity: v.o, offset: 0.5 }, { transform: 'scale(.3)', opacity: 0 }] },
    'p-wander': { e: 'ease-in-out', alt: true, k: (v) => [{ transform: 'translate(0px,0px)', opacity: 0.25 }, { opacity: v.o, offset: 0.5 }, { transform: `translate(${v.dx || 0}px,${v.dy || 0}px)`, opacity: 0.4 }] },
    'p-ring': { e: 'ease-out', k: (v) => [{ transform: 'scale(.35)', opacity: 0 }, { opacity: v.o, offset: 0.15 }, { transform: 'scale(1.4)', opacity: 0 }] },
    'p-streak': { e: 'linear', k: (v) => [{ transform: 'translate(0px,0px)', opacity: 0 }, { opacity: v.o, offset: 0.2 }, { opacity: v.o, offset: 0.8 }, { transform: `translate(${v.dx || 0}px,0px)`, opacity: 0 }] },
    'a-ray': { e: 'ease-in-out', dur: 7, k: (v) => [{ opacity: v.o }, { opacity: v.o * 0.45, offset: 0.5 }, { opacity: v.o }] },
    'a-glow': { e: 'ease-in-out', dur: 2.8, k: () => [{ opacity: 1 }, { opacity: 0.55, offset: 0.5 }, { opacity: 1 }] },
    'a-flame': { e: 'ease-in-out', dflt: 1.4, k: () => [{ transform: 'scale(1,1) skewX(0deg)' }, { transform: 'scale(.95,1.1) skewX(3deg)', offset: 0.3 }, { transform: 'scale(1.04,.92) skewX(-3deg)', offset: 0.6 }, { transform: 'scale(1,1) skewX(0deg)' }] },
    'a-wave': { e: 'linear', dflt: 16, noDel: true, k: (v) => [{ transform: 'translateX(0px)' }, { transform: `translateX(${v.dx || 0}px)` }] },
    'a-flash': { e: 'linear', dflt: 4.6, k: () => [{ opacity: 0 }, { opacity: 1, offset: 0.03 }, { opacity: 0.25, offset: 0.05 }, { opacity: 0.95, offset: 0.08 }, { opacity: 0, offset: 0.13 }, { opacity: 0 }] },
    'a-ripple': { e: 'ease-out', dur: 4.5, k: () => [{ transform: 'scale(.88)', opacity: 0.5 }, { transform: 'scale(1.16)', opacity: 0 }] },
    'a-pulse': { e: 'ease-in-out', dur: 3.6, k: () => [{ transform: 'scale(.97)', opacity: 0.55 }, { transform: 'scale(1.03)', opacity: 1, offset: 0.5 }, { transform: 'scale(.97)', opacity: 0.55 }] },
    'a-drift': { e: 'ease-in-out', dflt: 20, alt: true, k: (v) => [{ transform: 'translateX(0px)' }, { transform: `translateX(${v.dx != null ? v.dx : 20}px)` }] },
    'a-spin': { e: 'linear', dflt: 30, noDel: true, k: (v) => [{ transform: 'rotate(0deg)' }, { transform: `rotate(${v.turn != null ? v.turn : 360}deg)` }] },
    'a-bob': { e: 'ease-in-out', dflt: 4, alt: true, k: (v) => [{ transform: 'translateY(0px)' }, { transform: `translateY(${v.dy != null ? v.dy : -8}px)` }] },
    'a-star': { e: 'ease-in-out', dflt: 3, k: (v) => [{ opacity: v.o }, { opacity: v.o * 0.25, offset: 0.5 }, { opacity: v.o }] },

  function startAmbient(boxes) {

      if (!d || !layer.animate) { layer.className = 'bo-al ' + a.cls; continue; } // unbekannt: wie bisher über CSS
      const kf = d.k(v).map((f, i, all) => (i < all.length - 1 ? Object.assign({ easing: d.e }, f) : f));

    }

  }

.bo-halo--player{background:radial-gradient(closest-side,rgba(255,255,255,.36),rgba(255,255,255,.13) 58%,transparent)}
.bo-impact{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;z-index:4;opacity:0;
background:radial-gradient(closest-side,rgba(255,240,170,0),rgba(255,226,110,.9) 62%,rgba(255,213,74,0) 72%)}
.bo-shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none;z-index:1}
.bo-banner{position:absolute;left:10px;top:12px;z-index:5;display:flex;align-items:center;max-width:calc(100% - 20px);pointer-events:none;transform-origin:0 0}
.bo-hex{position:relative;flex:none;width:52px;height:58px;filter:drop-shadow(0 0 7px var(--bo-glow-a80))}
.bo-hex::before,.bo-hex::after{content:"";position:absolute;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.bo-hex::before{inset:0;background:var(--bo-glow)}
.bo-hex::after{inset:2.5px;background:linear-gradient(160deg,var(--bo-mid),var(--bo-deep))}
.bo-hex svg{position:absolute;inset:0;margin:auto;width:56%;height:56%;z-index:1;color:var(--bo-light)}
.bo-plate{position:relative;z-index:-1;margin-left:-10px;padding:6px 22px 7px 20px;transform:skewX(-12deg);
background:linear-gradient(90deg,var(--bo-deep-a95),var(--bo-mid-a90) 65%,var(--bo-mid-a50));border:1.5px solid var(--bo-glow);border-left:0;
box-shadow:0 0 14px var(--bo-glow-a55),inset 0 0 14px var(--bo-glow-a30)}
.bo-plate-in{display:flex;flex-direction:column;transform:skewX(12deg)}
.bo-kicker{font-size:10.5px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--bo-light);line-height:1.2}
.bo-bname{font-size:25px;line-height:1.05;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;
text-shadow:0 0 12px var(--bo-glow-a80),0 2px 0 rgba(0,0,0,.45)}
.bo-bname.is-long{font-size:21px}
.bo-types{display:flex;gap:10px;margin-top:3px}
.bo-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.3}
.bo-chip svg{width:12px;height:12px;flex:none}
.bo-bossbar{display:flex;gap:12px;align-items:center;flex:none;padding:10px 14px 9px 10px;border-radius:18px;
background:linear-gradient(90deg,var(--bo-deep-a90),var(--bo-panel) 70%);border:1.5px solid var(--bo-glow);box-shadow:0 0 14px var(--bo-glow-a40),inset 0 0 14px var(--bo-glow-a18)}
.bo-bossbar .bo-hex{width:44px;height:50px}
.bo-bossbar-main{flex:1;min-width:0}
.bo-bossbar .bo-name{text-transform:uppercase;letter-spacing:.05em;font-size:16px}
.bo-hp--boss{height:14px;margin:6px 0 5px}
.bo-msg{flex:none;padding:12px 16px;border-radius:16px;background:var(--bo-panel);border:1px solid var(--bo-line);font-size:15px;line-height:1.35;min-height:46px}
.bo-actions{display:flex;gap:8px;flex:none}
.bo-btn{flex:1 1 0;min-width:0;height:50px;padding:0 10px;border-radius:16px;border:1px solid var(--bo-line-2);background:var(--bo-panel-2);color:var(--bo-text);
font:inherit;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;transition:transform .1s}
.bo-btn b{font-weight:400;font-size:15px;color:#cfd3f2}
.bo-btn--quit{flex:0 0 auto;padding:0 16px}
.bo-btn:active{transform:scale(.97)}
.bo-btn:disabled{opacity:.42;cursor:default;transform:none}
.bo-btn:focus-visible{outline:2px solid var(--bo-glow);outline-offset:2px}
.bo-hud-wait{opacity:0}
.bo-intro{position:absolute;inset:0;z-index:30;overflow:hidden;cursor:pointer}
.bo-intro-dim{position:absolute;inset:0;background:rgba(4,5,12,.86)}
.bo-intro-burst{position:absolute;left:50%;top:30%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(closest-side,var(--bo-glow-a80),var(--bo-glow-a18) 45%,transparent 72%)}
.bo-intro-streak{position:absolute;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--bo-light),var(--bo-glow),transparent);box-shadow:0 0 12px var(--bo-glow)}
.bo-intro-skip{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.bo-banner--intro{position:absolute;margin:0}
.bo-banner--intro .bo-kicker{animation:bo-kick .9s steps(2,end) 2}
.bo-shake .bo-stage{animation:bo-shake .45s ease-out}
.bo-p{transform-box:fill-box;transform-origin:center}
.bo-p-rise{animation:bo-rise var(--dur) linear var(--del) infinite}
.bo-p-fall{animation:bo-fall var(--dur) linear var(--del) infinite}
.bo-p-twinkle{animation:bo-twinkle var(--dur) ease-in-out var(--del) infinite}
.bo-p-wander{animation:bo-wander var(--dur) ease-in-out var(--del) infinite alternate}
.bo-p-ring{animation:bo-ring var(--dur) ease-out var(--del) infinite}
.bo-p-streak{animation:bo-streak var(--dur) linear var(--del) infinite}
.bo-a-ray{opacity:var(--o);animation:bo-breathe 7s ease-in-out var(--del,0s) infinite}
.bo-a-glow{animation:bo-glow 2.8s ease-in-out var(--del,0s) infinite}
.bo-a-flame{transform-box:fill-box;transform-origin:50% 100%;animation:bo-flame var(--dur,1.4s) ease-in-out var(--del,0s) infinite}
.bo-a-wave{animation:bo-wave var(--dur,16s) linear infinite}
.bo-a-flash{opacity:0;animation:bo-flash var(--dur,4.6s) linear var(--del,0s) infinite}
.bo-a-ripple{transform-box:fill-box;transform-origin:center;animation:bo-ripple 4.5s ease-out var(--del,0s) infinite}
.bo-a-pulse{transform-box:fill-box;transform-origin:center;animation:bo-pulse 3.6s ease-in-out var(--del,0s) infinite}
.bo-a-drift{animation:bo-drift var(--dur,20s) ease-in-out var(--del,0s) infinite alternate}
.bo-a-spin{transform-box:fill-box;transform-origin:center;animation:bo-spin var(--dur,30s) linear infinite}
.bo-a-bob{animation:bo-bob var(--dur,4s) ease-in-out var(--del,0s) infinite alternate}
.bo-a-star{opacity:var(--o);animation:bo-star var(--dur,3s) ease-in-out var(--del,0s) infinite}
.bo-a-sway{transform-box:fill-box;transform-origin:50% 100%;animation:bo-sway var(--dur,5s) ease-in-out var(--del,0s) infinite alternate}
.bo--still *,.bo--still *::before,.bo--still *::after{animation-play-state:paused!important}
@keyframes bo-rise{0%{transform:translate(0,0);opacity:0}15%{opacity:var(--o)}80%{opacity:var(--o)}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes bo-fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes bo-twinkle{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1);opacity:var(--o)}}
@keyframes bo-wander{0%{transform:translate(0,0);opacity:.25}50%{opacity:var(--o)}100%{transform:translate(var(--dx),var(--dy));opacity:.4}}
@keyframes bo-ring{0%{transform:scale(.35);opacity:0}15%{opacity:var(--o)}100%{transform:scale(1.4);opacity:0}}
@keyframes bo-streak{0%{transform:translate(0,0);opacity:0}20%{opacity:var(--o)}80%{opacity:var(--o)}100%{transform:translate(var(--dx),0);opacity:0}}
@keyframes bo-breathe{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o) * .45)}}
@keyframes bo-glow{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes bo-flame{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.95,1.1) skewX(3deg)}60%{transform:scale(1.04,.92) skewX(-3deg)}}
@keyframes bo-wave{to{transform:translateX(var(--dx))}}
@keyframes bo-flash{0%,100%{opacity:0}3%{opacity:1}5%{opacity:.25}8%{opacity:.95}13%{opacity:0}}
@keyframes bo-ripple{0%{transform:scale(.88);opacity:.5}100%{transform:scale(1.16);opacity:0}}
@keyframes bo-pulse{0%,100%{transform:scale(.97);opacity:.55}50%{transform:scale(1.03);opacity:1}}
@keyframes bo-drift{to{transform:translateX(var(--dx,20px))}}
@keyframes bo-spin{to{transform:rotate(var(--turn,360deg))}}
@keyframes bo-bob{to{transform:translateY(var(--dy,-8px))}}
@keyframes bo-star{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o) * .25)}}
@keyframes bo-sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes bo-shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes bo-kick{0%{opacity:1}50%{opacity:.35}}
/* Patch 8: Kampfmechanik (Patch 8.1: Balken über transform, ruhiger Infobereich, kurzes Phasenbanner) */
.bo-side{display:flex;align-items:baseline;gap:8px;flex:none}
.bo-phase{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--bo-light);padding:2px 7px 1px;border-radius:7px;border:1px solid var(--bo-glow-a55);background:var(--bo-deep-a90);white-space:nowrap;align-self:center}
.bo-phase[data-last="1"]{color:#fff;border-color:rgba(239,91,91,.8);box-shadow:0 0 10px rgba(239,91,91,.4)}
.bo-sub{display:flex;align-items:center;gap:10px}
.bo-team:empty{display:none}
.bo-spec{position:relative;flex:1;min-width:24px;max-width:150px;height:5px;border-radius:99px;background:#0a0c1a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);overflow:hidden}
.bo-spec i{position:absolute;left:0;top:0;bottom:0;width:100%;transform:scaleX(0);transform-origin:0 50%;background:var(--bo-hp-mid);transition:transform .1s}
.bo-spec.is-ready i{background:#ff8a5c;box-shadow:0 0 8px #ff8a5c}
.bo-spec-ic{flex:none;width:12px;height:12px;color:var(--bo-sub)}
.bo-spec.is-ready + .bo-kp,.bo-sub .bo-spec-ic.is-ready{color:#ffb08c}
.bo-sub .bo-kp{margin-left:auto}
.bo-mates{display:flex;gap:5px;margin-top:7px}
.bo-mates:empty{display:none}
.bo-mate{position:relative;flex:1 1 0;min-width:0;max-width:46px;height:36px;padding:0;border-radius:10px;border:1px solid var(--bo-line-2);background:var(--bo-panel-2);color:inherit;cursor:pointer;overflow:hidden;touch-action:manipulation}
.bo-mate::after{content:"";position:absolute;inset:-5px -3px}
.bo-mate[data-s="active"]{border-color:var(--bo-hp-mid);box-shadow:inset 0 0 0 1px var(--bo-hp-mid)}
.bo-mate[data-s="fainted"]{opacity:.35;filter:grayscale(1)}
.bo-mate[data-s="cool"]{opacity:.6}
.bo-mate:disabled{cursor:default}
.bo-mate:focus-visible{outline:2px solid var(--bo-glow);outline-offset:2px}
.bo-mate-ic{position:absolute;inset:1px 1px 5px;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.bo-mate-ic img,.bo-mate-ic svg{max-width:100%;max-height:100%;object-fit:contain}
.bo-mate-hp{position:absolute;left:5px;right:5px;bottom:3px;height:3px;border-radius:2px;background:#0a0c1a;overflow:hidden;pointer-events:none}
.bo-mate-hp i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:0 50%;background:var(--bo-hp)}
.bo-mate-hp[data-level="mid"] i{background:var(--bo-hp-mid)}
.bo-mate-hp[data-level="low"] i{background:var(--bo-hp-low)}
.bo-pills{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;max-width:60%}
.bo-pills--boss{left:12px;top:84px}
.bo-pills--player{right:10px;bottom:10px;align-items:flex-end}
.bo-pill{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.25;padding:3px 8px;border-radius:8px;white-space:nowrap;
background:rgba(8,9,22,.82);border:1px solid var(--bo-line-2);color:var(--bo-text);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.bo-pill[data-tone="boss"]{border-color:var(--bo-glow);color:var(--bo-light);box-shadow:0 0 10px var(--bo-glow-a40)}
.bo-pill[data-tone="bad"]{border-color:rgba(239,91,91,.75);color:#ffd2cf}
.bo-pill[data-tone="good"]{border-color:rgba(78,214,132,.7);color:#cbf6dc}
.bo-pill[data-tone="gold"]{border-color:rgba(242,201,76,.8);color:#ffe9a8}
.bo-floats{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.bo-float{position:absolute;font-family:var(--bo-font-num,inherit);font-weight:700;font-size:19px;line-height:1;white-space:nowrap;color:#fff;
text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 8px rgba(0,0,0,.5);animation:bo-float .9s ease-out forwards}
.bo-float[data-tone="crit"]{color:#ffd54a;font-size:24px}
.bo-float[data-tone="hurt"]{color:#ff8a84}
.bo-float[data-tone="big"]{color:#ff6b63;font-size:26px}
.bo-float[data-tone="heal"]{color:var(--bo-hp)}
.bo-float[data-tone="info"]{color:#bfe6ff;font-family:var(--bo-font,inherit);font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.bo-float[data-tone="good"]{color:#9df0bf;font-family:var(--bo-font,inherit);font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.bo-pban{position:absolute;left:10px;right:10px;top:12px;z-index:8;display:flex;justify-content:center;pointer-events:none;opacity:0}
.bo-pban.is-on{animation:bo-pban 1.1s ease-out forwards}
.bo-pban-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70px;padding:6px 18px 7px;transform:skewX(-10deg);background:linear-gradient(90deg,var(--bo-deep-a95),var(--bo-mid-a90) 50%,var(--bo-deep-a95));border:1.5px solid var(--bo-glow);border-radius:4px;box-shadow:0 0 22px var(--bo-glow-a55)}
.bo-pban-in b{transform:skewX(10deg);font-size:26px;line-height:1.05;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.04em;text-shadow:0 0 14px var(--bo-glow-a80),0 2px 0 rgba(0,0,0,.45)}
.bo-pban-in span{transform:skewX(10deg);font-size:12.5px;font-weight:700;color:var(--bo-light);margin-top:2px;text-align:center;white-space:nowrap}
.bo-cframe{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:6;opacity:0;transition:opacity .2s;box-shadow:inset 0 0 0 2px #ffd54a,inset 0 0 30px rgba(255,213,74,.6),inset 0 0 70px rgba(255,213,74,.22)}
.bo-counter .bo-cframe{opacity:1;animation:bo-cpulse .8s ease-in-out infinite alternate}
.bo-csum{position:absolute;right:12px;top:14px;z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;padding:5px 11px 6px;border-radius:12px;
background:rgba(22,17,4,.86);border:1px solid rgba(255,213,74,.75);box-shadow:0 0 14px rgba(255,213,74,.35);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s}
.bo-csum.is-on{opacity:1;transform:none}
.bo-csum small{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffe08a;line-height:1.2}
.bo-csum b{font-family:var(--bo-font-num,inherit);font-size:22px;line-height:1.05;color:#ffd54a;font-variant-numeric:tabular-nums}
.bo-msg{position:relative;height:74px;padding:7px 14px;display:flex;flex-direction:column;justify-content:space-between;contain:layout paint}
.bo-info-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;height:18px;line-height:18px}
.bo-info-top b{font-weight:800;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bo-info-top span{flex:none;font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--bo-sub);font-variant-numeric:tabular-nums}
.bo-info-sub{height:32px;padding-bottom:2px;font-size:13px;line-height:15px;color:var(--bo-sub);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.bo-msg[data-long] .bo-info-top b{font-size:13px}
.bo-msg[data-long] .bo-info-top span{font-size:12px}
.bo-meter-bar{position:relative;height:8px;border-radius:99px;background:#0a0c1a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
.bo-meter-bar i{position:absolute;top:0;bottom:0;left:0}
.bo-meter-zone{background:rgba(78,214,132,.32);box-shadow:inset 0 0 0 1.5px rgba(78,214,132,.85)}
.bo-meter-fill{width:100%;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,#f2c94c,#ff7a45)}
.bo-msg[data-kind="idle"] .bo-meter-bar{opacity:.35}
.bo-msg[data-kind="counter"] .bo-meter-fill{background:linear-gradient(90deg,#ffe58a,#ffc21a)}
.bo-msg[data-kind="counter"] .bo-info-top b{color:#ffe08a}
.bo-msg[data-kind="geo"] .bo-meter-fill{background:linear-gradient(90deg,var(--bo-glow),var(--bo-light))}
.bo-msg[data-tone="now"] .bo-info-top span{color:#7cf0a8}
.bo-msg[data-tone="now"] .bo-meter-fill{background:linear-gradient(90deg,#f2c94c,#4ed684)}
.bo-msg[data-tone="done"] .bo-info-top span{color:#7cf0a8}
.bo-msg[data-tone="early"] .bo-info-top span{color:#ff8a84}
.bo-dodgerow{flex:none;display:flex}
.bo-dodge{flex:1;min-width:0;height:58px;border-radius:18px;border:1.5px solid var(--bo-line-2);background:var(--bo-panel-2);color:var(--bo-sub);font:inherit;font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;
display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.bo-dodge svg{width:22px;height:22px;flex:none}
.bo-dodge:focus-visible{outline:2px solid var(--bo-glow);outline-offset:2px}
.bo-dodge[data-state="wait"]{color:#ffe08a;border-color:rgba(242,201,76,.7);background:#2a2614}
.bo-dodge[data-state="now"]{color:#06210f;border-color:#7cf0a8;background:#4ed684;box-shadow:0 0 0 3px rgba(78,214,132,.3),0 0 24px rgba(78,214,132,.55);animation:bo-now .5s ease-in-out infinite alternate}
.bo-dodge[data-state="done"]{color:#bff6d3;border-color:rgba(78,214,132,.8);background:#173323}
.bo-dodge[data-state="early"]{color:#ffd2cf;border-color:rgba(239,91,91,.85);background:#3a1717}
.bo-dodge:active{transform:scale(.98)}
.bo-btn.is-confirm{background:#4a1c1c;border-color:rgba(239,91,91,.8);color:#ffd2cf}
.bo-intro-note{position:absolute;left:18px;right:18px;text-align:center;pointer-events:none}
.bo-intro-note b{display:block;font-size:11px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--bo-light)}
.bo-intro-note span{display:block;margin-top:6px;font-size:15px;line-height:1.4;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.bo-lift{position:absolute;left:0;top:0;width:400px;height:440px;transform-origin:0 0;pointer-events:none}
.bo-lift--fx{z-index:4}
.bo-al{position:absolute;display:block}
.bo-al > svg{display:block;overflow:visible}
@keyframes bo-float{0%{transform:translate(-50%,0) scale(.8);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.08)}100%{transform:translate(-50%,-62px) scale(1);opacity:0}}
@keyframes bo-pban{0%{opacity:0;transform:translateY(-6px) scale(1.12)}14%{opacity:1;transform:none}72%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes bo-now{from{transform:scale(1)}to{transform:scale(1.025)}}
@keyframes bo-cpulse{from{opacity:1}to{opacity:.55}}
/* Patch 8.1: flache Arena: kleineres Namensbanner, die Konter-Summe steht dann nur im Infobereich */
.bo--short .bo-banner{left:8px;top:8px}
.bo--short .bo-hex{width:38px;height:42px}
.bo--short .bo-plate{margin-left:-8px;padding:4px 16px 5px 15px}
.bo--short .bo-kicker{font-size:8.5px;letter-spacing:.24em}
.bo--short .bo-bname{font-size:18px}
.bo--short .bo-bname.is-long{font-size:16px}
.bo--short .bo-types{gap:8px;margin-top:2px}
.bo--short .bo-chip{font-size:9px;gap:3px}
.bo--short .bo-chip svg{width:10px;height:10px}
.bo--short .bo-pills--boss{left:10px;top:auto;bottom:10px;flex-direction:column-reverse}

  function injectCSS() {

  /* ------------------------------------------------------------------ */
  /* Overlay                                                              */
  /* ------------------------------------------------------------------ */

  let uidCounter = 0;

  function themeVars(p) {
    return [
      `--bo-glow:${p.glow}`, `--bo-light:${p.light}`, `--bo-mid:${p.mid}`, `--bo-deep:${p.deep}`,

  /**
   * Erstellt das Overlay in `container` (sollte die volle Bildschirmhöhe haben).
   * opts.boss    { id, level, hp, maxHp }            Pflicht. Name und Typen kommen aus der PokéAPI.
   * opts.player  { id, level, hp, maxHp, team }      Pflicht. team: ['active','ok','fainted', ...]
   * opts.timer   Sekunden (Standard 180)
   * opts.potions [übrig, max]  (Standard [3, 3], laut Patch 8.0 in NG+10: [2, 2])
   * opts.xAttacks [übrig, max] (Standard [3, 3])
   * opts.intro   true/false (Standard true)
   * opts.still   true = Animationen angehalten (z. B. für Vorschaubilder)
   * opts.onStageTap(event), opts.onPotion(), opts.onXAttack(), opts.onGiveUp(), opts.onIntroEnd()
   */
  async function create(container, opts) {
    injectCSS();
    const o = Object.assign({ timer: 180, potions: [3, 3], xAttacks: [3, 3], intro: true, still: false }, opts);
    const uid = `bo${++uidCounter}_`;
    const root = document.createElement('div');
    root.className = 'bo' + (o.still ? ' bo--still' : '');
    root.innerHTML = `<p class="bo-state" role="status">${esc(T.loading)}</p>`;
    container.appendChild(root);

    let boss, player, bossImg, playerImg;
    try {
      [boss, player] = await Promise.all([loadPokemon(o.boss.id), loadPokemon(o.player.id)]);
      [bossImg, playerImg] = await Promise.all([loadArt(boss), loadArt(player)]);
    } catch (err) {
      root.innerHTML = `<p class="bo-state" role="alert">${esc(T.error)}</p>`;
      throw err;
    }

    const t1 = TYPES[boss.types[0]] ? boss.types[0] : 'normal';
    const p = TYPES[t1];
    root.setAttribute('style', themeVars(p));
    root.dataset.type = boss.types.join(' ');

    const chips = boss.types.map((t, i) => {
      const q = TYPES[t] || TYPES.normal;
      return `<span class="bo-chip" style="color:${mix(q.glow, '#ffffff', 0.35)}">${iconSvg(t)}${esc(boss.typeNames[i])}</span>`;
    }).join('');
    const typeLabel = boss.typeNames.join(', ');

    root.innerHTML = `
<div class="bo-top bo-hud">
  <div class="bo-panel">
    <div class="bo-row"><span class="bo-name" data-ref="pname">${esc(player.name)}</span><span class="bo-lv" data-ref="plv">${T.lv} ${o.player.level}</span></div>
    ${hpBar('bo-hp--player', `${T.kp} ${player.name}`)}
    <div class="bo-row bo-sub"><span class="bo-team" data-ref="team"></span><svg class="bo-spec-ic" data-ref="specic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.6 1.8 4.8 13.6h5.6L9 22.2l9.8-12.6h-5.6z"/></svg><span class="bo-spec" data-ref="spec" role="progressbar" aria-label="Spezialattacke"><i></i></span><span class="bo-kp" data-ref="pkp"></span></div>
    <div class="bo-mates" data-ref="mates"></div>
  </div>
  <div class="bo-timer" data-ref="timer" role="timer" aria-label="Verbleibende Zeit"></div>
</div>
<div class="bo-stage" data-ref="stage" role="button" tabindex="0" aria-label="${esc(boss.name)} angreifen">
  ${buildScene(boss.types, uid, boss.id)}
  <div class="bo-lift" data-ref="lift" aria-hidden="true"></div>
  <div class="bo-shadow" data-ref="bshadow"></div>
  <div class="bo-shadow" data-ref="pshadow"></div>
  <div class="bo-halo bo-halo--boss" data-ref="bhalo"></div>
  <div class="bo-halo bo-halo--player" data-ref="phalo"></div>
  <div class="bo-mon bo-mon--boss" data-ref="boss"><div class="bo-mon-fx" data-ref="bossfx"></div></div>
  <div class="bo-mon bo-mon--player" data-ref="player"><div class="bo-mon-fx" data-ref="playerfx"></div></div>
  ${buildFx(boss.types, uid, boss.id)}
  <div class="bo-lift bo-lift--fx" data-ref="liftfx" aria-hidden="true"></div>
  <div class="bo-impact" data-ref="impact" aria-hidden="true"></div>
  <div class="bo-banner" data-ref="banner" aria-label="${esc(T.boss)} ${esc(boss.name)}, Typ ${esc(typeLabel)}">
    <div class="bo-hex">${iconSvg(t1)}</div>
    <div class="bo-plate"><div class="bo-plate-in">
      <span class="bo-kicker">${esc(T.boss)}</span>
      <span class="bo-bname${boss.name.length > 9 ? ' is-long' : ''}">${esc(boss.name)}</span>
      <span class="bo-types">${chips}</span>

  <div class="bo-pills bo-pills--boss" data-ref="bpills"></div>

  <div class="bo-cframe" aria-hidden="true"></div>
